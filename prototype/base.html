</style></head><body><div id="nsBoot" lang="hi"><strong>निवेशक साथी खुल रहा है…</strong><p>धीमे नेटवर्क पर कुछ सेकंड लग सकते हैं। <small lang="en">Niveshak Saathi is loading.</small></p><p>पैसे भेज दिए या OTP बता दिया?<br><a href="tel:1930">अभी 1930 पर कॉल करें</a></p><noscript><p>यह ऐप चलाने के लिए ब्राउज़र में JavaScript चालू करें। साइबर धोखाधड़ी की शिकायत: <a href="https://cybercrime.gov.in/">cybercrime.gov.in</a></p></noscript></div><header><div class="brand"><span class="mark">N</span><div>Niveshak Saathi<div class="sub" data-en="Your investor safety companion" data-hi="निवेशक सुरक्षा में आपका साथी"></div></div></div><select id="language" aria-label="Language / भाषा"><option value="en">English</option><option value="hi">हिन्दी</option></select></header><main><nav role="tablist" aria-label="Tools"><button role="tab" aria-selected="true" data-tab="check" data-en="01  Check a message" data-hi="01  संदेश जाँचें"></button><button role="tab" aria-selected="false" data-tab="route" data-en="02  Where to complain" data-hi="02  कहाँ शिकायत करें"></button><button role="tab" aria-selected="false" data-tab="draft" data-en="03  Prepare a complaint" data-hi="03  शिकायत तैयार करें"></button></nav>
<section id="check" role="tabpanel"><div class="eyebrow" data-en="Pause. Check. Protect." data-hi="रुकें। जाँचें। सुरक्षित रहें।"></div><h1 data-en="Does this message feel wrong?" data-hi="क्या यह संदेश संदिग्ध लगता है?"></h1><p class="lede" data-en="Understand the warning signs before you send money or share information." data-hi="पैसे भेजने या जानकारी साझा करने से पहले खतरे के संकेत समझें।"></p><div class="grid"><div class="card"><h2 data-en="Let’s look at it together" data-hi="आइए, इसे साथ समझें"></h2><p class="small" data-en="Remove names, phone numbers and account details first. The checker runs in your browser; your message is not sent to us." data-hi="पहले नाम, फ़ोन नंबर और खाता विवरण हटा दें। जाँच आपके ब्राउज़र में होती है; संदेश हमें नहीं भेजा जाता।"></p><label for="message" data-en="Paste the message" data-hi="संदेश यहाँ डालें"></label><textarea id="message" maxlength="6000" data-en-placeholder="Example: Guaranteed IPO allotment. Pay today to a personal UPI ID…" data-hi-placeholder="उदाहरण: IPO में पक्का आवंटन। आज ही निजी UPI आईडी पर पैसे भेजें…"></textarea><div class="actions"><button class="sample" id="example" data-en="Try a suspicious example" data-hi="संदिग्ध उदाहरण देखें"></button><button class="sample" id="neutral" data-en="Try an ordinary example" data-hi="सामान्य उदाहरण देखें"></button></div><div class="actions"><button class="primary" id="analyse" data-en="Check warning signs" data-hi="खतरे के संकेत जाँचें"></button><button id="clear" data-en="Clear message" data-hi="संदेश मिटाएँ"></button></div><div id="result" class="result hidden" aria-live="polite"></div></div><aside class="side"><div class="card dark"><span class="pill" data-en="No tips. No commissions." data-hi="न टिप्स। न कमीशन।"></span><h2 data-en="A safer next step starts with a pause." data-hi="सुरक्षित कदम की शुरुआत रुकने से होती है।"></h2><p data-en="Never share an OTP, PIN or password. Verify an offer independently before acting." data-hi="OTP, PIN या पासवर्ड कभी किसी को न बताएँ। कोई भी कदम उठाने से पहले प्रस्ताव की खुद जाँच करें।"></p></div><div class="card"><h3 data-en="Already sent money to suspected fraud?" data-hi="संदिग्ध धोखाधड़ी में पैसे भेज दिए?"></h3><p class="small" data-en="Contact your bank or payment provider immediately and report promptly. Do not wait for this checker." data-hi="तुरंत अपने बैंक या भुगतान सेवा से संपर्क करें और रिपोर्ट करें। इस जाँच का इंतज़ार न करें।"></p><a class="link" href="tel:1930" data-en="Call 1930" data-hi="1930 पर कॉल करें"></a><a class="link" href="https://cybercrime.gov.in/" target="_blank" rel="noopener" data-en="Official cybercrime portal" data-hi="आधिकारिक साइबर अपराध पोर्टल"></a></div></aside></div></section>
<section id="route" role="tabpanel" class="hidden"><div class="eyebrow" data-en="Know your next step" data-hi="अगला कदम जानें"></div><h1 data-en="You don’t have to figure it out alone." data-hi="सही रास्ता समझने में हम साथ हैं।"></h1><p class="lede" data-en="Choose what happened. We’ll explain where to begin." data-hi="बताएँ क्या हुआ। हम समझाएँगे कि शुरुआत कहाँ करें।"></p><div class="grid"><div class="card"><label for="issue" data-en="What do you need help with?" data-hi="आपको किस विषय में मदद चाहिए?"></label><select id="issue"><option value="fraud" data-en="Suspicious offer or possible fraud" data-hi="संदिग्ध प्रस्ताव या धोखाधड़ी"></option><option value="broker" data-en="Complaint about a broker or listed company" data-hi="ब्रोकर या शेयर बाज़ार में लिस्टेड कंपनी की शिकायत"></option><option value="family" data-en="Nominee, inherited or old investments" data-hi="नॉमिनी, विरासत में मिले या पुराने निवेश"></option></select><div id="follow"></div><div id="routeResult" aria-live="polite"></div></div><aside class="card side"><h2 data-en="Keep evidence safely" data-hi="सबूत सुरक्षित रखें"></h2><p class="small" data-en="Keep originals on your own device. This prototype does not accept document uploads." data-hi="असली कागज़ और रिकॉर्ड अपने ही फ़ोन या कंप्यूटर में सुरक्षित रखें। यह ऐप कोई दस्तावेज़ अपलोड नहीं लेता।"></p><ul><li data-en="Messages and relevant dates" data-hi="संदेश और संबंधित तारीखें"></li><li data-en="Payment reference, if money was sent" data-hi="पैसे भेजे हों तो भुगतान का रेफ़रेंस नंबर"></li><li data-en="Previous complaint and response" data-hi="पिछली शिकायत और जवाब"></li></ul><p class="note" data-en="A complaint does not guarantee a refund. Use official channels and avoid anyone promising guaranteed recovery." data-hi="शिकायत करने से पैसा वापस मिलने की गारंटी नहीं होती। आधिकारिक रास्ता ही अपनाएँ; पैसा पक्का वापस दिलाने का वादा करने वालों से बचें।"></p></aside></div></section>
<section id="draft" role="tabpanel" class="hidden"><div class="eyebrow" data-en="Put your concern into words" data-hi="अपनी बात लिखें"></div><h1 data-en="Prepare. Review. Submit yourself." data-hi="तैयार करें। जाँचें। खुद जमा करें।"></h1><p class="lede" data-en="Make a clear draft with only the facts you know. Nothing is submitted automatically." data-hi="सिर्फ़ वही बातें लिखें जो आप पक्का जानते हैं, और साफ़ मसौदा बनाएँ। कुछ भी अपने-आप जमा नहीं होता।"></p><div class="grid"><div class="card"><label for="summary" data-en="What happened? Use placeholders for private details." data-hi="क्या हुआ? निजी जानकारी असली न लिखें, उसकी जगह [खाता नंबर] जैसा लिखें।"></label><textarea id="summary" maxlength="3000"></textarea><label for="outcome" data-en="What resolution are you requesting?" data-hi="आप क्या समाधान चाहते हैं?"></label><input id="outcome" maxlength="350"><div class="actions"><button class="primary" id="generate" data-en="Create draft" data-hi="मसौदा बनाएँ"></button></div><div id="draftArea" class="hidden"><label for="draftText" data-en="Review and edit your draft" data-hi="मसौदा पढ़ें और ज़रूरत हो तो बदलें"></label><textarea id="draftText" style="min-height:310px"></textarea><div class="actions"><button id="download" data-en="Download text" data-hi="टेक्स्ट डाउनलोड करें"></button><button id="read" data-en="Read aloud" data-hi="सुनें"></button><button id="stop" data-en="Stop reading" data-hi="सुनाना रोकें"></button></div><p class="small" data-en="Read-aloud uses an installed local voice only. Availability depends on your device. Downloaded files stay on your device until you delete them." data-hi="पढ़कर सुनाने के लिए सिर्फ़ फ़ोन में इंस्टॉल आवाज़ इस्तेमाल होती है, जो हर फ़ोन में नहीं होती। डाउनलोड की गई फ़ाइल तब तक फ़ोन में रहती है, जब तक आप उसे मिटा न दें।"></p></div><div id="status" role="status"></div></div><aside class="card side"><h2 data-en="My preparation checklist" data-hi="मेरी तैयारी की सूची"></h2><p class="small" data-en="For this session only. This is your checklist, not an official complaint status." data-hi="यह सूची सिर्फ़ अभी के लिए है। यह आपकी अपनी सूची है, आधिकारिक शिकायत की स्थिति नहीं।"></p><div class="progress"><div id="bar" style="width:0%"></div></div><div class="checks"><label><input type="checkbox"><span data-en="I saved relevant evidence" data-hi="मैंने संबंधित सबूत सुरक्षित रखे"></span></label><label><input type="checkbox"><span data-en="I checked the official complaint route" data-hi="मैंने आधिकारिक शिकायत का रास्ता जाँचा"></span></label><label><input type="checkbox"><span data-en="I reviewed the facts in my draft" data-hi="मैंने मसौदे के तथ्य जाँचे"></span></label><label><input type="checkbox"><span data-en="After submitting, I saved the acknowledgement" data-hi="जमा करने के बाद मैंने पावती सुरक्षित रखी"></span></label></div><p id="count" class="small"></p><button id="reset" data-en="Clear this session" data-hi="यहाँ भरी सारी जानकारी मिटाएँ"></button></aside></div></section>
<footer><span data-en="Independent educational prototype • Not affiliated with SEBI or any government agency • No investment recommendations" data-hi="स्वतंत्र शैक्षिक प्रोटोटाइप (परीक्षण ऐप) • SEBI या किसी सरकारी संस्था से जुड़ा नहीं • निवेश की कोई सिफ़ारिश नहीं"></span><br><span data-en="Official references checked 2 October 2026:" data-hi="आधिकारिक संदर्भ 2 अक्टूबर 2026 को जाँचे गए:"></span> <a href="https://scores.sebi.gov.in/faqs" target="_blank" rel="noopener">SCORES</a> · <a href="https://cybercrime.gov.in/" target="_blank" rel="noopener" data-en="Cybercrime" data-hi="साइबर अपराध">Cybercrime</a> · <a href="https://www.iepf.gov.in/content/iepf/global/master/Home/HelpAndFAQs/faqs-for-claimants.html" target="_blank" rel="noopener">IEPF</a><br><span data-en="No analytics or financial account connection. Inputs are held in this page’s memory and cleared on reload. The one exception: if you turn on “Remember this list on this phone” in the Family asset map, that list’s choices and names are kept in this browser until you turn it off or clear the session. The app itself sends nothing you type. Official links need internet access. The host of a public link may keep standard access logs and set its own cookies (the GitHub Pages live link sets none); the app itself sets none." data-hi="इस्तेमाल पर नज़र रखने वाला कोई टूल (एनालिटिक्स) नहीं, और किसी बैंक या वित्तीय खाते से कोई जुड़ाव नहीं। जानकारी इस पेज की मेमोरी में रहती है और पेज दोबारा लोड करने पर मिट जाती है। अपवाद सिर्फ़ एक: अगर आप परिवार की निवेश सूची में “यह सूची इसी फ़ोन पर याद रखें” चालू करते हैं, तो उस सूची के विकल्प और नाम इस ब्राउज़र में तब तक रहते हैं जब तक आप उसे बंद न करें या सारी जानकारी न मिटाएँ। ऐप खुद आपका लिखा कहीं नहीं भेजता। आधिकारिक लिंक के लिए इंटरनेट चाहिए। सार्वजनिक लिंक की होस्टिंग सेवा सामान्य एक्सेस लॉग (कौन-सा पेज कब खुला) रख सकती है और अपनी कुकी लगा सकती है (GitHub Pages वाला लाइव लिंक कोई कुकी नहीं लगाता); ऐप खुद कोई कुकी नहीं लगाता।"></span></footer></main>
<script>
let lang='en',active='check',lastChecked=null;setTimeout(()=>document.documentElement.classList.add('ns-ready'),20000);const $=id=>document.getElementById(id),t=(en,hi)=>lang==='hi'?hi:en;
function assess(text){return []} // replaced in upgrade.js: local engine + content/warnings.json
function go(tab){active=tab;document.querySelectorAll('[role=tabpanel]').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));if('speechSynthesis'in window)speechSynthesis.cancel()}
function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelectorAll('[data-en-placeholder]').forEach(e=>e.placeholder=e.dataset[lang+'Placeholder']);renderRoute();progress();if(lastChecked!==null)showResult(lastChecked)}
function showResult(text){} // replaced in upgrade.js
let paid='no',contacted='no';function renderRoute(){} // replaced in upgrade.js: routes come from content/routes.json
function progress(){const n=document.querySelectorAll('.checks input:checked').length;$('bar').style.width=n*25+'%';$('count').textContent=t(`${n} of 4 preparation steps complete`, `तैयारी के 4 में से ${n} कदम पूरे`)}
