bank or the helpline.","hi":"सामान्य सुरक्षा कदम: विवरण अपने बैंक या हेल्पलाइन से पक्का करें।"},"recoveryNote":{"en":"Recovery is not guaranteed. No genuine authority asks for a fee to return your money.","hi":"पैसा वापस मिलने की गारंटी नहीं है। कोई भी असली सरकारी विभाग या संस्था पैसे लौटाने के लिए फ़ीस नहीं माँगती।"},"save":{"en":"Save my safety steps","hi":"मेरे सुरक्षा कदम सहेजें"},"saveHeader":{"en":"MY SAFETY STEPS — not an official complaint","hi":"मेरे सुरक्षा कदम — आधिकारिक शिकायत नहीं"},"nextRoute":{"en":"Find the official complaint route","hi":"आधिकारिक शिकायत का रास्ता देखें"},"nextDraft":{"en":"Prepare my complaint","hi":"मेरी शिकायत तैयार करें"},"checkEntry":{"en":"Already replied, paid or shared details? Get safety steps","hi":"जवाब दिया, भुगतान किया या जानकारी दे दी? सुरक्षा कदम देखें"},"actions":[{"id":"stop-contact","when":["ongoing"],"text":{"en":"Stop now: end the call or screen sharing, do not reply, and do not send any more money or codes.","hi":"अभी रुकें: कॉल या स्क्रीन शेयरिंग बंद करें, जवाब न दें, और कोई और पैसा या कोड न भेजें।"},"sourceId":"apps"},{"id":"call-bank","when":["paid","shared"],"text":{"en":"Contact your bank or payment provider immediately, using the number on your card, passbook or official app. Ask them to block further debits and record your complaint.","hi":"तुरंत अपने बैंक या भुगतान सेवा से संपर्क करें; नंबर अपने कार्ड, पासबुक या आधिकारिक ऐप से लें। खाते से आगे पैसा कटना रोकने और शिकायत दर्ज करने को कहें।"},"sourceId":"cyber"},{"id":"block-card","when":["card"],"text":{"en":"Paid by card? Ask your bank to block the card straight away, using the number on the back of the card or the bank's official app.","hi":"कार्ड से भुगतान किया? तुरंत बैंक से कार्ड ब्लॉक करवाएँ: कार्ड के पीछे लिखे नंबर पर कॉल करें या बैंक का आधिकारिक ऐप इस्तेमाल करें।"},"general":true},{"id":"report-1930","when":["paid"],"helplineId":"cyber-1930","text":{"en":"Call 1930 or report at the National Cyber Crime Reporting Portal as quickly as possible. Write down the acknowledgement number.","hi":"जितनी जल्दी हो सके 1930 पर कॉल करें या राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल पर रिपोर्ट करें। पावती नंबर लिख लें।"},"sourceId":"cyber"},{"id":"upi-app","when":["upi"],"text":{"en":"Paid by UPI? Report it to your bank as a fraudulent payment straight away. The UPI Help option in payment apps asks you to contact your bank about fraudulent transactions, and it does not take complaints about completed person-to-person payments.","hi":"UPI से भुगतान किया? तुरंत अपने बैंक से शिकायत करें और बताएँ कि यह धोखाधड़ी वाला भुगतान है। भुगतान ऐप का UPI Help विकल्प धोखाधड़ी के मामलों में बैंक से संपर्क करने को कहता है, और किसी व्यक्ति को किए गए पूरे हो चुके (P2P) भुगतान की शिकायत नहीं लेता।"},"sourceId":"npci-upi-help"},{"id":"wallet-provider","when":["wallet"],"text":{"en":"Paid from a wallet or prepaid card? Report the payment to the wallet provider through its official app.","hi":"वॉलेट या प्रीपेड कार्ड से भुगतान किया? वॉलेट सेवा के आधिकारिक ऐप से भुगतान की शिकायत करें।"},"general":true},{"id":"secure-credentials","when":["shared"],"text":{"en":"First uninstall any screen-sharing or remote-access app you were asked to install, such as AnyDesk. Then, from your own phone, change the UPI PIN and passwords you shared, using only the official bank or UPI app.","hi":"पहले वह स्क्रीन-शेयरिंग या रिमोट-एक्सेस ऐप (जैसे AnyDesk) हटाएँ, जिसे इंस्टॉल करने को आपसे कहा गया था। फिर अपने ही फ़ोन से, केवल बैंक या UPI के आधिकारिक ऐप में, वे UPI PIN और पासवर्ड बदलें जो आपने किसी को बताए थे।"},"general":true},{"id":"remove-app","when":["clicked"],"text":{"en":"Uninstall any app you installed from a message link, and do not enter details on that link again. Use only apps verified through official exchange or SEBI resources.","hi":"संदेश के लिंक से इंस्टॉल किया गया ऐप हटाएँ और उस लिंक पर दोबारा जानकारी न डालें। केवल वही ऐप इस्तेमाल करें जिनकी जाँच आपने एक्सचेंज या SEBI की आधिकारिक वेबसाइट पर की हो।"},"sourceId":"apps"},{"id":"check-accounts","when":["clicked","shared"],"text":{"en":"Check your bank and UPI app for payments you do not recognise, and report any to your bank immediately.","hi":"अपने बैंक और UPI ऐप में देखें कि कोई ऐसा भुगतान तो नहीं हुआ जो आपने नहीं किया। ऐसा कोई भुगतान दिखे तो तुरंत बैंक को बताएँ।"},"general":true},{"id":"no-recovery-fee","when":["paid"],"text":{"en":"Do not pay any “recovery”, “tax” or “release” fee to get your money back.","hi":"पैसे वापस पाने के लिए कोई “रिकवरी”, “टैक्स” या “रिलीज़” फ़ीस न दें।"},"sourceId":"apps"},{"id":"do-not-engage","when":["received"],"text":{"en":"Do not reply, click links or pay. If the message claims to be from an institution, contact that institution through its official website or app, not the number in the message.","hi":"जवाब न दें, लिंक न खोलें और भुगतान न करें। संदेश किसी संस्था के नाम से हो तो उस संस्था से उसकी आधिकारिक वेबसाइट या ऐप से संपर्क करें, संदेश में दिए नंबर से नहीं।"},"sourceId":"scam"},{"id":"report-suspicion","when":["received","clicked","shared"],"unless":["paid"],"text":{"en":"If you suspect a cybercrime, use the official National Cyber Crime Reporting Portal for reporting guidance.","hi":"साइबर अपराध का संदेह हो तो रिपोर्टिंग के लिए आधिकारिक राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल देखें।"},"sourceId":"cyber"},{"id":"report-chakshu","when":["received","clicked"],"unless":["paid"],"text":{"en":"Report the suspected fraud call, SMS or WhatsApp message on Chakshu (Sanchar Saathi) if the sender's number is visible. If money was lost, report to 1930 instead.","hi":"संदिग्ध धोखाधड़ी कॉल, SMS या व्हाट्सऐप संदेश की रिपोर्ट चक्षु (संचार साथी) पर करें, अगर भेजने वाले का नंबर दिख रहा हो। पैसे गए हों तो इसके बजाय 1930 पर रिपोर्ट करें।"},"sourceId":"chakshu"},{"id":"keep-evidence","when":["any"],"text":{"en":"Keep evidence: screenshots of messages, the sender's number or ID, and any transaction reference. Do not delete the chat.","hi":"सबूत रखें: संदेशों के स्क्रीनशॉट, भेजने वाले का नंबर या आईडी, और लेन-देन का UTR/रेफ़रेंस नंबर। चैट न मिटाएँ।"},"sourceId":"cyber"}]},"packet":{"schemaVersion":1,"intro":{"en":"Build a private Action Packet: the facts, dates, evidence and official route in one file that you submit yourself. Nothing is uploaded or submitted by this app.","hi":"एक निजी एक्शन पैकेट बनाएँ: तथ्य, तारीखें, सबूत और आधिकारिक रास्ता एक ही फ़ाइल में, जिसे आप स्वयं जमा करें। यह ऐप कुछ भी अपलोड या जमा नहीं करता।"},"routeLabel":{"en":"Official route from Find help:","hi":"मदद खोजें से आधिकारिक रास्ता:"},"routeChange":{"en":"Change the route in Find help","hi":"मदद खोजें में रास्ता बदलें"},"fields":{"entity":{"label":{"en":"Which institution or person is it about?","hi":"यह किस संस्था या व्यक्ति के बारे में है?"},"why":{"en":"A complaint must name who it is about.","hi":"शिकायत में बताना ज़रूरी है कि वह किसके बारे में है।"}},"when":{"label":{"en":"When did it happen? Month and year are enough.","hi":"यह कब हुआ? महीना और साल काफ़ी है।"},"why":{"en":"Dates help the institution find your case, and official complaint systems have time limits.","hi":"तारीखों से संस्था को आपका मामला ढूँढने में मदद मिलती है, और आधिकारिक शिकायत प्रणालियों की समय-सीमा होती है।"}},"complainedOn":{"label":{"en":"When did you first complain to them? (optional)","hi":"आपने उनसे पहली बार कब शिकायत की? (वैकल्पिक)"},"why":{"en":"Escalation levels ask for the date of your earlier complaint.","hi":"आगे की शिकायत में पिछली शिकायत की तारीख पूछी जाती है।"}},"amount":{"label":{"en":"Amount involved (optional)","hi":"कितनी रकम का मामला है? (वैकल्पिक)"},"why":{"en":"Helps describe the loss. Leave it blank if you prefer.","hi":"नुकसान बताने में मदद करती है। चाहें तो खाली छोड़ दें।"}},"ref":{"label":{"en":"Last 4 characters of a transaction or complaint reference (optional)","hi":"लेन-देन या शिकायत के रेफ़रेंस नंबर के अंतिम 4 अंक या अक्षर (वैकल्पिक)"},"why":{"en":"Only the last 4. Never type a full account, card or reference number here.","hi":"केवल अंतिम 4। यहाँ कभी पूरा खाता, कार्ड या संदर्भ नंबर न लिखें।"}}},"actionsTitle":{"en":"What have you already done?","hi":"आप अब तक क्या कर चुके हैं?"},"actions":[{"id":"complained","label":{"en":"I complained to the institution","hi":"मैंने संस्था से शिकायत की"}},{"id":"number","label":{"en":"I have a complaint or acknowledgement number","hi":"मेरे पास शिकायत या पावती नंबर है"}},{"id":"reported-1930","label":{"en":"I reported it on 1930 or the cybercrime portal","hi":"मैंने 1930 या साइबर अपराध पोर्टल पर रिपोर्ट की"}},{"id":"told-bank","label":{"en":"I told my bank or payment provider","hi":"मैंने अपने बैंक या भुगतान सेवा को बताया"}},{"id":"escalated","label":{"en":"I filed on an official portal such as SCORES, RBI CMS or Bima Bharosa","hi":"मैंने SCORES, RBI CMS या बीमा भरोसा जैसे आधिकारिक पोर्टल पर शिकायत की"}}],"evidenceTitle":{"en":"Which evidence do you have?","hi":"आपके पास कौन-से सबूत हैं?"},"evidence":[{"id":"messages","label":{"en":"Screenshots of messages or chats","hi":"संदेशों या चैट के स्क्रीनशॉट"}},{"id":"payments","label":{"en":"Payment receipts or transaction references","hi":"भुगतान रसीदें या लेन-देन संदर्भ"}},{"id":"statements","label":{"en":"Statement entries, with numbers covered except the last four digits","hi":"स्टेटमेंट की एंट्री, अंतिम चार अंक छोड़कर नंबर छिपाकर"}},{"id":"letters","label":{"en":"Emails or letters exchanged with the institution","hi":"संस्था को भेजे या उससे मिले ईमेल या पत्र"}},{"id":"reply","label":{"en":"The institution's reply","hi":"संस्था का जवाब"}},{"id":"documents","label":{"en":"Policy, contract notes or other documents","hi":"पॉलिसी, कॉन्ट्रैक्ट नोट या अन्य दस्तावेज़"}}],"doNotInclude":{"text":{"en":"Never include OTPs, PINs, passwords or CVV: banks and payment system operators never ask for them. In this packet, show only the last four digits of account and card numbers; give full numbers only in the official complaint form if it asks for them.","hi":"OTP, PIN, पासवर्ड या CVV कभी शामिल न करें: बैंक और भुगतान सेवाएँ इन्हें कभी नहीं माँगतीं। इस पैकेट में खाता और कार्ड नंबर के केवल अंतिम चार अंक दिखाएँ; पूरे नंबर केवल आधिकारिक शिकायत फ़ॉर्म में दें, अगर वह माँगे।"},"sourceId":"rbi-never-ask"},"packetHeader":{"en":"MY ACTION PACKET: prepared by me and NOT submitted. I will submit it myself through the official channel.","hi":"मेरा एक्शन पैकेट: मैंने तैयार किया है और यह जमा नहीं हुआ है। मैं इसे स्वयं आधिकारिक माध्यम से जमा करूँगा/करूँगी।"},"contactLine":{"en":"[Name and contact details: add them only in the official complaint form]","hi":"[नाम और संपर्क विवरण: केवल आधिकारिक शिकायत फ़ॉर्म में जोड़ें]"},"ackLine":{"en":"Acknowledgement number: ____________   Date: ____________","hi":"पावती नंबर: ____________   तारीख: ____________"},"generate":{"en":"Create my Action Packet","hi":"मेरा एक्शन पैकेट बनाएँ"},"checksTitle":{"en":"Packet check","hi":"पैकेट की जाँच"},"essentialsReady":{"en":"Complaint essentials ready:","hi":"शिकायत की ज़रूरी बातें तैयार:"},"essentials":[{"id":"entity","label":{"en":"Who it is about","hi":"यह किसके बारे में है"}},{"id":"when","label":{"en":"When it happened","hi":"यह कब हुआ"}},{"id":"summary","label":{"en":"What happened, in a few sentences","hi":"क्या हुआ, कुछ वाक्यों में"}},{"id":"resolution","label":{"en":"The resolution you want","hi":"आप क्या समाधान चाहते हैं"}},{"id":"evidence","label":{"en":"At least one piece of evidence","hi":"कम से कम एक सबूत"}},{"id":"number","label":{"en":"Your earlier complaint number and date, if you complained before","hi":"पहले शिकायत की है तो उसका नंबर और तारीख"},"sourceId":"rbi-ios-faq"}],"privacyFound":{"en":"Private details found in the packet:","hi":"पैकेट में निजी जानकारी मिली:"},"privacyNone":{"en":"No common private details found. Read the text yourself too.","hi":"आम निजी जानकारी नहीं मिली। फिर भी पूरा पैकेट खुद पढ़ लें।"},"secretsBlock":{"en":"Remove OTPs, PINs, passwords, CVV and full card numbers before saving: press \"Mask these details\" above.","hi":"सहेजने से पहले OTP, PIN, पासवर्ड, CVV और पूरे कार्ड नंबर हटाएँ: ऊपर \"यह जानकारी छिपाएँ\" दबाएँ।"},"reviewLabel":{"en":"Read and edit your packet","hi":"अपना पैकेट पढ़ें और ज़रूरत हो तो बदलें"},"maskButton":{"en":"Mask these details","hi":"यह जानकारी छिपाएँ"},"reviewConfirm":{"en":"I have read the packet and removed anything private.","hi":"मैंने पैकेट पढ़ लिया है और निजी जानकारी हटा दी है।"},"download":{"en":"Download my packet","hi":"मेरा पैकेट डाउनलोड करें"},"print":{"en":"Print my packet","hi":"मेरा पैकेट प्रिंट करें"},"saveNote":{"en":"The packet stays on your device. Submit it yourself through the official channel, and write the acknowledgement number on it.","hi":"पैकेट आपके फ़ोन या कंप्यूटर में ही रहता है। इसे खुद आधिकारिक माध्यम से जमा करें, और उस पर पावती नंबर लिखें।"}},"family":{"schemaVersion":1,"tabLabel":{"en":"Family safety","hi":"परिवार की सुरक्षा"},"eyebrow":{"en":"Ready before it is needed","hi":"ज़रूरत से पहले तैयारी"},"title":{"en":"Family safety and nominee readiness","hi":"परिवार की सुरक्षा और नॉमिनी की तैयारी"},"intro":{"en":"A short checklist for the family's investments. It never asks for values, account numbers, passwords, documents or relatives' details, and your ticks stay only in this page.","hi":"परिवार के निवेश के लिए एक छोटी सूची। यह कभी राशि, खाता नंबर, पासवर्ड, दस्तावेज़ या रिश्तेदारों की जानकारी नहीं माँगती, और आपके चुने विकल्प केवल इसी पेज में रहते हैं।"},"holdingsQuestion":{"en":"1. What does the family hold? Choose all that apply.","hi":"1. परिवार के पास क्या है? जो भी लागू हो, सब चुनें।"},"holdings":[{"id":"demat","label":{"en":"Shares in a demat account","hi":"डीमैट खाते में शेयर"}},{"id":"mf","label":{"en":"Mutual funds","hi":"म्यूचुअल फ़ंड"}},{"id":"physical","label":{"en":"Paper (physical) share certificates","hi":"कागज़ी (भौतिक) शेयर प्रमाणपत्र"}},{"id":"unknown","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"nomineeQuestion":{"en":"2. Have you checked the nominees recently?","hi":"2. क्या आपने हाल में नॉमिनी की जानकारी जाँची है?"},"nomineeOptions":[{"id":"checked","label":{"en":"Yes, checked","hi":"हाँ, जाँचा है"}},{"id":"not-checked","label":{"en":"No","hi":"नहीं"}},{"id":"unknown","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"showList":{"en":"Show our family checklist","hi":"हमारी पारिवारिक सूची दिखाएँ"},"chooseFirst":{"en":"Choose at least one option in question 1.","hi":"प्रश्न 1 में कम से कम एक विकल्प चुनें।"},"listTitle":{"en":"Our family checklist","hi":"हमारी पारिवारिक सूची"},"firstTag":{"en":"Do this first","hi":"पहले यह करें"},"doneLabel":{"en":"Done","hi":"हो गया"},"generalLabel":{"en":"General safety step (not from a single official page).","hi":"सामान्य सुरक्षा कदम (किसी एक आधिकारिक पेज से नहीं)।"},"cardTitle":{"en":"OUR FAMILY ACTION CARD","hi":"हमारा पारिवारिक एक्शन कार्ड"},"cardWarning":{"en":"Do not write passwords, PINs, OTPs, account numbers or document numbers on this card.","hi":"इस कार्ड पर पासवर्ड, PIN, OTP, खाता नंबर या दस्तावेज़ नंबर न लिखें।"},"cardBlank":{"en":"Where our statements and certificates are kept: ______________________","hi":"हमारे स्टेटमेंट और प्रमाणपत्र कहाँ रखे हैं: ______________________"},"download":{"en":"Download our family card","hi":"हमारा पारिवारिक कार्ड डाउनलोड करें"},"print":{"en":"Print our family card","hi":"हमारा पारिवारिक कार्ड प्रिंट करें"},"items":[{"id":"nominee","when":["demat","mf"],"text":{"en":"Check that each demat account and mutual fund folio has a nominee, or that your decision not to add one (opt-out) is recorded. You can add or change a nominee with your depository participant (DP), the fund or its registrar, online or on paper.","hi":"जाँचें कि हर डीमैट खाते और म्यूचुअल फ़ंड फ़ोलियो में नॉमिनी है, या नॉमिनी न रखने (ऑप्ट-आउट) का फ़ैसला दर्ज है। नॉमिनी आप अपने DP (डिपॉज़िटरी पार्टिसिपेंट, जहाँ डीमैट खाता है), फ़ंड या उसके रजिस्ट्रार के पास, ऑनलाइन या फ़ॉर्म भरकर, जोड़ या बदल सकते हैं।"},"sourceId":"sebi-nomination-2026"},{"id":"no-freeze","when":["demat","mf"],"text":{"en":"SEBI's 2026 nomination rules ask DPs and fund registrars to send reminders twice a year to accounts and folios without a nominee. The rules do not provide for freezing them. A message that threatens freezing and asks for payment is a warning sign.","hi":"SEBI के 2026 के नॉमिनी नियमों के अनुसार, जिन डीमैट खातों और फ़ोलियो में नॉमिनी नहीं है, उन्हें DP और फ़ंड के रजिस्ट्रार साल में दो बार याद दिलाने वाले संदेश भेजते हैं। इन नियमों में उन्हें फ़्रीज़ (बंद) करने की कोई बात नहीं है। फ़्रीज़ करने की धमकी देकर भुगतान माँगने वाला संदेश धोखाधड़ी का संकेत है।"},"sourceId":"sebi-nomination-2026"},{"id":"contact-kyc","when":["demat"],"text":{"en":"Keep your mobile number, email and address up to date with your broker or depository participant (DP), and tell them whenever these change.","hi":"अपने ब्रोकर या DP (डिपॉज़िटरी पार्टिसिपेंट) के पास अपना मोबाइल नंबर, ईमेल और पता सही (अपडेट) रखें, और इनमें बदलाव होने पर उन्हें बताएँ।"},"sourceId":"sebi-dos-donts"},{"id":"records","when":["any"],"text":{"en":"Make sure a trusted family member knows where statements, certificates and policy papers are kept. Never share or write down passwords, PINs or OTPs.","hi":"पक्का करें कि परिवार का कोई भरोसेमंद सदस्य जानता हो कि स्टेटमेंट, प्रमाणपत्र और पॉलिसी के कागज़ कहाँ रखे हैं। पासवर्ड, PIN या OTP कभी किसी को न बताएँ, न कहीं लिखें।"},"general":true},{"id":"physical-demat","when":["physical"],"text":{"en":"Paper share certificates must be converted to demat form before they can be sold or transferred. You need a demat account for this.","hi":"कागज़ी शेयर प्रमाणपत्रों को बेचने या ट्रांसफ़र करने से पहले डीमैट रूप में बदलवाना होता है। इसके लिए डीमैट खाता चाहिए।"},"sourceId":"sebi-physical-faq"},{"id":"physical-drf","when":["physical"],"text":{"en":"To convert them, submit the certificates with a Demat Request Form (DRF) to your depository participant (DP), where your demat account is.","hi":"बदलवाने के लिए प्रमाणपत्र, डीमैट अनुरोध फ़ॉर्म (DRF) के साथ, अपने DP (डिपॉज़िटरी पार्टिसिपेंट, जहाँ डीमैट खाता है) को जमा करें।"},"sourceId":"sebi-depository-faq"},{"id":"contact-kyc-physical","when":["physical"],"text":{"en":"For paper share certificates, ask the company or its registrar (RTA) to update your address and contact details.","hi":"कागज़ी शेयर प्रमाणपत्रों के लिए, अपना पता और संपर्क विवरण अपडेट करने को कंपनी या उसके रजिस्ट्रार (RTA) से कहें।"},"sourceId":"sebi-rta-faq"},{"id":"physical-window","when":["physical"],"text":{"en":"SEBI opened a special window from 5 February 2026 to 4 February 2027 for some old physical transfer requests. Ask the registrar whether it applies to you.","hi":"SEBI ने कुछ पुराने कागज़ी शेयर ट्रांसफ़र अनुरोधों के लिए 5 फ़रवरी 2026 से 4 फ़रवरी 2027 तक विशेष अवधि खोली है। रजिस्ट्रार से पूछें कि क्या यह आप पर लागू है।"},"sourceId":"sebi-relodgement-2026"},{"id":"old-holdings","when":["physical","demat","unknown"],"text":{"en":"Unclaimed dividends move to the IEPF after seven years, and the shares follow if dividends stay unclaimed for seven years in a row. Check old holdings with the company or its registrar, or use \"Old shares or unclaimed dividends\" in Find help.","hi":"बिना दावे वाला डिविडेंड (लाभांश) सात साल बाद IEPF में चला जाता है, और लगातार सात साल डिविडेंड न लेने पर शेयर भी। अपनी पुरानी होल्डिंग के बारे में कंपनी या उसके रजिस्ट्रार से पूछें, या मदद खोजें में \"पुराने शेयर या बिना दावे वाला लाभांश\" चुनें।"},"sourceId":"sebi-rta-faq"},{"id":"entity-contact","when":["any"],"text":{"en":"Note the official contact of each depository participant, fund house and company registrar, taken from their official websites, not from messages.","hi":"हर DP, फ़ंड हाउस और कंपनी रजिस्ट्रार का आधिकारिक संपर्क उनकी आधिकारिक वेबसाइट से लिखकर रखें, संदेशों से नहीं।"},"general":true},{"id":"no-paid-agents","when":["any"],"text":{"en":"Be careful with unsolicited offers to recover old shares or unclaimed money for a fee. You can claim yourself through the company, its registrar and the official IEPF process.","hi":"पुराने शेयर या बिना दावे वाला पैसा शुल्क लेकर वापस दिलाने के अनचाहे प्रस्तावों से सावधान रहें। आप स्वयं कंपनी, उसके रजिस्ट्रार और IEPF की आधिकारिक प्रक्रिया से दावा कर सकते हैं।"},"general":true},{"id":"start-unknown","when":["unknown"],"text":{"en":"Not sure what the family holds? Start with recent statements, dividend letters and emails from companies or funds, then ask each institution in writing.","hi":"पक्का नहीं पता कि परिवार के पास क्या है? हाल के स्टेटमेंट, डिविडेंड पत्र और कंपनियों या फ़ंड के ईमेल से शुरू करें, फिर हर संस्था से लिखित में पूछें।"},"general":true}]},"translations":{"schemaVersion":1,"texts":{"banner.urgent":{"en":"Sent money, shared an OTP or installed an app because of a message? Get urgent help first.","hi":"किसी संदेश के कारण पैसे भेजे, OTP बताया या ऐप इंस्टॉल किया? पहले तुरंत मदद लें।"},"banner.urgentButton":{"en":"Get urgent help","hi":"तुरंत मदद लें"},"route.rightsSummary":{"en":"Your rights and useful reminders","hi":"आपके अधिकार और उपयोगी बातें"},"route.prepareDraft":{"en":"Prepare my draft","hi":"मेरा मसौदा तैयार करें"},"route.saveActionCard":{"en":"Save my action card","hi":"मेरे अगले कदम सहेजें"},"actionCard.header":{"en":"MY NEXT STEPS — not an official complaint","hi":"मेरे अगले कदम — आधिकारिक शिकायत नहीं"},"trust.title":{"en":"Your data. Clear limits.","hi":"आपकी जानकारी। स्पष्ट सीमाएँ।"},"practice.title":{"en":"Try a 3-minute safety exercise","hi":"3 मिनट का सुरक्षा अभ्यास करें"},"practice.lede":{"en":"Fictional situations. No personal details. Learn, then try again.","hi":"काल्पनिक स्थितियाँ। कोई निजी जानकारी नहीं। सीखें, फिर कोशिश करें।"},"practice.lessonTitle":{"en":"Three habits to remember","hi":"याद रखने की तीन आदतें"},"habit.cardTitle":{"en":"Keep a weekly safety habit","hi":"हर सप्ताह सुरक्षा की आदत रखें"},"habit.cardText":{"en":"Pause before transfers. Verify the source. Keep evidence. Repeat with your family.","hi":"पैसे भेजने से पहले रुकें। स्रोत जाँचें। सबूत रखें। परिवार के साथ दोहराएँ।"},"habit.download":{"en":"Download a 7-day habit card","hi":"7 दिन का आदत कार्ड डाउनलोड करें"}}}},"engineIds":["certainty","urgency","personal","secrets","social","borrowing","withdrawal","app","doubling","impersonation","threat","tips","link","ipo","recovery"],"app":{"base":"\u003c!doctype html>\n\u003chtml lang=\"en\">\u003chead>\u003cmeta charset=\"utf-8\">\u003cmeta name=\"viewport\" content=\"width=device-width,initial-scale=1\">\u003ctitle>Niveshak Saathi · Investor safety\u003c/title>\u003cmeta name=\"description\" content=\"Understand warning signs, find official help, and prepare a complaint in Hindi or English.\">\u003clink rel=\"icon\" href=\"data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%230d4944'/%3E%3Ctext x='9' y='29' font-size='27' fill='white'%3EN%3C/text%3E%3C/svg%3E\">\u003cstyle>\n:root{font-family:system-ui,'Nirmala UI',sans-serif;color:#183b39;background:#f3f6f7;font-size:16px}*{box-sizing:border-box}body{margin:0}button,input,textarea,select{font:inherit}button,a,input,textarea,select{outline-offset:4px}button{cursor:pointer}header{padding:22px 5%;background:white;border-bottom:1px solid #dbe3e2;display:flex;align-items:center;justify-content:space-between;gap:16px}.brand{font-weight:750;font-size:21px;display:flex;align-items:center;gap:12px}.mark{background:#0d4944;color:white;padding:9px 14px;border-radius:12px}.sub{font-size:13px;font-weight:400;color:#627775}header select{padding:10px;border:1px solid #a5bdb9;border-radius:8px;background:white}main{max-width:1180px;margin:auto;padding:30px 24px}nav{display:flex;gap:8px;margin-bottom:28px;flex-wrap:wrap}button{border:1px solid #c1d1cf;border-radius:9px;background:white;padding:12px 18px;color:#174540;font-weight:650}nav button[aria-selected=true],.primary{background:#0d4944;color:white;border-color:#0d4944}nav button{flex:1;text-align:left}.eyebrow{font-size:13px;letter-spacing:1.4px;text-transform:uppercase;font-weight:750;color:#38736c}h1{font-size:clamp(28px,4vw,42px);letter-spacing:-1px;line-height:1.2;margin:12px 0}h2{font-size:23px;margin-top:0}h3{font-size:18px}.lede{color:#58706d;max-width:680px;line-height:1.65;margin-bottom:26px}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,1fr);gap:24px;align-items:start}.card{background:white;border:1px solid #dbe5e3;border-radius:18px;padding:26px;margin-bottom:20px}.dark{background:#0d4944;color:white;border:0}.dark p{color:#d1e7e1}.dark a{color:white}.small{font-size:14px;line-height:1.6;color:#5f7572}label{display:block;font-weight:650;margin:18px 0 8px}textarea,input,select{width:100%;border:1px solid #afc4c0;border-radius:9px;padding:13px;background:#fff;color:#173b37}header select{width:auto}textarea{resize:vertical;min-height:155px;line-height:1.6}.actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:18px}.sample{font-size:14px;padding:8px 12px;background:#eff5f4}.note{border-left:3px solid #deae45;background:#fff8e8;padding:15px 18px;line-height:1.65;border-radius:4px}.result{margin-top:22px;border-top:1px solid #dce5e3;padding-top:22px}.flag{background:#fff4de;padding:16px;border-radius:10px;margin:10px 0}.flag p{margin:5px 0;font-size:15px;line-height:1.6}.number{display:inline-flex;align-items:center;justify-content:center;background:#e4f1ed;color:#0d4944;width:30px;height:30px;border-radius:50%;margin-right:10px;font-weight:700}.steps p{line-height:1.7}.link{display:inline-block;color:#0d4944;font-weight:700;margin:8px 10px 8px 0}.urgent{background:#fff0e9;border:1px solid #e8b9a2;border-radius:12px;padding:18px;margin:20px 0}.urgent a{color:#943d21;font-weight:750}.checks label{font-weight:450;display:flex;gap:12px;align-items:flex-start;line-height:1.6}.checks input{width:20px;height:20px;flex-shrink:0;accent-color:#0d4944;margin-top:3px}footer{border-top:1px solid #d8e3e0;padding:24px 0;font-size:13px;color:#637a75;line-height:1.8}footer a{color:#305e57}.hidden{display:none!important}#status{min-height:24px;color:#33685e;font-size:14px}.pill{display:inline-block;font-size:13px;border:1px solid #628a82;border-radius:100px;padding:5px 10px;margin-bottom:12px}ul,ol{padding-left:22px;line-height:1.8}.progress{height:7px;background:#e3edeb;border-radius:6px;margin:18px 0}.progress div{height:100%;background:#14796b;border-radius:6px;transition:width .2s}@media(max-width:760px){main{padding:22px 16px}.grid{grid-template-columns:1fr}.card{padding:21px}header{padding:17px 16px}.brand{font-size:17px}.sub{font-size:12px}nav button{font-size:14px;padding:12px 8px;min-width:95px}h1{letter-spacing:-.5px}.actions button{flex-grow:1}}@media print{header,nav,footer,.actions,.side{display:none}.grid{display:block}.card{border:0}body{background:white}}\n\u003c/style>\u003c/head>\u003cbody>\u003cheader>\u003cdiv class=\"brand\">\u003cspan class=\"mark\">N\u003c/span>\u003cdiv>Niveshak Saathi\u003cdiv class=\"sub\" data-en=\"Your investor safety companion\" data-hi=\"निवेशक सुरक्षा में आपका साथी\">\u003c/div>\u003c/div>\u003c/div>\u003cselect id=\"language\" aria-label=\"Language / भाषा\">\u003coption value=\"en\">English\u003c/option>\u003coption value=\"hi\">हिन्दी\u003c/option>\u003c/select>\u003c/header>\u003cmain>\u003cnav role=\"tablist\" aria-label=\"Tools\">\u003cbutton role=\"tab\" aria-selected=\"true\" data-tab=\"check\" data-en=\"01  Check a message\" data-hi=\"01  संदेश जाँचें\">\u003c/button>\u003cbutton role=\"tab\" aria-selected=\"false\" data-tab=\"route\" data-en=\"02  Find help\" data-hi=\"02  मदद खोजें\">\u003c/button>\u003cbutton role=\"tab\" aria-selected=\"false\" data-tab=\"draft\" data-en=\"03  Prepare a complaint\" data-hi=\"03  शिकायत तैयार करें\">\u003c/button>\u003c/nav>\n\u003csection id=\"check\" role=\"tabpanel\">\u003cdiv class=\"eyebrow\" data-en=\"Pause. Check. Protect.\" data-hi=\"रुकें। जाँचें। सुरक्षित रहें।\">\u003c/div>\u003ch1 data-en=\"Does this message feel wrong?\" data-hi=\"क्या यह संदेश संदिग्ध लगता है?\">\u003c/h1>\u003cp class=\"lede\" data-en=\"Understand the warning signs before you send money or share information.\" data-hi=\"पैसे भेजने या जानकारी साझा करने से पहले खतरे के संकेत समझें।\">\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003ch2 data-en=\"Let’s look at it together\" data-hi=\"आइए, इसे साथ समझें\">\u003c/h2>\u003cp class=\"small\" data-en=\"Remove names, phone numbers and account details first. The checker runs in your browser; your message is not sent to us.\" data-hi=\"पहले नाम, फोन नंबर और खाता विवरण हटा दें। जाँच आपके ब्राउज़र में होती है; संदेश हमें नहीं भेजा जाता।\">\u003c/p>\u003clabel for=\"message\" data-en=\"Paste the message\" data-hi=\"संदेश यहाँ डालें\">\u003c/label>\u003ctextarea id=\"message\" maxlength=\"6000\" data-en-placeholder=\"Example: Guaranteed IPO allotment. Pay today to a personal UPI ID…\" data-hi-placeholder=\"उदाहरण: IPO में पक्का आवंटन। आज ही निजी UPI पर पैसे भेजें…\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton class=\"sample\" id=\"example\" data-en=\"Try a suspicious example\" data-hi=\"संदिग्ध उदाहरण देखें\">\u003c/button>\u003cbutton class=\"sample\" id=\"neutral\" data-en=\"Try an ordinary example\" data-hi=\"सामान्य उदाहरण देखें\">\u003c/button>\u003c/div>\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"analyse\" data-en=\"Check warning signs\" data-hi=\"खतरे के संकेत जाँचें\">\u003c/button>\u003cbutton id=\"clear\" data-en=\"Clear message\" data-hi=\"संदेश मिटाएँ\">\u003c/button>\u003c/div>\u003cdiv id=\"result\" class=\"result hidden\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003caside class=\"side\">\u003cdiv class=\"card dark\">\u003cspan class=\"pill\" data-en=\"No tips. No commissions.\" data-hi=\"न टिप्स। न कमीशन।\">\u003c/span>\u003ch2 data-en=\"A safer next step starts with a pause.\" data-hi=\"सुरक्षित कदम की शुरुआत रुकने से होती है।\">\u003c/h2>\u003cp data-en=\"Never share an OTP, PIN or password. Verify an offer independently before acting.\" data-hi=\"OTP, PIN या पासवर्ड कभी किसी को न बताएँ। कोई भी कदम उठाने से पहले प्रस्ताव की खुद जाँच करें।\">\u003c/p>\u003c/div>\u003cdiv class=\"card\">\u003ch3 data-en=\"Already sent money to suspected fraud?\" data-hi=\"संदिग्ध धोखाधड़ी में पैसे भेज दिए?\">\u003c/h3>\u003cp class=\"small\" data-en=\"Contact your bank or payment provider immediately and report promptly. Do not wait for this checker.\" data-hi=\"तुरंत अपने बैंक या भुगतान सेवा से संपर्क करें और रिपोर्ट करें। इस जाँच का इंतज़ार न करें।\">\u003c/p>\u003ca class=\"link\" href=\"tel:1930\" data-en=\"Call 1930\" data-hi=\"1930 पर कॉल करें\">\u003c/a>\u003ca class=\"link\" href=\"https://cybercrime.gov.in/\" target=\"_blank\" rel=\"noopener\" data-en=\"Official cybercrime portal\" data-hi=\"आधिकारिक साइबर अपराध पोर्टल\">\u003c/a>\u003c/div>\u003c/aside>\u003c/div>\u003c/section>\n\u003csection id=\"route\" role=\"tabpanel\" class=\"hidden\">\u003cdiv class=\"eyebrow\" data-en=\"Know your next step\" data-hi=\"अगला कदम जानें\">\u003c/div>\u003ch1 data-en=\"You don’t have to figure it out alone.\" data-hi=\"सही रास्ता समझने में हम साथ हैं।\">\u003c/h1>\u003cp class=\"lede\" data-en=\"Choose what happened. We’ll explain where to begin.\" data-hi=\"बताएँ क्या हुआ। हम समझाएँगे कि शुरुआत कहाँ करें।\">\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003clabel for=\"issue\" data-en=\"What do you need help with?\" data-hi=\"आपको किस विषय में मदद चाहिए?\">\u003c/label>\u003cselect id=\"issue\">\u003coption value=\"fraud\" data-en=\"Suspicious offer or possible fraud\" data-hi=\"संदिग्ध प्रस्ताव या धोखाधड़ी\">\u003c/option>\u003coption value=\"broker\" data-en=\"Complaint about a broker or listed company\" data-hi=\"ब्रोकर या सूचीबद्ध कंपनी की शिकायत\">\u003c/option>\u003coption value=\"family\" data-en=\"Nominee, inherited or old investments\" data-hi=\"नामांकन, विरासत या पुराने निवेश\">\u003c/option>\u003c/select>\u003cdiv id=\"follow\">\u003c/div>\u003cdiv id=\"routeResult\" aria-live=\"polite\">\u003c/div>\u003c/div>\u003caside class=\"card side\">\u003ch2 data-en=\"Keep evidence safely\" data-hi=\"सबूत सुरक्षित रखें\">\u003c/h2>\u003cp class=\"small\" data-en=\"Keep originals on your own device. This prototype does not accept document uploads.\" data-hi=\"मूल रिकॉर्ड अपने उपकरण में सुरक्षित रखें। इस प्रोटोटाइप में दस्तावेज़ अपलोड नहीं होते।\">\u003c/p>\u003cul>\u003cli data-en=\"Messages and relevant dates\" data-hi=\"संदेश और संबंधित तारीखें\">\u003c/li>\u003cli data-en=\"Payment reference, if money was sent\" data-hi=\"पैसे भेजे हों तो भुगतान संदर्भ\">\u003c/li>\u003cli data-en=\"Previous complaint and response\" data-hi=\"पिछली शिकायत और जवाब\">\u003c/li>\u003c/ul>\u003cp class=\"note\" data-en=\"A complaint does not guarantee a refund. Use official channels and avoid anyone promising guaranteed recovery.\" data-hi=\"शिकायत करने से पैसा वापस मिलने की गारंटी नहीं होती। आधिकारिक रास्ता ही अपनाएँ; पैसा पक्का वापस दिलाने का वादा करने वालों से बचें।\">\u003c/p>\u003c/aside>\u003c/div>\u003c/section>\n\u003csection id=\"draft\" role=\"tabpanel\" class=\"hidden\">\u003cdiv class=\"eyebrow\" data-en=\"Put your concern into words\" data-hi=\"अपनी समस्या को शब्द दें\">\u003c/div>\u003ch1 data-en=\"Prepare. Review. Submit yourself.\" data-hi=\"तैयार करें। जाँचें। स्वयं जमा करें।\">\u003c/h1>\u003cp class=\"lede\" data-en=\"Make a clear draft with only the facts you know. Nothing is submitted automatically.\" data-hi=\"सिर्फ़ वही बातें लिखें जो आप पक्का जानते हैं, और साफ़ मसौदा बनाएँ। कुछ भी अपने-आप जमा नहीं होता।\">\u003c/p>\u003cdiv class=\"grid\">\u003cdiv class=\"card\">\u003clabel for=\"summary\" data-en=\"What happened? Use placeholders for private details.\" data-hi=\"क्या हुआ? निजी जानकारी असली न लिखें, उसकी जगह [खाता नंबर] जैसा लिखें।\">\u003c/label>\u003ctextarea id=\"summary\" maxlength=\"3000\">\u003c/textarea>\u003clabel for=\"outcome\" data-en=\"What resolution are you requesting?\" data-hi=\"आप क्या समाधान चाहते हैं?\">\u003c/label>\u003cinput id=\"outcome\" maxlength=\"350\">\u003cdiv class=\"actions\">\u003cbutton class=\"primary\" id=\"generate\" data-en=\"Create draft\" data-hi=\"मसौदा बनाएँ\">\u003c/button>\u003c/div>\u003cdiv id=\"draftArea\" class=\"hidden\">\u003clabel for=\"draftText\" data-en=\"Review and edit your draft\" data-hi=\"मसौदा जाँचें और संपादित करें\">\u003c/label>\u003ctextarea id=\"draftText\" style=\"min-height:310px\">\u003c/textarea>\u003cdiv class=\"actions\">\u003cbutton id=\"download\" data-en=\"Download text\" data-hi=\"टेक्स्ट डाउनलोड करें\">\u003c/button>\u003cbutton id=\"read\" data-en=\"Read aloud\" data-hi=\"सुनें\">\u003c/button>\u003cbutton id=\"stop\" data-en=\"Stop reading\" data-hi=\"पढ़ना रोकें\">\u003c/button>\u003c/div>\u003cp class=\"small\" data-en=\"Read-aloud uses an installed local voice only. Availability depends on your device. Downloaded files stay on your device until you delete them.\" data-hi=\"पढ़कर सुनाने के लिए सिर्फ़ फ़ोन में इंस्टॉल आवाज़ इस्तेमाल होती है, जो हर फ़ोन में नहीं होती। डाउनलोड की गई फ़ाइल तब तक फ़ोन में रहती है, जब तक आप उसे मिटा न दें।\">\u003c/p>\u003c/div>\u003cdiv id=\"status\" role=\"status\">\u003c/div>\u003c/div>\u003caside class=\"card side\">\u003ch2 data-en=\"My preparation checklist\" data-hi=\"मेरी तैयारी की सूची\">\u003c/h2>\u003cp class=\"small\" data-en=\"For this session only. This is your checklist, not an official complaint status.\" data-hi=\"केवल इस सत्र के लिए। यह आपकी सूची है, आधिकारिक शिकायत की स्थिति नहीं।\">\u003c/p>\u003cdiv class=\"progress\">\u003cdiv id=\"bar\" style=\"width:0%\">\u003c/div>\u003c/div>\u003cdiv class=\"checks\">\u003clabel>\u003cinput type=\"checkbox\">\u003cspan data-en=\"I saved relevant evidence\" data-hi=\"मैंने संबंधित सबूत सुरक्षित रखे\">\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan data-en=\"I checked the official complaint route\" data-hi=\"मैंने आधिकारिक शिकायत का रास्ता जाँचा\">\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan data-en=\"I reviewed the facts in my draft\" data-hi=\"मैंने मसौदे के तथ्य जाँचे\">\u003c/span>\u003c/label>\u003clabel>\u003cinput type=\"checkbox\">\u003cspan data-en=\"After submitting, I saved the acknowledgement\" data-hi=\"जमा करने के बाद मैंने पावती सुरक्षित रखी\">\u003c/span>\u003c/label>\u003c/div>\u003cp id=\"count\" class=\"small\">\u003c/p>\u003cbutton id=\"reset\" data-en=\"Clear this session\" data-hi=\"यहाँ भरी सारी जानकारी मिटाएँ\">\u003c/button>\u003c/aside>\u003c/div>\u003c/section>\n\u003cfooter>\u003cspan data-en=\"Independent educational prototype • Not affiliated with SEBI or any government agency • No investment recommendations\" data-hi=\"स्वतंत्र शैक्षिक प्रोटोटाइप • SEBI या किसी सरकारी संस्था से संबद्ध नहीं • निवेश की सिफारिश नहीं\">\u003c/span>\u003cbr>\u003cspan data-en=\"Official references checked 1 October 2026:\" data-hi=\"आधिकारिक संदर्भ: 1 अक्टूबर 2026 को जाँचे गए:\">\u003c/span> \u003ca href=\"https://scores.sebi.gov.in/faqs\" target=\"_blank\" rel=\"noopener\">SCORES\u003c/a> · \u003ca href=\"https://cybercrime.gov.in/\" target=\"_blank\" rel=\"noopener\">Cybercrime\u003c/a> · \u003ca href=\"https://www.iepf.gov.in/\" target=\"_blank\" rel=\"noopener\">IEPF\u003c/a>\u003cbr>\u003cspan data-en=\"No analytics or financial account connection. Inputs are held in this page’s memory and cleared on reload. Official links need internet access; hosting services may process standard access logs.\" data-hi=\"कोई एनालिटिक्स या वित्तीय खाता कनेक्शन नहीं। जानकारी इस पेज की मेमोरी में रहती है और दोबारा लोड करने पर मिटती है। आधिकारिक लिंक के लिए इंटरनेट चाहिए; होस्टिंग सेवा सामान्य एक्सेस लॉग रख सकती है।\">\u003c/span>\u003c/footer>\u003c/main>\n\u003cscript>\nlet lang='en',active='check',lastChecked=null;const $=id=>document.getElementById(id),t=(en,hi)=>lang==='hi'?hi:en;\nfunction assess(text){return []} // replaced in upgrade.js: local engine + content/warnings.json\nfunction go(tab){active=tab;document.querySelectorAll('[role=tabpanel]').forEach(s=>s.classList.toggle('hidden',s.id!==tab));document.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));if('speechSynthesis'in window)speechSynthesis.cancel()}\nfunction translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelectorAll('[data-en-placeholder]').forEach(e=>e.placeholder=e.dataset[lang+'Placeholder']);renderRoute();progress();if(lastChecked!==null)showResult(lastChecked)}\nfunction showResult(text){} // replaced in upgrade.js\nlet paid='no',contacted='no';function renderRoute(){} // replaced in upgrade.js: routes come from content/routes.json\nfunction progress(){const n=document.querySelectorAll('.checks input:checked').length;$('bar').style.width=n*25+'%';$('count').textContent=t(`${n} of 4 preparation steps complete`, `तैयारी के ${n}/4 कदम पूरे`)}\ndocument.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>go(b.dataset.tab));$('language').onchange=e=>{lang=e.target.value;translate()};$('issue').onchange=renderRoute;$('analyse').onclick=()=>{lastChecked=$('message').value;showResult(lastChecked)};$('message').oninput=()=>{lastChecked=null;$('result').classList.add('hidden')};$('example').onclick=()=>{$('message').value=t('Telegram VIP group: Guaranteed IPO allotment! Pay today to a personal UPI account. Borrow money if needed.','टेलीग्राम VIP समूह: IPO में पक्का आवंटन! आज ही निजी UPI खाते में भुगतान करें। ज़रूरत हो तो उधार लें।');lastChecked=null;$('result').classList.add('hidden')};$('neutral').onclick=()=>{$('message').value=t('Your monthly statement is available. Open the official app directly to review it.','आपका मासिक विवरण उपलब्ध है। देखने के लिए आधिकारिक ऐप सीधे खोलें।');lastChecked=null;$('result').classList.add('hidden')};$('clear').onclick=()=>{$('message').value='';lastChecked=null;$('result').classList.add('hidden')};$('generate').onclick=()=>{const summary=$('summary').value.trim();if(!summary){$('status').textContent=t('Please describe what happened first.','पहले बताएँ कि क्या हुआ।');return}const resolution=$('outcome').value.trim()||t('[State the resolution you seek]','[अपेक्षित समाधान लिखें]');$('draftText').value=t(`To: [Appropriate entity / authority]\\nSubject: Request to investigate and resolve my concern\\n\\nI am writing to report the following concern:\\n${summary}\\n\\nRelevant date(s): [Add dates]\\nPrevious complaint reference and response, if any: [Add details]\\n\\nResolution requested:\\n${resolution}\\n\\nEvidence available: [List relevant messages, transaction references or correspondence; attach only through the official channel as required.]\\n\\nPlease acknowledge this complaint and inform me of the next steps.\\n\\n[Name and contact details — add only when submitting through the official channel]`,`सेवा में: [संबंधित संस्था / प्राधिकारी]\\nविषय: मेरी समस्या की जाँच और समाधान का अनुरोध\\n\\nमैं निम्न समस्या की सूचना देना चाहता/चाहती हूँ:\\n${summary}\\n\\nसंबंधित तारीखें: [तारीखें लिखें]\\nपिछली शिकायत का संदर्भ और जवाब, यदि हो: [विवरण लिखें]\\n\\nअपेक्षित समाधान:\\n${resolution}\\n\\nउपलब्ध सबूत: [संदेश, भुगतान संदर्भ या पत्राचार की सूची; आवश्यकता अनुसार केवल आधिकारिक माध्यम से संलग्न करें।]\\n\\nकृपया शिकायत की पावती और अगले कदम बताएँ।\\n\\n[नाम और संपर्क — केवल आधिकारिक माध्यम से जमा करते समय जोड़ें]`);$('draftArea').classList.remove('hidden');$('status').textContent=t('Draft created. Verify every fact and replace placeholders before submitting.','मसौदा तैयार है। जमा करने से पहले तथ्य जाँचें और संकेतों की जगह सही विवरण भरें।')};$('download').onclick=()=>{const blob=new Blob([$ ('draftText').value],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='niveshak-saathi-complaint.txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};$('read').onclick=()=>{if(!('speechSynthesis'in window)){$('status').textContent=t('Read-aloud is unavailable on this device.','इस उपकरण पर सुनाने की सुविधा उपलब्ध नहीं है।');return}const voice=speechSynthesis.getVoices().find(v=>v.localService&&v.lang.startsWith(lang));if(!voice){$('status').textContent=t('No local English voice is available. Please read the draft on screen.','स्थानीय हिन्दी आवाज़ उपलब्ध नहीं है। कृपया स्क्रीन पर मसौद function inr(n,hi){return n>=1e7?'₹'+dec(n/1e7)+(hi?' करोड़':' crore'):n>=1e5?'₹'+dec(n/1e5)+(hi?' लाख':' lakh'):'₹'+group(n)}\nconst pctTxt=x=>Math.abs(x)>=100?group(x):Math.abs(x)>=10?String(Math.round(x)):String(rnd(x,Math.abs(x)\u003c1?2:1));\nconst UNIT={day:['a day','हर दिन','day','दिन'],week:['a week','हर हफ़्ते','week','हफ़्ते'],month:['a month','हर महीने','month','महीने'],year:['a year','हर साल','year','साल']};\nconst tooHigh=r=>!!r&&(r.capped||r.annualPct>30||!!(r.input&&(r.input.period==='day'||r.input.period==='week')&&r.input.ratePct>0));\nfunction explainReturn(r,lang){\n if(!r||!isFinite(r.annualPct))return '';\n const hi=lang==='hi',inp=r.input||{},u=UNIT[inp.period]||UNIT.year,rate=inp.ratePct!=null?String(rnd(inp.ratePct,2))+'%':null,end=r.multipleYear*1e5;\n const yearly=r.annualPct\u003c0?(hi?`साल में ${pctTxt(-r.annualPct)}% का नुकसान`:`a loss of ${pctTxt(-r.annualPct)}% a year`):(hi?`साल में ${pctTxt(r.annualPct)}%`:`${pctTxt(r.annualPct)}% a year`);\n let lead,tail;\n if(inp.start!=null){const n=rnd(inp.durationValue,2),du=UNIT[inp.durationUnit],loss=inp.ratePct\u003c0,p=String(rnd(Math.abs(inp.ratePct),2))+'%';\n  lead=hi?`${n} ${du[3]} में ${inr(inp.start,1)} को ${inr(inp.end,1)} बनाना, यानी ${u[1]} लगभग ${p}${loss?' का नुकसान':''}। इस दर से `:`Turning ${inr(inp.start)} into ${inr(inp.end)} in ${n} ${du[2]}${n===1?'':'s'} is ${loss?'a loss of ':''}about ${p} ${u[0]}. At that rate, `;\n }else lead=rate?(hi?`${u[1]} ${rate} का मतलब है कि `:`${rate} ${u[0]} means `):'';\n if(r.capped)tail=hi?'₹1 लाख एक साल में ₹10 करोड़ से भी ज़्यादा हो जाएँगे, यानी आपके पैसे के 1,000 गुना से भी ज़्यादा।':'₹1 lakh would become more than ₹10 crore in a year: more than 1,000 times your money.';\n else{const same=inp.period==='year';tail=hi?`₹1 लाख एक साल में लगभग ${inr(end,1)} हो जाएँगे${same?'':` (${yearly})`}।`:`₹1 lakh would become about ${inr(end)} in a year${same?'':` (${yearly})`}.`}\n let s=lead+tail;if(!lead)s=hi?s:s[0].toUpperCase()+s.slice(1);\n if(tooHigh(r))s+=hi?' कोई भी असली निवेश इसका वादा नहीं कर सकता।':' No genuine investment can promise this.';\n return s;\n}\n\n// ---------- 3. payCheck: \"Before you pay\" ----------\n// Each text cites a source id from content/sources.json; null means a general safety step (shown with the general label).\nconst INV=['ipo','trading-app','tips','adviser-fee','scheme','withdraw-fee'],MARKET=['ipo','trading-app','tips','adviser-fee'];\nconst TXT={\n 'withdraw-fee':['apps','A fee to withdraw or release your own money is a common scam. Do not pay.','अपना ही पैसा निकालने या छुड़ाने के लिए शुल्क माँगना आम धोखाधड़ी है। भुगतान न करें।'],\n 'ipo-route':['sebi-icdr-faq','In a public issue everyone applies through ASBA from their own bank account, and there is no discretion in allotment. Nobody can apply for you for a fee or promise you an allotment. Do not pay.','पब्लिक इश्यू में हर कोई अपने बैंक खाते से ASBA के ज़रिए आवेदन करता है, और आवंटन में कोई मनमानी नहीं होती। कोई शुल्क लेकर आपके लिए आवेदन नहीं कर सकता, न आवंटन का वादा कर सकता है। भुगतान न करें।'],\n 'person-account':['apps','Paying a person’s own account for an investment is a warning sign of fake trading-app scams. Confirm the account on the company’s official website or app first.','निवेश के लिए किसी व्यक्ति के निजी खाते में भुगतान नकली ट्रेडिंग ऐप धोखाधड़ी का संकेत है। पहले कंपनी की आधिकारिक वेबसाइट या ऐप से खाता जाँचें।'],\n 'crypto-gift':[null,'Crypto and gift-card payments are very hard to trace or get back. Do not pay this way.','क्रिप्टो या गिफ्ट कार्ड से किया भुगतान ढूँढना और वापस पाना बहुत मुश्किल है। इस तरह भुगतान न करें।'],\n 'caller':['sebi-impersonation','An unexpected caller wants money, perhaps in the name of SEBI, a bank or a broker. SEBI warns that fraudsters pose as its officials and ask for payments. End the call and contact the organisation through its official website or app.','कोई अनजान कॉलर पैसे माँग रहा है, शायद SEBI, बैंक या ब्रोकर के नाम पर। SEBI चेतावनी देता है कि धोखेबाज़ उसके अधिकारी बनकर भुगतान <script>// Owner Control Studio: a local editor for the reviewed content in prototype/content/*.json.

'use strict';
(function () {
  // Local tool only: refuse to run when served from a website (file://, or localhost while previewing, is fine).
  if (!/^(file:|about:)$/.test(location.protocol) && !/^(localhost|127\.0\.0\.1|\[::1\])$/.test(location.hostname)) {

  function h(tag, props, ...kids) {
    const e = document.createElement(tag);
    for (const [k, v] of Object.entries(props || {})) {

    return e;
  }
  const isoToday = () => { const d = new Date(); return new Date(d.getTime() - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
  const addDays = (iso, n) => new Date(Date.parse(iso + 'T00:00:00Z') + n * 86400000).toISOString().slice(0, 10);
  const daysUntil = iso => Math.round((Date.parse(iso + 'T00:00:00Z') - Date.parse(isoToday() + 'T00:00:00Z')) / 86400000);
  const safeName = s => String(s || 'content').replace(/[^A-Za-z0-9.-]+/g, '-');
  const sourceOptions = () => content.sources.sources.map(s => [s.id, s.id + ' · ' + (s.name.en || '')]);

  // ---------- validation and status ----------
  function changedSections() { return SCHEMA.SECTIONS.filter(s => SCHEMA.canonical(content[s]) !== SCHEMA.canonical(original[s])); }

      ' · ' + result.warnings.length + ' warning(s) · ' + (changes.length ? 'unsaved changes in ' + changes.join(', ') : 'no unsaved changes'));
    document.querySelectorAll('.invalid').forEach(e => e.classList.remove('invalid'));
    for (const msg of result.errors) {
      const path = msg.slice(0, msg.indexOf(':'));
      document.querySelectorAll('[data-path]').forEach(e => { const p = e.getAttribute('data-path'); if (path === p || path.startsWith(p + '.') || path.startsWith(p + '[')) e.classList.add('invalid'); });
    }

      ? [h('ul', { class: 'issues' }, result.errors.map(m => h('li', { class: 'e', text: 'Error · ' + m })), result.warnings.map(m => h('li', { class: 'w', text: 'Warning · ' + m })))]
      : [h('p', { class: 'ok', text: 'No problems found. The build would accept this content.' })]));

  }

  function toast(text, bad) { const t = $('#toast'); t.textContent = text; t.className = 'toast' + (bad ? ' bad' : ''); }

  // ---------- field editors ----------
  // English and Hindi side by side, bound to obj[key] = {en, hi}.
  function pair(obj, key, label, path, opts) {
    opts = opts || {};
    const wrap = h('div', { class: 'pair', 'data-path': path }, h('div', { class: 'pair-label', text: label }));
    if (!obj[key]) {
      if (!opts.optional) obj[key] = { en: '', hi: '' };
      else { wrap.append(h('button', { type: 'button', class: 'small', text: '+ Add', onclick: () => { obj[key] = { en: '', hi: '' }; changed(); render(); } })); return wrap; }
    }
    const row = h('div', { class: 'pair-row' });
    for (const lang of ['en', 'hi']) {

    } else {

    return h('div', { class: 'list-controls' },
      h('button', { type: 'button', class: 'small', text: '↑', 'aria-label': 'Move up', disabled: i === 0, onclick: move(-1) }),
      h('button', { type: 'button', class: 'small', text: '↓', 'aria-label': 'Move down', disabled: i === arr.length - 1, onclick: move(1) }),
      h('button', { type: 'button', class: 'small danger', text: 'Remove', onclick: () => { if (confirm('Remove this item?')) { arr.splice(i, 1); changed(); render(); } } }));
  }
  const addButton = (text, fn) => h('button', { type: 'button', class: 'primary', text, onclick: () => { fn(); changed(); render(); } });
  const blank = () => ({ en: '', hi: '' });

  // ---------- views ----------
  function overview() {
    const m = content.meta;
    const rows = content.sources.sources.map(s => {

      return h('tr', null, h('td', { text: s.name.en || s.id }), h('td', { text: s.lastReviewed }), h('td', { text: s.reviewDue }), h('td', { class: status[1], text: status[0] }));
    });
    return h('section', null, h('h1', { text: 'Overview' }),
      h('p', { class: 'lede', text: 'Edit the reviewed content of the public app: official sources, warning explanations, help routes, emergency steps, rights cards, practice and app texts. Edits stay on this computer until you save them and rebuild. Detection rules, safety caveats and the build are code, so they cannot be changed here.' }),

      if (pack.packFormat !== 'niveshak-content-pack' || pack.packVersion !== 1 || !pack.content) throw new Error('this is not a Niveshak Saathi content pack');
      const missing = SCHEMA.SECTIONS.filter(s => !pack.content[s] || typeof pack.content[s] !== 'object');
      if (missing.length) throw new Error('the pack has no ' + missing.join(', ') + ' section; it may come from an older Studio. Export a new pack from this Studio instead');
      if (changedSections().length && !confirm('Replace your unsaved changes with this pack?')) return;
      content = pack.content; render(); toast('Pack imported. Check the validation result before saving.');
    } catch (e) { toast('Import failed: ' + e.message, true); }
  }
  async function saveToFolder() {
    const v = validate();
    if (v.errors.length) return toast('Fix ' + v.errors.length + ' error(s) before saving.', true);
    try {
      const dir = await window.showDirectoryPicker({ mode: 'readwrite' });
      try { await dir.getFileHandle('meta.json'); await dir.getFileHandle('sources.json'); } catch (e) { throw new Error('choose the prototype/content folder (it already contains meta.json and sources.json)'); }
      const changes = changedSections();
      for (const s of changes) { const w = await (await dir.getFileHandle(s + '.json', { create: true })).createWritable(); await w.write(JSON.stringify(content[s], null, 2) + '\n'); await w.close(); }
      original = clone(content); render();
      toast(changes.length ? 'Saved ' + changes.join(', ') + '. Now run "node build.cjs" in the prototype folder.' : 'Nothing to save.');
    } catch (e) { if (!e || e.name !== 'AbortError') toast('Save failed: ' + (e && e.message), true); }
  }
  async function draftManifest() {
    const v = validate();
    const hash = async s => { if (!(window.crypto && crypto.subtle)) return null; const b = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s)); return [...new Uint8Array(b)].map(x => x.toString(16).padStart(2, '0')).join('').toUpperCase(); };
    const sections = {}; for (const s of SCHEMA.SECTIONS) sections[s] = await hash(SCHEMA.canonical(content[s]));
    download('release-manifest-draft-' + safeName(content.meta.contentVersion) + '.json', JSON.stringify({ manifestVersion: 1, kind: 'Owner Studio draft; the build writes the official release-manifest.json', product: 'Niveshak Saathi', productVersion: content.meta.productVersion, contentVersion: content.meta.contentVersion, createdAt: new Date().toISOString(), contentSha256: await hash(SCHEMA.canonical(content)), sections, changedSections: changedSections(), basedOn: DATA.builtFrom, validation: { errors: v.errors, warnings: v.warnings } }, null, 2));
  }
  function publish() {
    const changes = changedSections(), file = h('input', { type: 'file', accept: '.json,application/json', id: 'importPack' });
    file.addEventListener('change', () => importPack(file.files[0]));
    return h('section', null, h('h1', { text: 'Save and publish' }),
      h('div', { class: 'card' }, h('h2', { text: 'Changes in this session' }), h('p', { text: changes.length ? 'Changed sections: ' + changes.join(', ') : 'No changes yet.' }),
        h('button', { type: 'button', class: 'danger', text: 'Discard all changes', disabled: !changes.length, onclick: () => { if (confirm('Discard all unsaved changes?')) { content = clone(original); render(); toast('Changes discarded.'); } } })),
      h('div', { class: 'card' }, h('h2', { text: '1. Save your edits' }),
        typeof window.showDirectoryPicker === 'function'
          ? h('p', null, h('button', { type: 'button', class: 'primary', id: 'saveFolder', text: 'Save into the content folder…', onclick: saveToFolder }), ' Choose prototype/content. Only valid content can be saved.')
          : h('p', { class: 'small', text: 'This browser cannot write to folders. Use the content pack instead; it works everywhere.' }),
        h('p', null, h('button', { type: 'button', id: 'exportPack', text: 'Export content pack', onclick: exportPack }), ' One JSON file with every section. Apply it in the prototype folder with: node validate-content.cjs --apply <pack file>'),
        h('p', null, h('label', { for: 'importPack', text: 'Import a content pack: ' }), file)),
      h('div', { class: 'card' }, h('h2', { text: '2. Rebuild the app' }),
        h('p', { text: 'In the prototype folder run: node build.cjs. The build validates the content again, refuses errors, writes dist/index.html and writes release-manifest.json with the version, time, checksums and changed sections.' }),
        h('p', { class: 'note', text: 'A rebuilt app is a new release. Get it reviewed (GPT/Codex runs the canonical checks) before it is published.' })),
      h('div', { class: 'card' }, h('h2', { text: 'Draft release manifest' }), h('p', { text: 'Download the checksums and changed sections of your current edits to attach to a review request.' }), h('button', { type: 'button', id: 'draftManifest', text: 'Download draft manifest', onclick: draftManifest })));
  }

  // ---------- shell ----------
  const VIEWS = { overview, sources, warnings, routes, emergency, packet, family, rights, practice, texts, preview, publish };
  const TABS = [['overview', 'Overview'], ['sources', 'Sources & review dates'], ['warnings', 'Warning texts'], ['routes', 'Help routes'], ['emergency', 'Emergency mode'], ['packet', 'Action Packet'], ['family', 'Family readiness'], ['rights', 'Rights cards'], ['practice', 'Practice'], ['texts', 'App texts'], ['preview', 'Preview'], ['publish', 'Save & publish']];
  function render() {
    const focused = document.activeElement && document.activeElement.id;
    seq = 0;
    $('#tabs').replaceChildren(...TABS.map(([id, label]) => h('button', { type: 'button', id: 'tab-' + id, 'aria-current': tab === id ? 'page' : null, 'aria-selected': String(tab === id), onclick: () => { tab = id; render(); window.scrollTo(0, 0); $('#main').focus({ preventScroll: true }); } }, label)));
    let view;
    try { view = VIEWS[tab](); }
    catch (e) { view = h('section', null, h('h1', { text: 'This section cannot be edited' }), h('p', { class: 'note bad', text: 'Its content does not have the expected structure, so the editor cannot show it (' + e.message + '). See the validation list on the Overview tab, or discard the changes on the Save & publish tab.' })); }
    $('#main').replaceChildren(view);
    // Keep keyboard focus on the same field after a re-render (field ids are assigned in a fixed order).
    const again = focused && document.getElementById(focused); if (again && again !== document.body) again.focus();
    validate();
  }
  window.addEventListener('beforeunload', e => { if (changedSections().length) { e.preventDefault(); e.returnValue = ''; } });
  render();
})();
</script>
</body>
