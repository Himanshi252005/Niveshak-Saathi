:{"en":"SEBI: SMART ODR (online dispute resolution)","hi":"SEBI: स्मार्ट ODR (ऑनलाइन विवाद समाधान)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://investor.sebi.gov.in/smart_orr.html","supports":{"en":"Online conciliation and arbitration with listed companies and SEBI-registered intermediaries, after first complaining to them; pre-conciliation is free, the market participant pays conciliation fees, and both sides pay arbitration fees, which depend on the claim","hi":"पहले संस्था से शिकायत के बाद, सूचीबद्ध कंपनियों और SEBI में रजिस्टर्ड संस्थाओं से विवाद के लिए ऑनलाइन सुलह और पंच-फ़ैसला (आर्बिट्रेशन); प्री-कंसिलिएशन दोनों पक्षों के लिए निःशुल्क, सुलह की फ़ीस रजिस्टर्ड संस्था देती है, और आर्बिट्रेशन की फ़ीस दोनों पक्ष देते हैं जो दावे पर निर्भर करती है"},"note":{"en":"SEBI names the portal itself as smartodr.in. Beware of lookalike addresses.","hi":"SEBI पोर्टल का पता smartodr.in बताता है। मिलते-जुलते पतों से सावधान रहें।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-mf-faq","enabled":true,"name":{"en":"SEBI: mutual fund FAQ","hi":"SEBI: म्यूचुअल फ़ंड प्रश्नोत्तर"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/faqfiles/sep-2024/1727242783639.pdf","supports":{"en":"Mutual fund complaints go to the fund or its investor service centre first, then SCORES if unresolved (question 43)","hi":"म्यूचुअल फ़ंड की शिकायत पहले फ़ंड या उसके निवेशक सेवा केंद्र को, फिर समाधान न हो तो SCORES पर (प्रश्न 43)"},"note":{"en":"Updated as on 31 August 2024.","hi":"31 अगस्त 2024 तक अपडेट किया गया।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-rta-faq","enabled":true,"name":{"en":"SEBI: FAQ on registrars and transfer agents","hi":"SEBI: रजिस्ट्रार और ट्रांसफ़र एजेंट पर प्रश्नोत्तर"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/faqfiles/jan-2026/1767611333081.pdf","supports":{"en":"Paper holders update contact details with the company or RTA (Q33); paper shares are transmitted by each company or RTA, in demat form only (Q67–68); complaints need a KYC-compliant folio, then SCORES and SMART ODR (Q86–88); a nominee is a trustee for the legal heirs (Q32); IEPF transfers (Q94–95)","hi":"कागज़ी होल्डिंग वाले संपर्क विवरण कंपनी या RTA के पास अपडेट करते हैं (प्र. 33); ट्रांसमिशन हर कंपनी या RTA करती है, केवल डीमैट रूप में (प्र. 67–68); शिकायत के लिए फ़ोलियो का KYC पूरा हो, फिर SCORES और स्मार्ट ODR (प्र. 86–88); नॉमिनी वारिसों का ट्रस्टी है (प्र. 32); IEPF ट्रांसफ़र (प्र. 94–95)"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-depository-faq","enabled":true,"name":{"en":"SEBI: depository FAQ","hi":"SEBI: डिपॉज़िटरी प्रश्नोत्तर"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/faqfiles/sep-2022/1663591135406.pdf","supports":{"en":"Paper certificates are dematerialised by submitting them with a Demat Request Form to the depository participant (question 50); after a holder's death, demat holdings are transmitted through the depository participant (questions 72–73)","hi":"कागज़ी प्रमाणपत्र डीमैट अनुरोध फ़ॉर्म (DRF) के साथ DP को देकर डीमैट होते हैं (प्रश्न 50); धारक की मृत्यु के बाद डीमैट होल्डिंग का ट्रांसमिशन DP के माध्यम से होता है (प्रश्न 72–73)"},"note":{"en":"Updated till 9 April 2021.","hi":"9 अप्रैल 2021 तक अपडेट किया गया।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"iepf-rules","enabled":true,"name":{"en":"IEPF Rules, 2016 (as amended)","hi":"IEPF नियम, 2016 (संशोधित)"},"authority":"Ministry of Corporate Affairs (rules text hosted on a government nic.in website)","url":"https://thc.nic.in/Central%20Governmental%20Rules/Investor%20Education%20and%20Protection%20Fund%20Authority%20(Accounting,%20Audit,%20Transfer%20and%20Refund)%20Rules,%202016.pdf","supports":{"en":"Companies publish unclaimed amounts on their websites (rule 5(8)); a claim is verified by the company before the IEPF Authority refunds money or credits shares (rule 7)","hi":"कंपनियाँ बिना दावे वाली राशियाँ अपनी वेबसाइट पर प्रकाशित करती हैं (नियम 5(8)); IEPF प्राधिकरण पैसे लौटाए या शेयर जमा करे, उससे पहले कंपनी दावे की जाँच करती है (नियम 7)"},"note":{"en":"Amended 1 October 2025; the claim form changed from 6 October 2025. The IEPF website could not be read for this review.","hi":"1 अक्टूबर 2025 को संशोधित; दावा फ़ॉर्म 6 अक्टूबर 2025 से बदला। इस समीक्षा में IEPF वेबसाइट पढ़ी नहीं जा सकी।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"rbi-ios-faq","enabled":true,"name":{"en":"RBI: Integrated Ombudsman Scheme, 2026 (FAQ)","hi":"RBI: एकीकृत लोकपाल योजना, 2026 (प्रश्नोत्तर)"},"authority":"Reserve Bank of India (RBI)","url":"https://www.rbi.org.in/Scripts/FAQView.aspx?Id=153","supports":{"en":"Complain to the regulated entity first; go to the RBI Ombudsman if there is no reply within 30 days (or a longer period under RBI, NPCI or card-network rules), filing within 90 days after that or after the last reply, whichever is later (FAQ 17); give account, card or transaction details (FAQ 18)","hi":"पहले संस्था से शिकायत; 30 दिन (या RBI, NPCI या कार्ड नेटवर्क के नियमों में दिए ज़्यादा समय) में जवाब न मिले तो RBI लोकपाल के पास: वह समय पूरा होने या आखिरी जवाब मिलने (जो भी बाद में हो) के 90 दिन के अंदर (प्रश्न 17); शिकायत में खाता, कार्ड या लेन-देन का विवरण (प्रश्न 18)"},"note":{"en":"The 2026 scheme replaced the 2021 scheme from 1 July 2026. Check the waiting period and filing time limit here before filing.","hi":"2026 की योजना ने 1 जुलाई 2026 से 2021 की योजना की जगह ली। शिकायत से पहले यहाँ प्रतीक्षा अवधि और समय-सीमा देखें।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"rbi-cms","enabled":false,"name":{"en":"RBI Complaint Management System (CMS)","hi":"RBI शिकायत प्रबंधन प्रणाली (CMS)"},"authority":"Reserve Bank of India (RBI)","url":"https://cms.rbi.org.in/","supports":{"en":"Official portal to file a complaint with the RBI Ombudsman","hi":"RBI लोकपाल के पास शिकायत दर्ज करने का आधिकारिक पोर्टल"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"bima-bharosa-faq","enabled":true,"name":{"en":"IRDAI Bima Bharosa: FAQ","hi":"IRDAI बीमा भरोसा: प्रश्नोत्तर"},"authority":"Insurance Regulatory and Development Authority of India (IRDAI)","url":"https://bimabharosa.irdai.gov.in/Home/FAQ","supports":{"en":"Complain to the insurer first; when to take an unresolved complaint to IRDAI","hi":"पहले बीमा कंपनी से शिकायत; अनसुलझी शिकायत IRDAI के पास कब ले जाएँ"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"bima-bharosa","enabled":true,"name":{"en":"IRDAI Bima Bharosa complaint portal","hi":"IRDAI बीमा भरोसा शिकायत पोर्टल"},"authority":"Insurance Regulatory and Development Authority of India (IRDAI)","url":"https://bimabharosa.irdai.gov.in/","supports":{"en":"Registering and tracking insurance complaints with IRDAI","hi":"IRDAI के पास बीमा शिकायत दर्ज करना और उसकी स्थिति देखना"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"insurance-ombudsman","enabled":true,"name":{"en":"IRDAI: Insurance Ombudsman FAQ","hi":"IRDAI: बीमा लोकपाल प्रश्नोत्तर"},"authority":"Insurance Regulatory and Development Authority of India (IRDAI)","url":"https://irdai.gov.in/documents/37343/379608/FAQ%E2%80%99s+on+Insurance+Ombudsman+Rules+2017.pdf/37bc4077-6906-91ad-fb49-6c0e733b3e0d?version=3.0&t=1640147675026","supports":{"en":"Approach the Insurance Ombudsman after a written complaint to the insurer that was rejected, not answered within one month, or answered unsatisfactorily (question 9); complain within one year (question 5); matters before a court, consumer forum or arbitrator cannot be taken (question 9)","hi":"बीमा कंपनी को लिखित शिकायत के बाद — अस्वीकार हो, एक महीने में जवाब न आए, या जवाब संतोषजनक न हो — बीमा लोकपाल के पास जाएँ (प्रश्न 9); एक साल के अंदर शिकायत करें (प्रश्न 5); अदालत, उपभोक्ता अदालत (फ़ोरम) या पंच के पास पहले से चल रहे मामले नहीं लिए जाते (प्रश्न 9)"},"note":{"en":"FAQ on the Insurance Ombudsman Rules, 2017, dated 19 May 2017, on IRDAI's website. The ombudsman offices' own website is not on this app's official-link list.","hi":"बीमा लोकपाल नियम, 2017 पर प्रश्नोत्तर, दिनांक 19 मई 2017, IRDAI की वेबसाइट पर। लोकपाल कार्यालयों की अपनी वेबसाइट इस ऐप की आधिकारिक लिंक सूची में नहीं है।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"pfrda-grievance","enabled":true,"name":{"en":"PFRDA: NPS and APY grievance redressal","hi":"PFRDA: NPS और APY शिकायत निवारण"},"authority":"Pension Fund Regulatory and Development Authority (PFRDA)","url":"https://www.pfrda.org.in/web/pfrda/compliance/grievance","supports":{"en":"NPS and Atal Pension Yojana grievances are lodged on PFRDA Pension Sahayak and assigned to the intermediary or nodal office (level 1); if unresolved within 30 days, the NPS Trust (level 2); if there is no reply within 21 days, the Ombudsman appointed by PFRDA (level 3)","hi":"NPS और अटल पेंशन योजना की शिकायत PFRDA पेंशन सहायक पर दर्ज होती है और रजिस्टर्ड संस्था या नोडल कार्यालय को सौंपी जाती है (स्तर 1); 30 दिन में समाधान न हो तो NPS ट्रस्ट (स्तर 2); 21 दिन में जवाब न मिले तो PFRDA द्वारा नियुक्त लोकपाल (स्तर 3)"},"note":{"en":"The page names the Pension Sahayak portal as pensionsahayak.pfrda.org.in.","hi":"यह पेज पेंशन सहायक पोर्टल का पता pensionsahayak.pfrda.org.in बताता है।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-nomination-2026","enabled":true,"name":{"en":"SEBI: nomination rules for demat accounts and mutual funds (2026)","hi":"SEBI: डीमैट खाते और म्यूचुअल फ़ंड के नॉमिनी नियम (2026)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/legal/circulars/may-2026/ease-of-doing-investments-modified-norms-for-nomination-in-demat-accounts-and-mutual-fund-folios_101703.html","supports":{"en":"Nominees for demat accounts and mutual fund folios can be added or changed with the DP, fund or registrar, online or on paper; accounts and folios without a nominee get reminders twice a year (para 10.2); it supersedes earlier nomination circulars, including 10 June 2024 (para 15)","hi":"डीमैट खाते और फ़ोलियो के नॉमिनी DP, फ़ंड या रजिस्ट्रार के पास, ऑनलाइन या फ़ॉर्म भरकर, जोड़े या बदले जा सकते हैं; बिना नॉमिनी वाले खातों को साल में दो बार याद दिलाया जाता है (पैरा 10.2); यह 10 जून 2024 सहित पुराने नॉमिनी परिपत्रों की जगह लेता है (पैरा 15)"},"note":{"en":"Circular of 29 May 2026, in force from 1 September 2026. Its full text was read from NSDL's copy; some older official pages still describe freezing, which no longer applies.","hi":"29 मई 2026 का परिपत्र, 1 सितंबर 2026 से लागू। इसका पूरा पाठ NSDL की प्रति से पढ़ा गया; कुछ पुराने आधिकारिक पेज अब भी खाते रोके जाने की बात कहते हैं, जो अब लागू नहीं है।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-dos-donts","enabled":true,"name":{"en":"SEBI: investor do's and don'ts","hi":"SEBI: निवेशक क्या करें और क्या न करें"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://investor.sebi.gov.in/securities-dos_and_donts.html","supports":{"en":"Keep your information updated and tell your broker or depository participant when your address, bank details, email or mobile number change","hi":"अपनी जानकारी अपडेट रखें और पता, बैंक विवरण, ईमेल या मोबाइल नंबर बदलने पर अपने ब्रोकर या DP को बताएँ"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-physical-faq","enabled":true,"name":{"en":"SEBI: transfers of physical shares (FAQ)","hi":"SEBI: कागज़ी (भौतिक) शेयरों का ट्रांसफ़र (प्रश्नोत्तर)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/faqfiles/apr-2019/1554376023305.pdf","supports":{"en":"From 1 April 2019, transfers happen only in demat form; physical shares must be dematerialised before they are sold or transferred, which needs a demat account (questions 1, 4 and 10)","hi":"1 अप्रैल 2019 से ट्रांसफ़र केवल डीमैट रूप में होता है; कागज़ी शेयर बेचने या ट्रांसफ़र करने से पहले डीमैट कराने होते हैं, जिसके लिए डीमैट खाता चाहिए (प्रश्न 1, 4 और 10)"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-relodgement-2026","enabled":true,"name":{"en":"SEBI: special window for old physical share transfers (2026)","hi":"SEBI: पुराने भौतिक शेयर हस्तांतरण के लिए विशेष अवधि (2026)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/attachdocs/jan-2026/1769778597451.pdf","supports":{"en":"A special window from 5 February 2026 to 4 February 2027 for transfer requests of physical shares that could not be completed before April 2019","hi":"अप्रैल 2019 से पहले पूरे न हो सके भौतिक शेयर हस्तांतरण अनुरोधों के लिए 5 फ़रवरी 2026 से 4 फ़रवरी 2027 तक विशेष अवधि"},"note":{"en":"Press release of 30 January 2026. Ask the company's registrar (RTA) whether it applies.","hi":"30 जनवरी 2026 की प्रेस विज्ञप्ति। कंपनी के रजिस्ट्रार (RTA) से पूछें कि क्या यह लागू है।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"rbi-never-ask","enabled":true,"name":{"en":"RBI: banks never ask for your PIN, OTP or password","hi":"RBI: बैंक कभी आपका PIN, OTP या पासवर्ड नहीं माँगते"},"authority":"Reserve Bank of India (RBI)","url":"https://rbi.org.in/commonman/English/scripts/PressReleases.aspx?Id=3232","supports":{"en":"Banks and other payment system operators never ask for details such as password, PIN, OTP or CVV","hi":"बैंक और दूसरी भुगतान सेवाएँ कभी पासवर्ड, PIN, OTP या CVV जैसी जानकारी नहीं माँगतीं"},"note":{"en":"RBI press release, 22 June 2020.","hi":"RBI प्रेस विज्ञप्ति, 22 जून 2020।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"npci-upi-help","enabled":true,"name":{"en":"NPCI: UPI Help (complaints inside the payment app)","hi":"NPCI: UPI हेल्प (भुगतान ऐप के भीतर शिकायत)"},"authority":"National Payments Corporation of India (NPCI)","url":"https://www.npci.org.in/uploads/UPI_Help_Brand_Guidelines_86c8c28922.pdf","supports":{"en":"For fraudulent transactions, UPI Help tells users to contact their bank, and it does not take complaints about successful person-to-person payments (page 13)","hi":"धोखाधड़ी वाले लेन-देन के लिए UPI हेल्प बैंक से संपर्क करने को कहता है, और व्यक्ति-से-व्यक्ति (P2P) के सफल भुगतान पर शिकायत नहीं लेता (पृष्ठ 13)"},"note":{"en":"NPCI guideline document, July 2023, pages 13 and 21. NPCI's dispute-redressal web pages could not be read for this review.","hi":"NPCI दिशानिर्देश दस्तावेज़, जुलाई 2023, पृष्ठ 13 और 21। इस समीक्षा में NPCI के विवाद-निवारण वेब पेज पढ़े नहीं जा सके।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"pib-1930","enabled":true,"name":{"en":"Government backgrounder: 1930 and the cybercrime portal","hi":"सरकारी पृष्ठभूमि नोट: 1930 और साइबर अपराध पोर्टल"},"authority":"Press Information Bureau, Government of India","url":"https://static.pib.gov.in/WriteReadData/specificdocs/documents/2025/oct/doc2025108660701.pdf","supports":{"en":"1930 gives immediate help to victims of online financial fraud: prompt reporting and, where possible, freezing of fraudulent transactions","hi":"1930 ऑनलाइन वित्तीय धोखाधड़ी के पीड़ितों को तुरंत मदद देता है: शीघ्र रिपोर्ट और, जहाँ संभव हो, धोखाधड़ी वाले लेन-देन पर रोक"},"note":{"en":"Backgrounder dated 8 October 2025, page 4.","hi":"8 अक्टूबर 2025 का पृष्ठभूमि नोट, पृष्ठ 4।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-upi-valid","enabled":true,"name":{"en":"SEBI: \"@valid\" UPI IDs for registered intermediaries (2025)","hi":"SEBI: रजिस्टर्ड संस्थाओं के लिए \"@valid\" UPI आईडी (2025)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/attachdocs/jun-2025/1749641449497.pdf","supports":{"en":"From 1 October 2025, SEBI-registered intermediaries must give investors UPI IDs with the \"@valid\" handle and a category suffix (for example abc.brk@validhdfc); payments to them show a thumbs-up inside a green triangle (paras 1.3, 2.1, 2.2 and 8)","hi":"1 अक्टूबर 2025 से SEBI में रजिस्टर्ड संस्थाओं को निवेशकों को \"@valid\" हैंडल और श्रेणी वाली UPI आईडी देनी होती है (जैसे abc.brk@validhdfc); इन्हें भुगतान पर हरे त्रिकोण में अँगूठे का निशान दिखता है (पैरा 1.3, 2.1, 2.2 और 8)"},"note":{"en":"Circular of 11 June 2025. Using these IDs is optional for investors and mandatory for intermediaries.","hi":"11 जून 2025 का परिपत्र। निवेशकों के लिए इनका उपयोग वैकल्पिक है और संस्थाओं के लिए अनिवार्य।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-check","enabled":true,"name":{"en":"SEBI Check: verify a UPI ID or bank account","hi":"SEBI Check: UPI आईडी या बैंक खाता जाँचें"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://siportal.sebi.gov.in/intermediary/sebi-check","supports":{"en":"SEBI's tool to verify the UPI IDs, QR codes and bank account details (account number and IFSC) of SEBI-registered intermediaries before paying","hi":"भुगतान से पहले SEBI में रजिस्टर्ड संस्थाओं की UPI आईडी, QR कोड और बैंक खाते (खाता नंबर और IFSC) की जाँच का SEBI का साधन"},"note":{"en":"Launched on 1 October 2025 (SEBI press release 64/2025).","hi":"1 अक्टूबर 2025 को शुरू (SEBI प्रेस विज्ञप्ति 64/2025)।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-icdr-faq","enabled":true,"name":{"en":"SEBI: FAQ on public issues (ICDR Regulations)","hi":"SEBI: पब्लिक इश्यू (ICDR नियम) पर प्रश्नोत्तर"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/sebi_data/faqfiles/may-2025/1747290561386.pdf","supports":{"en":"All investors apply for public issues through ASBA, and individuals can use UPI for applications up to ₹5 lakh (ASBA question 4, UPI question 4); there is no discretion in the allotment process (question 6.3)","hi":"पब्लिक इश्यू में सभी निवेशक ASBA से आवेदन करते हैं, और व्यक्तिगत निवेशक ₹5 लाख तक के आवेदन UPI से कर सकते हैं (ASBA प्रश्न 4, UPI प्रश्न 4); आवंटन की प्रक्रिया में कोई मनमानी नहीं होती (प्रश्न 6.3)"},"note":{"en":"Contents updated as on 15 May 2025.","hi":"15 मई 2025 तक अपडेट किया गया।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-social-caution","enabled":true,"name":{"en":"SEBI: caution on stock market scams on social media (2025)","hi":"SEBI: सोशल मीडिया पर शेयर बाज़ार धोखाधड़ी की चेतावनी (2025)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/media-and-notifications/press-releases/apr-2025/caution-to-public-against-fraudulent-manipulative-activities-on-social-media-platforms-smps-related-to-securities-market_93444.html","supports":{"en":"Scamsters entice investors into WhatsApp or Telegram \"VIP\", \"discounted trading\" or \"institutional trading\" groups; some give unregistered advice while falsely claiming SEBI registration or showing fake SEBI certificates","hi":"धोखेबाज़ निवेशकों को व्हाट्सऐप या टेलीग्राम के \"VIP\", \"डिस्काउंट ट्रेडिंग\" या \"संस्थागत ट्रेडिंग\" ग्रुप में बुलाते हैं; कुछ झूठा SEBI पंजीकरण बताकर या नकली SEBI प्रमाणपत्र दिखाकर बिना पंजीकरण सलाह देते हैं"},"note":{"en":"SEBI press release 22/2025, 11 April 2025.","hi":"SEBI प्रेस विज्ञप्ति 22/2025, 11 अप्रैल 2025।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-impersonation","enabled":true,"name":{"en":"SEBI: caution about people impersonating SEBI (2025)","hi":"SEBI: SEBI के नाम से धोखाधड़ी की चेतावनी (2025)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/media-and-notifications/press-releases/sep-2025/caution-to-the-public-regarding-impersonation-of-sebi_96449.html","supports":{"en":"Fraudsters claim to be SEBI officials, use SEBI's letterhead, logo and seal, and ask for payments; SEBI's emails come only from addresses ending in @sebi.gov.in","hi":"धोखेबाज़ खुद को SEBI अधिकारी बताते हैं, SEBI का लेटरहेड, लोगो और मुहर इस्तेमाल करते हैं और भुगतान माँगते हैं; SEBI के ईमेल केवल @sebi.gov.in पर खत्म होने वाले पतों से आते हैं"},"note":{"en":"SEBI press release 60/2025, 5 September 2025.","hi":"SEBI प्रेस विज्ञप्ति 60/2025, 5 सितंबर 2025।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"i4c-digital-arrest","enabled":true,"name":{"en":"I4C advisory: the \"digital arrest\" scam (2025)","hi":"I4C सलाह: \"डिजिटल अरेस्ट\" धोखाधड़ी (2025)"},"authority":"Indian Cyber Crime Coordination Centre (I4C), Ministry of Home Affairs","url":"https://i4c.mha.gov.in/theme/resources/advisories/ADVISORYTAU-ADV-003DigitalArrest06.03.2025.pdf","supports":{"en":"Scammers posing as law enforcement use threats of \"digital arrest\" to pressure victims; real law enforcement does not arrest anyone digitally; report cyber fraud at cybercrime.gov.in or by calling 1930","hi":"कानून लागू करने वाली एजेंसी के अधिकारी बनकर धोखेबाज़ \"डिजिटल अरेस्ट\" की धमकी देते हैं; असली पुलिस किसी को डिजिटल रूप से गिरफ़्तार नहीं करती; cybercrime.gov.in पर या 1930 पर कॉल करके रिपोर्ट करें"},"note":{"en":"Advisory TAU/ADV/003, 6 March 2025.","hi":"सलाह TAU/ADV/003, 6 मार्च 2025।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"chakshu","enabled":true,"name":{"en":"Chakshu (Sanchar Saathi): report suspected fraud calls and messages","hi":"चक्षु (संचार साथी): संदिग्ध धोखाधड़ी कॉल और संदेश की रिपोर्ट"},"authority":"Department of Telecommunications, Government of India","url":"https://sancharsaathi.gov.in/sfc/","supports":{"en":"Report suspected fraud communication received by call, SMS or WhatsApp when the sender's number is visible; Chakshu is not for money already lost, which should be reported to 1930","hi":"कॉल, SMS या व्हाट्सऐप से आए संदिग्ध धोखाधड़ी संदेश की रिपोर्ट करें, जब भेजने वाले का नंबर दिखे; पैसे जा चुके हों तो चक्षु नहीं, 1930 पर रिपोर्ट करें"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"sebi-intermediaries","enabled":true,"name":{"en":"SEBI: check whether an entity is registered","hi":"SEBI: जाँचें कि संस्था रजिस्टर्ड है या नहीं"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/intermediaries.html","supports":{"en":"SEBI's directory to check whether a broker, investment adviser, research analyst or other intermediary is registered; SEBI advises investors to verify registration here before investing","hi":"यह जाँचने के लिए SEBI की सूची कि कोई ब्रोकर, निवेश सलाहकार, रिसर्च एनालिस्ट या दूसरी संस्था रजिस्टर्ड है या नहीं; SEBI निवेश से पहले यहाँ पंजीकरण जाँचने की सलाह देता है"},"note":{"en":"SEBI press release 27/2025 (21 May 2025) points investors to this page.","hi":"SEBI प्रेस विज्ञप्ति 27/2025 (21 मई 2025) निवेशकों को इस पेज पर भेजती है।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"},{"id":"rbi-sachet","enabled":true,"name":{"en":"RBI Sachet: check deposit-takers and report illegal schemes","hi":"RBI सचेत: जमा लेने वाली संस्थाएँ जाँचें और अवैध योजनाओं की शिकायत करें"},"authority":"Reserve Bank of India (RBI)","url":"https://sachet.rbi.org.in/","supports":{"en":"Find out which entities are allowed to accept deposits, and report entities that collect money under illegal deposit or investment schemes","hi":"जानें कि कौन-सी संस्थाएँ जमा ले सकती हैं, और अवैध जमा या निवेश योजनाओं में पैसा लेने वाली संस्थाओं की शिकायत करें"},"note":{"en":"Launched by RBI in August 2016 (press release 2016-2017/312).","hi":"RBI ने अगस्त 2016 में शुरू किया (प्रेस विज्ञप्ति 2016-2017/312)।"},"lastReviewed":"2026-10-01","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore"}],"helplines":[{"id":"cyber-1930","number":"1930","label":{"en":"Call 1930","hi":"1930 पर कॉल करें"},"sourceId":"cyber"}]},"warnings":{"schemaVersion":1,"channelQuestion":{"en":"Where did this message come from? (optional)","hi":"यह संदेश कहाँ से आया? (वैकल्पिक)"},"channelWhy":{"en":"This changes only the advice under the result, not the warning check.","hi":"इससे केवल परिणाम के नीचे की सलाह बदलती है, खतरे की जाँच नहीं।"},"channels":[{"id":"sms","label":{"en":"SMS","hi":"SMS (एसएमएस)"},"advice":"link"},{"id":"whatsapp","label":{"en":"WhatsApp","hi":"व्हाट्सऐप"},"advice":"group"},{"id":"telegram","label":{"en":"Telegram","hi":"टेलीग्राम"},"advice":"group"},{"id":"social","label":{"en":"Social media or a video app","hi":"सोशल मीडिया या वीडियो ऐप"},"advice":"group"},{"id":"email","label":{"en":"Email","hi":"ईमेल"},"advice":"link"},{"id":"call","label":{"en":"Phone call","hi":"फ़ोन कॉल"},"advice":"link"}],"channelAdvice":{"group":{"text":{"en":"Investment tips and trading groups on chat apps and social media are a common route for fake trading-app scams. Do not install apps or pay through links shared there.","hi":"चैट ऐप और सोशल मीडिया पर निवेश टिप्स और ट्रेडिंग समूह नकली ट्रेडिंग ऐप धोखाधड़ी का आम रास्ता हैं। वहाँ साझा किए गए लिंक से ऐप इंस्टॉल न करें और भुगतान न करें।"},"sourceId":"apps"},"link":{"text":{"en":"Do not use links, numbers or apps from the message. Contact the institution through its official website or app.","hi":"संदेश में दिए लिंक, नंबर या ऐप का उपयोग न करें। संस्था से उसकी आधिकारिक वेबसाइट या ऐप के माध्यम से संपर्क करें।"},"sourceId":"scam"}},"warnings":{"certainty":{"title":{"en":"Promises of certain returns","hi":"पक्के लाभ का वादा"},"why":{"en":"Verify independently. A promise of certain securities-market returns is a serious warning sign.","hi":"खुद जाँच करें। शेयर बाज़ार में पक्के लाभ का वादा खतरे का बड़ा संकेत है।"},"sourceId":"scam"},"urgency":{"title":{"en":"Pressure to pay quickly","hi":"जल्दी भुगतान का दबाव"},"why":{"en":"Pause. Pressure to hurry can prevent independent checks.","hi":"रुकें। जल्दबाज़ी के दबाव में आप खुद जाँच करने से चूक सकते हैं।"},"sourceId":"scam"},"personal":{"title":{"en":"Payment to a personal account","hi":"निजी खाते में भुगतान"},"why":{"en":"Confirm the payment destination using the institution’s official contact details.","hi":"पैसा किसके खाते में जा रहा है, यह संस्था के आधिकारिक संपर्क से पक्का करें।"},"sourceId":"apps"},"secrets":{"title":{"en":"Credentials or remote access requested","hi":"OTP, PIN, पासवर्ड या रिमोट एक्सेस की माँग"},"why":{"en":"Never share OTP, PIN, password or remote access with someone offering investment help.","hi":"निवेश में मदद का दावा करने वाले को कभी OTP, PIN या पासवर्ड न बताएँ, और न ही अपना फ़ोन दूर से चलाने दें (रिमोट एक्सेस)।"},"sourceId":"apps"},"social":{"title":{"en":"Investment offer through a chat group","hi":"चैट समूह से निवेश प्रस्ताव"},"why":{"en":"A group, testimonial or logo is not proof that the offer is legitimate.","hi":"समूह, दूसरों की तारीफ़ (टेस्टिमोनियल) या किसी संस्था के लोगो से यह साबित नहीं होता कि प्रस्ताव असली है।"},"sourceId":"apps"},"borrowing":{"title":{"en":"Borrowing to invest or trade","hi":"निवेश या ट्रेडिंग के लिए उधार"},"why":{"en":"Losses can leave the loan unpaid. Pause and consider the effect on essential household money.","hi":"नुकसान के बाद भी कर्ज बाकी रहता है। घर की ज़रूरी रकम पर असर सोचकर रुकें।"},"sourceId":"apps"},"withdrawal":{"title":{"en":"A fee to release your money","hi":"पैसे निकालने के लिए नया शुल्क"},"why":{"en":"Do not send another payment just to release alleged profits. Verify and consider reporting suspected fraud.","hi":"जो मुनाफ़ा दिखाया जा रहा है, उसे निकालने के लिए और पैसा न भेजें। खुद जाँच करें, और धोखाधड़ी का शक हो तो रिपोर्ट करें।"},"sourceId":"apps"},"app":{"title":{"en":"Unverified app installation","hi":"बिना जाँचे ऐप को इंस्टॉल करने की माँग"},"why":{"en":"Verify trading apps through official exchange or SEBI investor resources. Do not install an app from an unsolicited message.","hi":"ट्रेडिंग ऐप को स्टॉक एक्सचेंज या SEBI की आधिकारिक वेबसाइट पर जाँचें। बिना माँगे आए संदेश के कहने पर कोई ऐप इंस्टॉल न करें।"},"sourceId":"apps"},"doubling":{"title":{"en":"Money-multiplication promise","hi":"पैसे कई गुना करने का वादा"},"why":{"en":"Very rapid or daily returns need scepticism and independent checks.","hi":"बहुत तेज़ या रोज़ के मुनाफ़े के दावे पर शक करें और खुद जाँच करें।"},"sourceId":"scam"},"impersonation":{"title":{"en":"Claims to be, or to be approved by, an official body","hi":"SEBI, RBI जैसी सरकारी संस्था होने या उसकी मंज़ूरी का दावा"},"why":{"en":"SEBI warns that fraudsters pose as its officials, use its letterhead, logo and seal, and ask for payments. SEBI's emails come only from addresses ending in @sebi.gov.in. Check any such claim on the official website, not through the message.","hi":"SEBI चेतावनी देता है कि धोखेबाज़ उसके अधिकारी बनकर, उसका लेटरहेड, लोगो और मुहर इस्तेमाल करके भुगतान माँगते हैं। SEBI के ईमेल केवल @sebi.gov.in पर खत्म होने वाले पतों से आते हैं। ऐसे दावे को संदेश से नहीं, आधिकारिक वेबसाइट पर जाँचें।"},"sourceId":"sebi-impersonation"},"threat":{"title":{"en":"Threat of arrest, legal action or a blocked account","hi":"गिरफ़्तारी, कानूनी कार्रवाई या खाता बंद करने की धमकी"},"why":{"en":"Scammers posing as police or other agencies threaten \"digital arrest\" to frighten people into paying. Real law enforcement does not arrest anyone digitally. Do not pay; report at cybercrime.gov.in or call 1930.","hi":"पुलिस या दूसरी एजेंसी के अधिकारी बनकर धोखेबाज़ \"डिजिटल अरेस्ट\" की धमकी देकर डराते और पैसे माँगते हैं। असली पुलिस किसी को डिजिटल रूप से गिरफ़्तार नहीं करती। भुगतान न करें; cybercrime.gov.in पर रिपोर्ट करें या 1930 पर कॉल करें।"},"sourceId":"i4c-digital-arrest"},"tips":{"title":{"en":"Unsolicited stock tips or trading calls","hi":"बिना माँगे शेयर टिप्स या ट्रेडिंग कॉल"},"why":{"en":"SEBI warns that scamsters pull investors into WhatsApp or Telegram \"VIP\" or \"institutional trading\" groups, and that some falsely claim SEBI registration or show fake SEBI certificates. Check the registration on SEBI's website before acting on any tip.","hi":"SEBI चेतावनी देता है कि धोखेबाज़ निवेशकों को व्हाट्सऐप या टेलीग्राम के \"VIP\" या \"संस्थागत ट्रेडिंग\" ग्रुप में खींचते हैं, और कुछ झूठा SEBI पंजीकरण बताते हैं या नकली SEBI प्रमाणपत्र दिखाते हैं। किसी भी टिप पर कुछ करने से पहले SEBI की वेबसाइट पर पंजीकरण जाँचें।"},"sourceId":"sebi-social-caution"},"link":{"title":{"en":"Suspicious link","hi":"संदिग्ध लिंक"},"why":{"en":"SEBI lists unverified app links and APK files as a red flag. A shortened or look-alike link can hide where it goes. Do not open it: type the official address yourself or use the official app store.","hi":"SEBI बिना जाँचे ऐप लिंक और APK फ़ाइलों को खतरे का संकेत बताता है। छोटा किया गया लिंक, या असली से मिलता-जुलता नकली लिंक, असली पता छिपा सकता है। इसे न खोलें: आधिकारिक पता खुद टाइप करें या आधिकारिक ऐप स्टोर इस्तेमाल करें।"},"sourceId":"apps"},"ipo":{"title":{"en":"Fake IPO allotment or special-access offer","hi":"पक्के IPO आवंटन या खास पहुँच का झूठा प्रस्ताव"},"why":{"en":"In a public issue everyone applies through ASBA from their own bank account, and there is no discretion in allotment, so nobody can sell or guarantee you an allotment. Apply only yourself, through your own bank or broker.","hi":"पब्लिक इश्यू में हर कोई अपने बैंक खाते से ASBA के ज़रिए आवेदन करता है, और आवंटन में कोई मनमानी नहीं होती, इसलिए कोई आपको आवंटन बेच या पक्का नहीं कर सकता। आवेदन केवल खुद, अपने बैंक या ब्रोकर के माध्यम से करें।"},"sourceId":"sebi-icdr-faq"},"recovery":{"title":{"en":"Offer to recover lost money","hi":"डूबे पैसे वापस दिलाने का प्रस्ताव"},"why":{"en":"Do not pay anyone a fee to get back money lost to fraud. Report the loss yourself to the cyber crime helpline 1930 or on the National Cyber Crime Reporting Portal.","hi":"धोखाधड़ी में गए पैसे वापस दिलाने के लिए किसी को शुल्क न दें। नुकसान की रिपोर्ट स्वयं साइबर अपराध हेल्पलाइन 1930 या राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल पर करें।"},"sourceId":"cyber"}}},"routes":{"schemaVersion":2,"texts":{"chooseIssue":{"en":"What is your problem about?","hi":"आपकी समस्या किस बारे में है?"},"scopeLabel":{"en":"Who handles this:","hi":"इसे कौन देखता है:"},"stageQuestion":{"en":"Where have you complained so far? Choose the last one.","hi":"अब तक आपने कहाँ शिकायत की है? आखिरी वाला चुनें।"},"stageNone":{"en":"Not yet","hi":"अभी तक नहीं"},"replyQuestion":{"en":"What happened after that complaint?","hi":"उस शिकायत के बाद क्या हुआ?"},"replyWaiting":{"en":"Waiting for a reply","hi":"जवाब का इंतज़ार है"},"replyUnresolved":{"en":"Replied, but not resolved","hi":"जवाब आया, पर समाधान नहीं हुआ"},"replyResolved":{"en":"Resolved","hi":"समाधान हो गया"},"numberQuestion":{"en":"Do you have a complaint or acknowledgement number?","hi":"क्या आपके पास शिकायत या पावती नंबर है?"},"numberYes":{"en":"Yes","hi":"हाँ"},"numberNo":{"en":"No","hi":"नहीं"},"nextTitle":{"en":"Your next step","hi":"आपका अगला कदम"},"nextLabel":{"en":"Go to:","hi":"यहाँ जाएँ:"},"ifNoReplyLabel":{"en":"If there is no reply in time, go to:","hi":"समय पर जवाब न मिले तो यहाँ जाएँ:"},"answerReply":{"en":"Tell us what happened after your complaint to see your next step.","hi":"अगला कदम देखने के लिए बताएँ कि शिकायत के बाद क्या हुआ।"},"firstAdvice":{"en":"Start with the institution itself. Use only contact details from its official website or app, never from a message.","hi":"शुरुआत संस्था से ही करें। केवल उसकी आधिकारिक वेबसाइट या ऐप के संपर्क विवरण का उपयोग करें, संदेश में दिए विवरण का कभी नहीं।"},"waitAdvice":{"en":"Give them the time the official rules allow to reply; the official page below explains it.","hi":"जवाब के लिए उन्हें आधिकारिक नियमों में दिया गया समय दें; नीचे का आधिकारिक पेज इसे समझाता है।"},"resolvedAdvice":{"en":"Good. Keep the reply and your complaint number safely; you may need them if the problem comes back.","hi":"अच्छा। जवाब और शिकायत नंबर सुरक्षित रखें; समस्या दोबारा हो तो इनकी ज़रूरत पड़ सकती है।"},"noNumberAdvice":{"en":"Ask for a complaint or acknowledgement number, or write down the date and how you complained. Escalating is easier with it.","hi":"शिकायत या पावती नंबर माँगें, या तारीख और शिकायत का तरीका लिख लें। इससे शिकायत आगे बढ़ाना आसान होता है।"},"lastAdvice":{"en":"You have reached the last official step listed here. Read that official page for any further options.","hi":"आप यहाँ दिए आखिरी आधिकारिक कदम तक पहुँच गए हैं। आगे के विकल्पों के लिए वही आधिकारिक पेज पढ़ें।"},"pathTitle":{"en":"Your complaint path","hi":"आपकी शिकायत का रास्ता"},"evidenceTitle":{"en":"Keep this evidence","hi":"ये सबूत रखें"},"abstainTitle":{"en":"We can't tell yet which official route applies","hi":"अभी हम नहीं बता सकते कि कौन-सा आधिकारिक रास्ता लागू है"}},"scopes":[{"id":"securities","label":{"en":"Securities market","hi":"प्रतिभूति बाज़ार"},"authority":{"en":"SEBI (Securities and Exchange Board of India)","hi":"SEBI (भारतीय प्रतिभूति और विनिमय बोर्ड)"}},{"id":"banking","label":{"en":"Banks, NBFCs, cards and wallets","hi":"बैंक, NBFC, कार्ड और वॉलेट"},"authority":{"en":"RBI (Reserve Bank of India)","hi":"RBI (भारतीय रिज़र्व बैंक)"}},{"id":"insurance","label":{"en":"Insurance","hi":"बीमा"},"authority":{"en":"IRDAI (Insurance Regulatory and Development Authority of India)","hi":"IRDAI (भारतीय बीमा विनियामक और विकास प्राधिकरण)"}},{"id":"pension","label":{"en":"Pension: NPS and Atal Pension Yojana","hi":"पेंशन: NPS और अटल पेंशन योजना"},"authority":{"en":"PFRDA (Pension Fund Regulatory and Development Authority)","hi":"PFRDA (पेंशन निधि विनियामक और विकास प्राधिकरण)"}},{"id":"cybercrime","label":{"en":"Cybercrime and online fraud","hi":"साइबर अपराध और ऑनलाइन धोखाधड़ी"},"authority":{"en":"Police, through helpline 1930 and the National Cyber Crime Reporting Portal (Ministry of Home Affairs)","hi":"पुलिस, हेल्पलाइन 1930 और राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल के माध्यम से (गृह मंत्रालय)"}},{"id":"unclaimed","label":{"en":"Unclaimed shares and dividends","hi":"बिना दावे वाले शेयर और लाभांश"},"authority":{"en":"IEPF Authority (Ministry of Corporate Affairs)","hi":"IEPF प्राधिकरण (कॉर्पोरेट कार्य मंत्रालय)"}}],"levels":[{"id":"scores","scope":"securities","name":{"en":"SEBI SCORES","hi":"SEBI SCORES (स्कोर्स)"},"explain":{"en":"SCORES is SEBI's official online complaint system for listed companies and SEBI-registered intermediaries such as brokers, depository participants, registrars and mutual funds. Use it after you have complained to the entity, within one year of the problem. If you are not satisfied with the outcome, ask for a review within 15 days of the reply: first by a designated body such as a stock exchange, a depository or AMFI, and then by SEBI. You can also go to SMART ODR at any point.","hi":"SCORES, SEBI का आधिकारिक ऑनलाइन शिकायत सिस्टम है। इस पर शेयर बाज़ार में लिस्टेड कंपनियों और SEBI में रजिस्टर्ड संस्थाओं (जैसे ब्रोकर, DP, रजिस्ट्रार और म्यूचुअल फ़ंड) के खिलाफ़ शिकायत होती है। पहले संस्था से शिकायत करें, फिर समस्या होने के एक साल के अंदर SCORES पर शिकायत करें। जवाब से संतुष्ट न हों तो जवाब मिलने के 15 दिन के अंदर दोबारा जाँच (समीक्षा) माँगें: पहले स्टॉक एक्सचेंज, डिपॉज़िटरी या AMFI जैसी तय संस्था जाँच करती है, फिर SEBI। आप कभी भी स्मार्ट ODR पर भी जा सकते हैं।"},"sourceId":"scores","linkLabel":{"en":"Open official SCORES","hi":"आधिकारिक SCORES खोलें"}},{"id":"smart-odr","scope":"securities","name":{"en":"SMART ODR: online conciliation and arbitration","hi":"स्मार्ट ODR: ऑनलाइन सुलह और पंच-फ़ैसला (आर्बिट्रेशन)"},"explain":{"en":"If the dispute is still not resolved, you can register it on SMART ODR, the online dispute resolution portal run by the stock exchanges and depositories. You must first have complained to the entity. Pre-conciliation is free for both sides and conciliation fees are paid by the market participant, but if the dispute goes to arbitration, both sides pay fees that depend on the claim amount.","hi":"यदि विवाद अब भी नहीं सुलझता, तो आप उसे स्मार्ट ODR पर दर्ज कर सकते हैं, जो स्टॉक एक्सचेंजों और डिपॉज़िटरी द्वारा चलाया जाने वाला ऑनलाइन विवाद समाधान पोर्टल है। पहले संस्था से शिकायत करना ज़रूरी है। प्री-कंसिलिएशन (शुरुआती सुलह) दोनों पक्षों के लिए निःशुल्क है और सुलह की फ़ीस रजिस्टर्ड संस्था देती है, लेकिन मामला पंच-फ़ैसले (आर्बिट्रेशन) में जाए तो दोनों पक्ष फ़ीस देते हैं, जो दावे की राशि पर निर्भर करती है।"},"sourceId":"sebi-odr","linkLabel":{"en":"Read SEBI's SMART ODR page","hi":"SEBI का स्मार्ट ODR पेज पढ़ें"}},{"id":"iepf-claim","scope":"unclaimed","name":{"en":"Claim from the IEPF Authority","hi":"IEPF प्राधिकरण से दावा"},"explain":{"en":"If the transfer is confirmed, the shares or dividends can be claimed back through the IEPF Authority's official claim process on its website, iepf.gov.in. Under the IEPF rules, the company verifies the claim before the Authority refunds the money or credits the shares.","hi":"यदि ट्रांसफ़र की पुष्टि हो जाए, तो शेयर या डिविडेंड IEPF प्राधिकरण की वेबसाइट iepf.gov.in पर आधिकारिक दावा प्रक्रिया से वापस माँगे जा सकते हैं। IEPF नियमों के अनुसार, प्राधिकरण पैसे लौटाए या शेयर जमा करे, उससे पहले कंपनी दावे की जाँच करती है।"},"sourceId":"iepf-rules","linkLabel":{"en":"Read the official IEPF claim rules","hi":"IEPF दावे के आधिकारिक नियम पढ़ें"}},{"id":"rbi-ombudsman","scope":"banking","name":{"en":"RBI Ombudsman (Integrated Ombudsman Scheme, 2026)","hi":"RBI लोकपाल (एकीकृत लोकपाल योजना, 2026)"},"explain":{"en":"If the bank or other covered entity does not reply within 30 days (or a longer period set by RBI, NPCI or card-network rules), or you are not satisfied with its reply, you can complain to the RBI Ombudsman online at cms.rbi.org.in. File within 90 days after that period ends or after the entity's last reply, whichever is later. The scheme covers banks, many NBFCs, prepaid wallet and card issuers and credit information companies. A matter already before a court or another forum cannot be taken.","hi":"यदि बैंक या दूसरी संस्था 30 दिन में (या RBI, NPCI या कार्ड नेटवर्क के नियमों में दिए अधिक समय में) जवाब न दे, या आप उसके जवाब से संतुष्ट न हों, तो आप RBI लोकपाल के पास cms.rbi.org.in पर ऑनलाइन शिकायत कर सकते हैं। यह समय पूरा होने या संस्था का आखिरी जवाब मिलने (जो भी बाद में हो) के 90 दिन के अंदर शिकायत करें। योजना में बैंक, कई NBFC, प्रीपेड वॉलेट और कार्ड जारी करने वाली कंपनियाँ और क्रेडिट सूचना कंपनियाँ शामिल हैं। जो मामला पहले से किसी अदालत या दूसरे मंच पर है, वह नहीं लिया जाता।"},"sourceId":"rbi-ios-faq","linkLabel":{"en":"Read the official RBI Ombudsman FAQ","hi":"RBI लोकपाल के आधिकारिक प्रश्नोत्तर पढ़ें"}},{"id":"bima-bharosa","scope":"insurance","name":{"en":"IRDAI Bima Bharosa","hi":"IRDAI बीमा भरोसा"},"explain":{"en":"If the insurer does not resolve your complaint, or you are not satisfied with its reply, you can take it to IRDAI through the Bima Bharosa portal. Bima Bharosa does not ask for any payment.","hi":"यदि बीमा कंपनी आपकी शिकायत का समाधान न करे, या आप उसके जवाब से संतुष्ट न हों, तो आप बीमा भरोसा पोर्टल के माध्यम से IRDAI के पास शिकायत ले जा सकते हैं। बीमा भरोसा कोई भुगतान नहीं माँगता।"},"sourceId":"bima-bharosa","linkLabel":{"en":"Open IRDAI Bima Bharosa","hi":"IRDAI बीमा भरोसा खोलें"}},{"id":"insurance-ombudsman","scope":"insurance","name":{"en":"Insurance Ombudsman","hi":"बीमा लोकपाल"},"explain":{"en":"You can approach the Insurance Ombudsman if the insurer rejected your written complaint, did not reply within one month, or you are not satisfied with its reply. The rules require a written complaint to the insurer first; they do not require going to Bima Bharosa. Complain within one year of the insurer's reply, or of the end of that month if it did not reply. A matter already before a court, consumer forum or arbitrator cannot be taken.","hi":"यदि बीमा कंपनी ने आपकी लिखित शिकायत अस्वीकार की, एक महीने में जवाब नहीं दिया, या आप उसके जवाब से संतुष्ट नहीं हैं, तो आप बीमा लोकपाल के पास जा सकते हैं। नियमों में पहले बीमा कंपनी को लिखित शिकायत ज़रूरी है; बीमा भरोसा पर जाना ज़रूरी नहीं है। बीमा कंपनी का जवाब आने के एक साल के अंदर शिकायत करें; जवाब न आए तो वह एक महीना पूरा होने के एक साल के अंदर। जो मामला पहले से अदालत, उपभोक्ता अदालत (फ़ोरम) या पंच (आर्बिट्रेटर) के पास है, वह नहीं लिया जाता।"},"sourceId":"insurance-ombudsman","linkLabel":{"en":"Read the official Insurance Ombudsman FAQ","hi":"बीमा लोकपाल के आधिकारिक प्रश्नोत्तर पढ़ें"}},{"id":"nps-trust","scope":"pension","name":{"en":"NPS Trust (second level)","hi":"NPS ट्रस्ट (दूसरा स्तर)"},"explain":{"en":"If your intermediary or nodal office does not resolve your NPS or APY grievance within 30 days, or you are not satisfied with the resolution, you can escalate it to the NPS Trust.","hi":"यदि आपकी रजिस्टर्ड संस्था या नोडल कार्यालय 30 दिन में आपकी NPS या APY शिकायत का समाधान न करे, या आप समाधान से संतुष्ट न हों, तो आप उसे NPS ट्रस्ट के पास आगे बढ़ा सकते हैं।"},"sourceId":"pfrda-grievance","linkLabel":{"en":"Read PFRDA's grievance levels","hi":"PFRDA के शिकायत स्तर पढ़ें"}},{"id":"pfrda-ombudsman","scope":"pension","name":{"en":"Ombudsman appointed by PFRDA","hi":"PFRDA द्वारा नियुक्त लोकपाल"},"explain":{"en":"If the NPS Trust does not reply within 21 days, or you are not satisfied with its reply, you can approach the Ombudsman appointed by PFRDA.","hi":"यदि NPS ट्रस्ट 21 दिन में जवाब न दे, या आप उसके जवाब से संतुष्ट न हों, तो आप PFRDA द्वारा नियुक्त लोकपाल के पास जा सकते हैं।"},"sourceId":"pfrda-grievance","linkLabel":{"en":"Read PFRDA's grievance levels","hi":"PFRDA के शिकायत स्तर पढ़ें"}}],"issues":[{"id":"fraud","enabled":true,"kind":"outcomes","scope":"cybercrime","label":{"en":"Suspicious offer or possible fraud","hi":"संदिग्ध प्रस्ताव या धोखाधड़ी"},"shortLabel":{"en":"Possible fraud","hi":"संभावित धोखाधड़ी"},"question":{"en":"Have you already sent money?","hi":"क्या आपने पैसे भेज दिए हैं?"},"answers":[{"id":"no","label":{"en":"No / not sure","hi":"नहीं / पक्का नहीं पता"},"outcome":"fraud-pause"},{"id":"yes","label":{"en":"Yes","hi":"हाँ"},"outcome":"fraud-urgent"}]},{"id":"broker","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"Stock broker or demat account (depository participant)","hi":"स्टॉक ब्रोकर या डीमैट खाता (DP)"},"shortLabel":{"en":"Broker or demat account","hi":"ब्रोकर या डीमैट खाता"},"firstContact":{"name":{"en":"Your stock broker or depository participant (DP)","hi":"आपका स्टॉक ब्रोकर या डिपॉज़िटरी पार्टिसिपेंट (DP)"},"how":{"en":"Complain in writing to its grievance desk, using the email or complaint option on its official website or app, and keep the complaint number. SEBI asks investors to go to the entity first.","hi":"उसकी आधिकारिक वेबसाइट या ऐप के ईमेल/शिकायत विकल्प से शिकायत विभाग को लिखकर शिकायत करें, और शिकायत नंबर सँभालकर रखें। SEBI निवेशकों से पहले संबंधित संस्था के पास जाने को कहता है।"},"sourceId":"scores-home"},"ladder":["scores","smart-odr"],"evidence":[{"en":"Contract notes and statements for the trades or entries involved","hi":"जिन सौदों या एंट्री में समस्या है, उनके कॉन्ट्रैक्ट नोट और स्टेटमेंट"},{"en":"Your complaint to the broker or DP and its reply, with dates","hi":"ब्रोकर या DP को की गई शिकायत और उसका जवाब, तारीखों सहित"},{"en":"Emails, messages or screenshots about the problem, with account numbers covered except the last four digits","hi":"समस्या से जुड़े ईमेल, संदेश या स्क्रीनशॉट, खाता नंबर के अंतिम चार अंक छोड़कर बाकी छिपाकर"}]},{"id":"company","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"Listed company or its registrar (RTA): dividend, share certificate or other shareholder service","hi":"शेयर बाज़ार में लिस्टेड कंपनी या उसका रजिस्ट्रार (RTA): लाभांश, शेयर प्रमाणपत्र या अन्य शेयरधारक सेवा"},"shortLabel":{"en":"Company or registrar (RTA)","hi":"कंपनी या रजिस्ट्रार (RTA)"},"firstContact":{"name":{"en":"The company's investor grievance contact or its registrar and transfer agent (RTA)","hi":"कंपनी का निवेशक शिकायत संपर्क या उसका रजिस्ट्रार और ट्रांसफ़र एजेंट (RTA)"},"how":{"en":"Complain in writing using the contact details on the company's or RTA's official website, and keep the complaint number. For paper (physical) holdings, ड़कर बाकी छिपाकर"},{"en":"Your complaint to the bank or provider and its reply, with dates","hi":"बैंक या सेवा को की गई शिकायत और उसका जवाब, तारीखों सहित"},{"en":"Receipts, transaction references and screenshots","hi":"रसीदें, लेन-देन संदर्भ और स्क्रीनशॉट"}]},{"id":"insurance","enabled":true,"kind":"ladder","scope":"insurance","label":{"en":"Insurance policy or claim problem","hi":"बीमा पॉलिसी या दावे की समस्या"},"shortLabel":{"en":"Insurance","hi":"बीमा"},"firstContact":{"name":{"en":"Your insurance company's grievance officer","hi":"आपकी बीमा कंपनी का शिकायत अधिकारी"},"how":{"en":"Complain to the insurer first, in writing, through its official website, app or branch. Keep the complaint number and its reply.","hi":"पहले बीमा कंपनी से लिखित शिकायत करें, उसकी आधिकारिक वेबसाइट, ऐप या शाखा के माध्यम से। शिकायत नंबर और उसका जवाब रखें।"},"sourceId":"bima-bharosa-faq"},"ladder":["bima-bharosa","insurance-ombudsman"],"evidence":[{"en":"The policy document and premium receipts","hi":"पॉलिसी दस्तावेज़ और प्रीमियम रसीदें"},{"en":"Claim forms, any rejection letter and other letters from the insurer","hi":"दावा फ़ॉर्म, दावा नामंज़ूर होने का पत्र (अगर मिला हो) और बीमा कंपनी के दूसरे पत्र"},{"en":"Your complaint to the insurer and its reply, with dates","hi":"बीमा कंपनी को की गई शिकायत और उसका जवाब, तारीखों सहित"}]},{"id":"pension","enabled":true,"kind":"ladder","scope":"pension","label":{"en":"Pension problem: NPS or Atal Pension Yojana","hi":"पेंशन की समस्या: NPS या अटल पेंशन योजना"},"shortLabel":{"en":"Pension (NPS, APY)","hi":"पेंशन (NPS, APY)"},"firstContact":{"name":{"en":"Your NPS intermediary or nodal office, such as the Point of Presence where you joined","hi":"आपकी NPS रजिस्टर्ड संस्था या नोडल कार्यालय, जैसे वह पॉइंट ऑफ़ प्रेज़ेंस (POP) जहाँ आप जुड़े थे"},"how":{"en":"Lodge the grievance on PFRDA's Pension Sahayak portal (pensionsahayak.pfrda.org.in). At the first level it is assigned to your intermediary or nodal office to resolve.","hi":"शिकायत PFRDA के पेंशन सहायक पोर्टल (pensionsahayak.pfrda.org.in) पर दर्ज करें। पहले स्तर पर इसे समाधान के लिए आपकी रजिस्टर्ड संस्था या नोडल कार्यालय को सौंपा जाता है।"},"sourceId":"pfrda-grievance"},"ladder":["nps-trust","pfrda-ombudsman"],"evidence":[{"en":"Statement entries for the problem, with all but the last four digits of your PRAN covered","hi":"समस्या से जुड़ी स्टेटमेंट एंट्री, PRAN के अंतिम चार अंक छोड़कर बाकी छिपाकर"},{"en":"Your grievance number and the replies you received, with dates","hi":"आपका शिकायत नंबर और मिले जवाब, तारीखों सहित"},{"en":"Letters or emails from your employer or intermediary","hi":"आपके नियोक्ता (जहाँ आप नौकरी करते हैं या करते थे) या रजिस्टर्ड संस्था के पत्र या ईमेल"}]},{"id":"unknown","enabled":true,"kind":"abstain","label":{"en":"Not sure, or something else","hi":"पक्का नहीं पता, या कुछ और"},"shortLabel":{"en":"Not sure / something else","hi":"पक्का नहीं पता / कुछ और"},"steps":[{"en":"Find the institution's own complaint option on its official website or app. Do not use numbers or links from a message.","hi":"संस्था की आधिकारिक वेबसाइट या ऐप पर उसका अपना शिकायत विकल्प खोजें। संदेश में दिए नंबर या लिंक का उपयोग न करें।"},{"en":"If you think it is a fraud, or you have lost money, choose \"Possible fraud\" or use Get urgent help (1930).","hi":"यदि आपको धोखाधड़ी लगती है, या पैसे गए हैं, तो \"संभावित धोखाधड़ी\" चुनें या तुरंत मदद (1930) का उपयोग करें।"},{"en":"Each regulator handles its own area: SEBI the securities market, RBI banks and payments, IRDAI insurance, and PFRDA pensions. The official pages below explain each.","hi":"हर नियामक (निगरानी करने वाली सरकारी संस्था) अपना क्षेत्र देखता है: SEBI शेयर बाज़ार और म्यूचुअल फ़ंड, RBI बैंक और भुगतान, IRDAI बीमा, और PFRDA पेंशन। नीचे दिए आधिकारिक पेज हर एक के बारे में बताते हैं।"},{"en":"Keep your evidence and note the dates while you find the right route.","hi":"सही रास्ता खोजते समय सबूत रखें और तारीखें लिख लें।"}],"sourceIds":["scores","rbi-ios-faq","bima-bharosa-faq","pfrda-grievance","cyber"]}],"outcomes":[{"id":"fraud-urgent","title":{"en":"Act promptly: report suspected financial fraud","hi":"तुरंत कदम उठाएँ: पैसों की धोखाधड़ी का शक हो तो रिपोर्ट करें"},"steps":[{"en":"Contact your bank or payment provider immediately using its official number.","hi":"आधिकारिक नंबर पर तुरंत अपने बैंक या भुगतान सेवा से संपर्क करें।"},{"en":"Call 1930 and report at the National Cyber Crime Reporting Portal. Follow their instructions.","hi":"1930 पर कॉल करें और राष्ट्रीय साइबर अपराध पोर्टल पर रिपोर्ट करें। उनके निर्देश मानें।"},{"en":"Keep transaction references and messages. Do not pay a “recovery fee”. Recovery is not guaranteed.","hi":"लेन-देन के रेफ़रेंस नंबर और संदेश सँभालकर रखें। कोई “रिकवरी फ़ीस” न दें। पैसा वापस मिलने की गारंटी नहीं है।"}],"helplineId":"cyber-1930","link":{"sourceId":"cyber","label":{"en":"Open official cybercrime portal","hi":"आधिकारिक साइबर अपराध पोर्टल खोलें"}}},{"id":"fraud-pause","title":{"en":"Pause before sending anything","hi":"कुछ भी भेजने से पहले रुकें"},"steps":[{"en":"Do not send money or share credentials until you independently verify the offer.","hi":"जब तक आप खुद प्रस्ताव की जाँच न कर लें, तब तक न पैसे भेजें, न OTP, PIN या पासवर्ड बताएँ।"},{"en":"Use official institution contact details, not links or numbers supplied in the message.","hi":"संस्था के आधिकारिक संपर्क का ही इस्तेमाल करें, संदेश में दिए लिंक या नंबर का नहीं।"},{"en":"If you suspect a cybercrime, use the official portal for reporting guidance.","hi":"साइबर अपराध का संदेह हो तो रिपोर्टिंग के लिए आधिकारिक पोर्टल देखें।"}],"link":{"sourceId":"cyber","label":{"en":"Open official cybercrime portal","hi":"आधिकारिक साइबर अपराध पोर्टल खोलें"}}}]},"rights":{"schemaVersion":1,"cards":[{"id":"fraud-evidence","enabled":true,"issueIds":["fraud"],"text":{"en":"Save evidence before blocking a suspicious contact. Report promptly after financial loss. A recovery promise is not a guarantee.","hi":"संदिग्ध संपर्क ब्लॉक करने से पहले सबूत रखें। पैसों का नुकसान हो तो जल्दी रिपोर्ट करें। पैसा वापस दिलाने का वादा, गारंटी नहीं है।"},"sourceId":"cyber"},{"id":"broker-review","enabled":true,"issueIds":["broker","company","mutual-fund","transmission"],"text":{"en":"You can raise an eligible grievance and seek a review through the applicable official process. Keep acknowledgements. Check current SCORES instructions for eligibility and review time limits; do not wait for this prototype to remind you.","hi":"जो शिकायत नियमों के दायरे में आती है, वह आप दर्ज कर सकते हैं, और तय आधिकारिक प्रक्रिया से उस पर दोबारा जाँच (समीक्षा) माँग सकते हैं। पावती सँभालकर रखें। कौन-सी शिकायत ली जाती है और समय-सीमा क्या है, यह SCORES के ताज़ा निर्देशों में देखें; इस प्रोटोटाइप के याद दिलाने का इंतज़ार न करें।"},"sourceId":"scores"},{"id":"family-entitlement","enabled":true,"issueIds":["unclaimed","transmission"],"text":{"en":"Nomination, ownership and inheritance are different questions. Ask the institution for the applicable requirements in writing; this app does not decide entitlement.","hi":"नॉमिनी होना, मालिकाना हक और विरासत अलग-अलग बातें हैं। संस्था से लागू ज़रूरतें लिखित में लें; यह ऐप हक तय नहीं करता।"},"sourceId":"sebi-rta-faq"},{"id":"nominee-trustee","enabled":true,"issueIds":["transmission"],"text":{"en":"A nominee receives the holdings as a trustee for the legal heirs. Nomination alone does not decide who finally owns them.","hi":"नॉमिनी को होल्डिंग कानूनी वारिसों की ओर से, ट्रस्टी (देखरेख करने वाले) के रूप में मिलती है। सिर्फ़ नॉमिनी बना देने से यह तय नहीं होता कि आखिर में मालिक कौन होगा।"},"sourceId":"sebi-rta-faq"}]},"practice":{"schemaVersion":1,"before":[{"id":"before-ipo-group","enabled":true,"question":{"en":"A group promises certain IPO allotment if you pay immediately. What is the safest next action?","hi":"एक ग्रुप कहता है कि अभी भुगतान करें तो IPO में पक्का आवंटन मिलेगा। सबसे सुरक्षित अगला कदम क्या है?"},"options":[{"en":"Pay a small amount to test it","hi":"थोड़े पैसे भेजकर जाँचें"},{"en":"Pause and verify through official sources","hi":"रुकें और आधिकारिक स्रोत से जाँचें"},{"en":"Trust the group’s profit screenshots","hi":"ग्रुप में दिखाए गए मुनाफ़े के स्क्रीनशॉट पर भरोसा करें"}],"correct":1},{"id":"before-money-sent","enabled":true,"question":{"en":"You sent money and now suspect online financial fraud. What should you do first?","hi":"पैसे भेजने के बाद ऑनलाइन वित्तीय धोखाधड़ी का संदेह है। पहले क्या करें?"},"options":[{"en":"Contact the bank/payment provider and promptly report through 1930/official cybercrime channels","hi":"बैंक या भुगतान सेवा से संपर्क करें और तुरंत 1930 या आधिकारिक साइबर अपराध पोर्टल पर रिपोर्ट करें"},{"en":"Wait for a week","hi":"एक सप्ताह इंतज़ार"},{"en":"Pay the recovery agent","hi":"रिकवरी एजेंट को पैसे दें"}],"correct":0},{"id":"before-no-match","enabled":true,"question":{"en":"The checker finds no warning signs. What does this mean?","hi":"जाँच में कोई खतरे का संकेत नहीं मिला। इसका क्या अर्थ है?"},"options":[{"en":"The offer is verified","hi":"प्रस्ताव जाँचा हुआ और सही है"},{"en":"The government approved it","hi":"सरकार ने स्वीकृति दी"},{"en":"The checker may have missed something; independently verify","hi":"जाँच से कुछ छूट सकता है; खुद जाँच करें"}],"correct":2}],"after":[{"id":"after-chat-adviser","enabled":true,"question":{"en":"A chat adviser promises risk-free profit today. Your next step?","hi":"चैट पर एक सलाहकार आज ही बिना जोखिम मुनाफ़े का वादा करता है। आपका अगला कदम क्या होगा?"},"options":[{"en":"Borrow and pay before the deadline","hi":"समय-सीमा खत्म होने से पहले उधार लेकर भुगतान करें"},{"en":"Forward it as a verified offer","hi":"इसे जाँचा हुआ सही प्रस्ताव बताकर दूसरों को भेजें"},{"en":"Pause and independently verify","hi":"रुकें और खुद जाँच करें"}],"correct":2},{"id":"after-unlock-fee","enabled":true,"question":{"en":"A fake investment app took your payment and asks for more to unlock it. First action?","hi":"नकली निवेश ऐप भुगतान लेकर पैसे निकालने के लिए और रकम माँगता है। पहला कदम?"},"options":[{"en":"Send the unlock fee","hi":"पैसे निकालने की फ़ीस दे दें"},{"en":"Contact your bank/payment provider and report promptly through 1930/official cybercrime channels","hi":"बैंक या भुगतान सेवा से संपर्क करें और तुरंत 1930 या आधिकारिक साइबर अपराध पोर्टल पर रिपोर्ट करें"},{"en":"Delete all evidence","hi":"सभी सबूत मिटाएँ"}],"correct":1},{"id":"after-zero-matches","enabled":true,"question":{"en":"An unfamiliar message gets zero matches. Is it safe to transfer money?","hi":"एक अनजान संदेश में खतरे का कोई संकेत नहीं मिला। क्या अब पैसे भेजना सुरक्षित है?"},"options":[{"en":"No result proves safety; verify independently","hi":"कोई भी जाँच-परिणाम सुरक्षा साबित नहीं करता; खुद जाँच करें"},{"en":"Yes, zero means safe","hi":"हाँ, कोई संकेत नहीं मिला तो सुरक्षित है"},{"en":"Yes, if the group is large","hi":"हाँ, यदि समूह बड़ा है"}],"correct":0}],"lesson":[{"title":{"en":"Pause before paying","hi":"भुगतान से पहले रुकें"},"text":{"en":"Treat certainty and urgency as reasons to verify, not reasons to hurry.","hi":"पक्के मुनाफ़े का वादा या जल्दी करने का दबाव दिखे तो जल्दबाज़ी नहीं, जाँच करें।"}},{"title":{"en":"Act quickly after suspected loss","hi":"धोखे से नुकसान का शक हो तो तुरंत कदम उठाएँ"},"text":{"en":"Contact your bank/payment provider and report promptly via 1930 and the official portal.","hi":"बैंक/भुगतान सेवा से संपर्क करें और जल्द 1930 व आधिकारिक पोर्टल पर रिपोर्ट करें।"}},{"title":{"en":"No match is not a safety certificate","hi":"संकेत न मिलना सुरक्षा प्रमाण नहीं"},"text":{"en":"A limited checker cannot establish legitimacy. Verify independently.","hi":"यह सीमित जाँच यह साबित नहीं कर सकती कि प्रस्ताव असली है। खुद जाँच करें।"}}],"habit":{"title":{"en":"SEVEN-DAY SAFETY PRACTICE","hi":"सात दिन का सुरक्षा अभ्यास"},"intro":{"en":"Use with fictional examples; never enter financial credentials.","hi":"काल्पनिक उदाहरण लें; वित्तीय गोपनीय जानकारी न डालें।"},"days":[{"en":"Practise pausing before a payment.","hi":"भुगतान से पहले रुकने का अभ्यास।"},{"en":"Find an institution’s official contact independently.","hi":"संस्था का आधिकारिक संपर्क स्वतंत्र रूप से खोजें।"},{"en":"Explain why guaranteed returns are a warning.","hi":"समझाएँ कि पक्के लाभ का वादा चेतावनी क्यों है।"},{"en":"Save the official cybercrime portal and remember 1930.","hi":"आधिकारिक साइबर अपराध पोर्टल और 1930 याद रखें।"},{"en":"Practise writing a factual complaint.","hi":"तथ्यों पर आधारित शिकायत लिखने का अभ्यास।"},{"en":"Explain to a family member why no checker can certify safety.","hi":"परिवार को समझाएँ कि कोई जाँच सुरक्षा प्रमाण नहीं देती।"},{"en":"Repeat the practice exercise and note what you still find confusing.","hi":"अभ्यास दोहराएँ और बची हुई उलझन लिखें।"}],"footer":{"en":"This card makes no claim about actual behaviour change.","hi":"यह कार्ड वास्तविक व्यवहार बदलने का दावा नहीं करता।"}}},"emergency":{"schemaVersion":1,"eyebrow":{"en":"Act first. Learn later.","hi":"पहले बचाव, फिर जानकारी।"},"title":{"en":"What happened? Get your safety steps","hi":"क्या हुआ? अपने सुरक्षा कदम जानें"},"intro":{"en":"Answer a few quick questions and follow the steps in order. This app never asks for your OTP, PIN, password or card number.","hi":"कुछ छोटे सवालों के जवाब दें और कदम क्रम से उठाएँ। यह ऐप कभी आपका OTP, PIN, पासवर्ड या कार्ड नंबर नहीं माँगता।"},"callNow":{"helplineId":"cyber-1930","label":{"en":"Call 1930 now","hi":"अभी 1930 पर कॉल करें"},"note":{"en":"Sent money because of a suspicious message or call? Call the cyber crime helpline 1930 first, then come back to these steps.","hi":"संदिग्ध संदेश या कॉल के कारण पैसे भेजे? पहले साइबर अपराध हेल्पलाइन 1930 पर कॉल करें, फिर इन कदमों पर लौटें।"}},"situationsQuestion":{"en":"1. What happened? Choose all that apply.","hi":"1. क्या हुआ? जो भी लागू हो, सब चुनें।"},"situations":[{"id":"received","label":{"en":"I only received a message or call","hi":"मुझे केवल संदेश या कॉल आया"}},{"id":"clicked","label":{"en":"I clicked a link or installed an app","hi":"मैंने लिंक खोला या ऐप इंस्टॉल किया"}},{"id":"shared","label":{"en":"I shared an OTP, PIN, password or screen access","hi":"मैंने OTP, PIN या पासवर्ड बताया, या किसी को अपनी स्क्रीन दिखाई या
