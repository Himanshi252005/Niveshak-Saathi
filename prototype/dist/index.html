,{"id":"no","label":{"en":"No","hi":"नहीं"}},{"id":"unsure","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"channelQuestion":{"en":"3. How did you pay?","hi":"3. आपने भुगतान कैसे किया?"},"channelOptions":[{"id":"upi","label":{"en":"UPI","hi":"UPI (यूपीआई)"}},{"id":"card","label":{"en":"Debit or credit card","hi":"डेबिट या क्रेडिट कार्ड"}},{"id":"bank","label":{"en":"Bank transfer or net banking","hi":"बैंक ट्रांसफ़र या नेट बैंकिंग"}},{"id":"wallet","label":{"en":"Wallet or prepaid card","hi":"वॉलेट या प्रीपेड कार्ड"}},{"id":"cash","label":{"en":"Cash or something else","hi":"नकद या कुछ और"}},{"id":"unsure","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"whenQuestion":{"en":"4. When did you pay?","hi":"4. आपने भुगतान कब किया?"},"whenOptions":[{"id":"today","label":{"en":"Today","hi":"आज"}},{"id":"earlier","label":{"en":"Before today","hi":"आज से पहले"}},{"id":"unsure","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"recentNote":{"en":"Act on these steps straight away. Prompt reporting to 1930 can help freeze the money where possible. Recovery is still not guaranteed.","hi":"ये कदम तुरंत उठाएँ। 1930 पर जल्दी रिपोर्ट करने से, जहाँ संभव हो, पैसे पर रोक लग सकती है। फिर भी पैसा वापस मिलने की गारंटी नहीं है।"},"recentSourceId":"pib-1930","showPlan":{"en":"Show my safety steps","hi":"मेरे सुरक्षा कदम दिखाएँ"},"chooseFirst":{"en":"Choose at least one option in question 1.","hi":"प्रश्न 1 में कम से कम एक विकल्प चुनें।"},"planTitle":{"en":"Do these now, in order","hi":"ये कदम अभी, इसी क्रम में उठाएँ"},"generalLabel":{"en":"General safety step: confirm the details with your bank or the helpline.","hi":"सामान्य सुरक्षा कदम: विवरण अपने बैंक या हेल्पलाइन से पक्का करें।"},"recoveryNote":{"en":"Recovery is not guaranteed. No genuine authority asks for a fee to return your money.","hi":"पैसा वापस मिलने की गारंटी नहीं है। कोई भी असली सरकारी विभाग या संस्था पैसे लौटाने के लिए फ़ीस नहीं माँगती।"},"save":{"en":"Save my safety steps","hi":"मेरे सुरक्षा कदम सहेजें"},"saveHeader":{"en":"MY SAFETY STEPS — not an official complaint","hi":"मेरे सुरक्षा कदम — आधिकारिक शिकायत नहीं"},"nextRoute":{"en":"Find the official complaint route","hi":"आधिकारिक शिकायत का रास्ता देखें"},"nextDraft":{"en":"Prepare my complaint","hi":"मेरी शिकायत तैयार करें"},"checkEntry":{"en":"Already replied, paid or shared details? Get safety steps","hi":"जवाब दिया, भुगतान किया या जानकारी दे दी? सुरक्षा कदम देखें"},"actions":[{"id":"stop-contact","when":["ongoing"],"text":{"en":"Stop now: end the call or screen sharing, do not reply, and do not send any more money or codes.","hi":"अभी रुकें: कॉल या स्क्रीन शेयरिंग बंद करें, जवाब न दें, और कोई और पैसा या कोड न भेजें।"},"sourceId":"i4c-digital-arrest"},{"id":"call-bank","when":["paid","shared"],"text":{"en":"Contact your bank or payment provider immediately, using the number on your card, passbook or official app. Ask them to block further debits and record your complaint.","hi":"तुरंत अपने बैंक या भुगतान सेवा से संपर्क करें; नंबर अपने कार्ड, पासबुक या आधिकारिक ऐप से लें। खाते से आगे पैसा कटना रोकने और शिकायत दर्ज करने को कहें।"},"sourceId":"rbi-liability"},{"id":"block-card","when":["card"],"text":{"en":"Paid by card? Ask your bank to block the card straight away, using the number on the back of the card or the bank's official app.","hi":"कार्ड से भुगतान किया? तुरंत बैंक से कार्ड ब्लॉक करवाएँ: कार्ड के पीछे लिखे नंबर पर कॉल करें या बैंक का आधिकारिक ऐप इस्तेमाल करें।"},"general":true},{"id":"report-1930","when":["paid"],"helplineId":"cyber-1930","text":{"en":"Call 1930 or report at the National Cyber Crime Reporting Portal as quickly as possible. Write down the acknowledgement number.","hi":"जितनी जल्दी हो सके 1930 पर कॉल करें या राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल पर रिपोर्ट करें। पावती नंबर लिख लें।"},"sourceId":"cyber"},{"id":"upi-app","when":["upi"],"text":{"en":"Paid by UPI? Report it to your bank as a fraudulent payment straight away. The UPI Help option in payment apps asks you to contact your bank about fraudulent transactions, and it does not take complaints about completed person-to-person payments.","hi":"UPI से भुगतान किया? तुरंत अपने बैंक से शिकायत करें और बताएँ कि यह धोखाधड़ी वाला भुगतान है। भुगतान ऐप का UPI Help विकल्प धोखाधड़ी के मामलों में बैंक से संपर्क करने को कहता है। किसी व्यक्ति को किया गया, पूरा हो चुका भुगतान हो, तो UPI Help उसकी शिकायत नहीं लेता।"},"sourceId":"npci-upi-help"},{"id":"wallet-provider","when":["wallet"],"text":{"en":"Paid from a wallet or prepaid card? Report the payment to the wallet provider through its official app.","hi":"वॉलेट या प्रीपेड कार्ड से भुगतान किया? वॉलेट सेवा के आधिकारिक ऐप से भुगतान की शिकायत करें।"},"general":true},{"id":"secure-credentials","when":["shared"],"text":{"en":"First uninstall any screen-sharing or remote-access app you were asked to install, such as AnyDesk. Then, from your own phone, change the UPI PIN and passwords you shared, using only the official bank or UPI app.","hi":"पहले वह स्क्रीन-शेयरिंग या रिमोट-एक्सेस ऐप (जैसे AnyDesk) हटाएँ, जिसे इंस्टॉल करने को आपसे कहा गया था। फिर अपने ही फ़ोन से, केवल बैंक या UPI के आधिकारिक ऐप में, वे UPI PIN और पासवर्ड बदलें जो आपने किसी को बताए थे।"},"general":true},{"id":"remove-app","when":["clicked"],"text":{"en":"Uninstall any app you installed from a message link, and do not enter details on that link again. Use only apps verified through official exchange or SEBI resources.","hi":"संदेश के लिंक से इंस्टॉल किया गया ऐप हटाएँ और उस लिंक पर दोबारा जानकारी न डालें। केवल वही ऐप इस्तेमाल करें जिनकी जाँच आपने स्टॉक एक्सचेंज या SEBI की आधिकारिक वेबसाइट पर की हो।"},"sourceId":"apps"},{"id":"check-accounts","when":["clicked"],"text":{"en":"Check your bank and UPI app for payments you do not recognise, and report any to your bank immediately.","hi":"अपने बैंक और UPI ऐप में देखें कि कोई ऐसा भुगतान तो नहीं हुआ जो आपने नहीं किया। ऐसा कोई भुगतान दिखे तो तुरंत बैंक को बताएँ।"},"general":true,"unless":["shared"]},{"id":"freeze-trading","when":["shared"],"text":{"en":"Check your bank, UPI and trading apps for payments or trades you did not make, and report any to your bank or broker at once. If you shared a trading app login, password or OTP, ask your stock broker to freeze online access to your trading account (every broker must offer this), and your DP to freeze your demat account.","hi":"अपने बैंक, UPI और ट्रेडिंग ऐप में ऐसे भुगतान या सौदे देखें जो आपने नहीं किए, और कोई दिखे तो तुरंत अपने बैंक या ब्रोकर को बताएँ। अगर आपने ट्रेडिंग ऐप का लॉगिन, पासवर्ड या OTP बताया है, तो अपने स्टॉक ब्रोकर से ट्रेडिंग खाते का ऑनलाइन एक्सेस फ़्रीज़ करवाएँ (हर ब्रोकर को यह सुविधा देनी होती है), और अपने DP से डीमैट खाता फ़्रीज़ करवाएँ।"},"sourceId":"sebi-trading-freeze-2024"},{"id":"no-recovery-fee","when":["paid"],"text":{"en":"Do not pay any “recovery”, “tax” or “release” fee to get your money back.","hi":"पैसे वापस पाने के लिए कोई “रिकवरी”, “टैक्स” या “रिलीज़” फ़ीस न दें।"},"sourceId":"apps"},{"id":"do-not-engage","when":["received"],"text":{"en":"Do not reply, click links or pay. If the message claims to be from an institution, contact that institution through its official website or app, not the number in the message.","hi":"जवाब न दें, लिंक न खोलें और भुगतान न करें। संदेश किसी संस्था के नाम से हो तो उस संस्था से उसकी आधिकारिक वेबसाइट या ऐप से संपर्क करें, संदेश में दिए नंबर से नहीं।"},"sourceId":"i4c-digital-arrest"},{"id":"report-suspicion","when":["received","clicked","shared"],"unless":["paid"],"text":{"en":"If you suspect a cybercrime, use the official National Cyber Crime Reporting Portal for reporting guidance.","hi":"साइबर अपराध का संदेह हो तो रिपोर्टिंग के लिए आधिकारिक राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल देखें।"},"sourceId":"cyber"},{"id":"report-chakshu","when":["received","clicked"],"unless":["paid"],"text":{"en":"Report the suspected fraud call, SMS or WhatsApp message on Chakshu (Sanchar Saathi) within 30 days, if the sender's number is visible. If money was lost, report to 1930 instead.","hi":"संदिग्ध धोखाधड़ी कॉल, SMS या व्हाट्सऐप संदेश की रिपोर्ट 30 दिन के अंदर चक्षु (संचार साथी) पर करें, अगर भेजने वाले का नंबर दिख रहा हो। पैसे गए हों तो इसके बजाय 1930 पर रिपोर्ट करें।"},"sourceId":"chakshu"},{"id":"keep-evidence","when":["any"],"text":{"en":"Keep evidence: screenshots of messages, the sender's number or ID, and any transaction reference. Do not delete the chat.","hi":"सबूत रखें: संदेशों के स्क्रीनशॉट, भेजने वाले का नंबर या आईडी, और लेन-देन का UTR/रेफ़रेंस नंबर। चैट न मिटाएँ।"},"sourceId":"cyber"}]},"packet":{"schemaVersion":1,"intro":{"en":"Build a private Action Packet: the facts, dates, evidence and official route in one file that you submit yourself. Nothing is uploaded or submitted by this app.","hi":"अपना निजी शिकायत पैकेट (एक्शन पैकेट) बनाएँ: तथ्य, तारीखें, सबूत और आधिकारिक रास्ता एक ही फ़ाइल में, जिसे आप खुद जमा करें। यह ऐप कुछ भी अपलोड या जमा नहीं करता।"},"routeLabel":{"en":"Official route chosen in ‘Where to complain’:","hi":"‘कहाँ शिकायत करें’ में चुना गया आधिकारिक रास्ता:"},"routeChange":{"en":"Change the route in ‘Where to complain’","hi":"‘कहाँ शिकायत करें’ में रास्ता बदलें"},"fields":{"entity":{"label":{"en":"Which institution or person is it about?","hi":"यह किस संस्था या व्यक्ति के बारे में है?"},"why":{"en":"A complaint must name who it is about.","hi":"शिकायत में बताना ज़रूरी है कि वह किसके बारे में है।"}},"when":{"label":{"en":"When did it happen? Month and year are enough.","hi":"यह कब हुआ? महीना और साल काफ़ी हैं।"},"why":{"en":"Dates help the institution find your case, and official complaint systems have time limits.","hi":"तारीखों से संस्था को आपका मामला ढूँढने में मदद मिलती है, और आधिकारिक शिकायत प्रणालियों की समय-सीमा होती है।"}},"complainedOn":{"label":{"en":"When did you first complain to them? (optional)","hi":"आपने उनसे पहली बार कब शिकायत की? (ज़रूरी नहीं)"},"why":{"en":"Escalation levels ask for the date of your earlier complaint.","hi":"आगे की शिकायत में पिछली शिकायत की तारीख पूछी जाती है।"}},"amount":{"label":{"en":"Amount involved (optional)","hi":"कितनी रकम का मामला है? (ज़रूरी नहीं)"},"why":{"en":"Helps describe the loss. Leave it blank if you prefer.","hi":"नुकसान बताने में मदद करती है। चाहें तो खाली छोड़ दें।"}},"ref":{"label":{"en":"Last 4 characters of a transaction or complaint reference (optional)","hi":"लेन-देन या शिकायत के रेफ़रेंस नंबर के अंतिम 4 अंक या अक्षर (ज़रूरी नहीं)"},"why":{"en":"Only the last 4. Never type a full account, card or reference number here.","hi":"केवल अंतिम 4। यहाँ कभी पूरा खाता, कार्ड या रेफ़रेंस नंबर न लिखें।"}}},"actionsTitle":{"en":"What have you already done?","hi":"आप अब तक क्या कर चुके हैं?"},"actions":[{"id":"complained","label":{"en":"I complained to the institution","hi":"मैंने संस्था से शिकायत की"}},{"id":"number","label":{"en":"I have a complaint or acknowledgement number","hi":"मेरे पास शिकायत या पावती नंबर है"}},{"id":"reported-1930","label":{"en":"I reported it on 1930 or the cybercrime portal","hi":"मैंने 1930 या साइबर अपराध पोर्टल पर रिपोर्ट की"}},{"id":"told-bank","label":{"en":"I told my bank or payment provider","hi":"मैंने अपने बैंक या भुगतान सेवा को बताया"}},{"id":"escalated","label":{"en":"I filed on an official portal such as SCORES, RBI CMS or Bima Bharosa","hi":"मैंने SCORES, RBI CMS (RBI लोकपाल का शिकायत पोर्टल) या बीमा भरोसा जैसे आधिकारिक पोर्टल पर शिकायत की"}}],"evidenceTitle":{"en":"Which evidence do you have?","hi":"आपके पास कौन-से सबूत हैं?"},"evidence":[{"id":"messages","label":{"en":"Screenshots of messages or chats","hi":"संदेशों या चैट के स्क्रीनशॉट"}},{"id":"payments","label":{"en":"Payment receipts or transaction references","hi":"भुगतान रसीदें या लेन-देन के रेफ़रेंस नंबर"}},{"id":"statements","label":{"en":"Statement entries, with numbers covered except the last four digits","hi":"स्टेटमेंट की एंट्री, अंतिम चार अंक छोड़कर नंबर छिपाकर"}},{"id":"letters","label":{"en":"Emails or letters exchanged with the institution","hi":"संस्था को भेजे या उससे मिले ईमेल या पत्र"}},{"id":"reply","label":{"en":"The institution's reply","hi":"संस्था का जवाब"}},{"id":"documents","label":{"en":"Policy, contract notes or other documents","hi":"पॉलिसी, कॉन्ट्रैक्ट नोट या अन्य दस्तावेज़"}}],"doNotInclude":{"text":{"en":"Never include OTPs, PINs, passwords or CVV: banks and payment system operators never ask for them. In this packet, show only the last four digits of account and card numbers; give full numbers only in the official complaint form if it asks for them.","hi":"OTP, PIN, पासवर्ड या CVV कभी शामिल न करें: बैंक और भुगतान सेवाएँ इन्हें कभी नहीं माँगतीं। इस पैकेट में खाता और कार्ड नंबर के केवल अंतिम चार अंक दिखाएँ; पूरे नंबर केवल आधिकारिक शिकायत फ़ॉर्म में दें, अगर वह माँगे।"},"sourceId":"rbi-never-ask"},"packetHeader":{"en":"MY ACTION PACKET: prepared by me and NOT submitted. I will submit it myself through the official channel.","hi":"मेरा शिकायत पैकेट: इसे मैंने खुद तैयार किया है और यह अभी जमा नहीं हुआ है। इसे मुझे खुद आधिकारिक माध्यम से जमा करना है।"},"contactLine":{"en":"[Name and contact details: add them only in the official complaint form]","hi":"[नाम और संपर्क विवरण: केवल आधिकारिक शिकायत फ़ॉर्म में जोड़ें]"},"ackLine":{"en":"Acknowledgement number: ____________   Date: ____________","hi":"पावती नंबर: ____________   तारीख: ____________"},"generate":{"en":"Create my Action Packet","hi":"मेरा शिकायत पैकेट बनाएँ"},"checksTitle":{"en":"Packet check","hi":"पैकेट की जाँच"},"essentialsReady":{"en":"Complaint essentials ready:","hi":"शिकायत की ज़रूरी बातें तैयार:"},"essentials":[{"id":"entity","label":{"en":"Who it is about","hi":"यह किसके बारे में है"}},{"id":"when","label":{"en":"When it happened","hi":"यह कब हुआ"}},{"id":"summary","label":{"en":"What happened, in a few sentences","hi":"क्या हुआ, कुछ वाक्यों में"}},{"id":"resolution","label":{"en":"The resolution you want","hi":"आप क्या समाधान चाहते हैं"}},{"id":"evidence","label":{"en":"At least one piece of evidence","hi":"कम से कम एक सबूत"}},{"id":"number","label":{"en":"Your earlier complaint number and date, if you complained before","hi":"पहले शिकायत की है तो उसका नंबर और तारीख"},"sourceId":"rbi-ios-faq"}],"privacyFound":{"en":"Private details found in the packet:","hi":"पैकेट में निजी जानकारी मिली:"},"privacyNone":{"en":"No common private details found. Read the text yourself too.","hi":"आम निजी जानकारी नहीं मिली। फिर भी पूरा पैकेट खुद पढ़ लें।"},"secretsBlock":{"en":"Remove OTPs, PINs, passwords, CVV and full card numbers before saving: press \"Mask these details\" above.","hi":"सहेजने से पहले OTP, PIN, पासवर्ड, CVV और पूरे कार्ड नंबर हटाएँ: ऊपर \"यह जानकारी छिपाएँ\" दबाएँ।"},"reviewLabel":{"en":"Read and edit your packet","hi":"अपना पैकेट पढ़ें और ज़रूरत हो तो बदलें"},"maskButton":{"en":"Mask these details","hi":"यह जानकारी छिपाएँ"},"reviewConfirm":{"en":"I have read the packet and removed anything private.","hi":"मैंने पैकेट पढ़ लिया है और निजी जानकारी हटा दी है।"},"download":{"en":"Download my packet","hi":"मेरा पैकेट डाउनलोड करें"},"print":{"en":"Print my packet","hi":"मेरा पैकेट प्रिंट करें"},"saveNote":{"en":"The packet stays on your device. Submit it yourself through the official channel, and write the acknowledgement number on it.","hi":"पैकेट आपके फ़ोन या कंप्यूटर में ही रहता है। इसे खुद आधिकारिक माध्यम से जमा करें, और उस पर पावती नंबर लिखें।"}},"family":{"schemaVersion":1,"tabLabel":{"en":"Family safety","hi":"परिवार की सुरक्षा"},"eyebrow":{"en":"Ready before it is needed","hi":"ज़रूरत से पहले तैयारी"},"title":{"en":"Family safety and nominee readiness","hi":"परिवार की सुरक्षा और नॉमिनी की तैयारी"},"intro":{"en":"A short checklist for the family's investments. It never asks for values, account numbers, passwords, documents or relatives' details, and your ticks stay only in this page.","hi":"परिवार के निवेश के लिए एक छोटी सूची। यह कभी राशि, खाता नंबर, पासवर्ड, दस्तावेज़ या रिश्तेदारों की जानकारी नहीं माँगती, और आपके चुने विकल्प केवल इसी पेज में रहते हैं।"},"holdingsQuestion":{"en":"1. What does the family hold? Choose all that apply.","hi":"1. परिवार के पास क्या है? जो भी लागू हो, सब चुनें।"},"holdings":[{"id":"demat","label":{"en":"Shares in a demat account","hi":"डीमैट खाते में शेयर"}},{"id":"mf","label":{"en":"Mutual funds","hi":"म्यूचुअल फ़ंड"}},{"id":"physical","label":{"en":"Paper (physical) share certificates","hi":"कागज़ी (भौतिक) शेयर प्रमाणपत्र"}},{"id":"unknown","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"nomineeQuestion":{"en":"2. Have you checked the nominees recently?","hi":"2. क्या आपने हाल में नॉमिनी की जानकारी जाँची है?"},"nomineeOptions":[{"id":"checked","label":{"en":"Yes, checked","hi":"हाँ, जाँचा है"}},{"id":"not-checked","label":{"en":"No","hi":"नहीं"}},{"id":"unknown","label":{"en":"Not sure","hi":"पक्का नहीं पता"}}],"showList":{"en":"Show our family checklist","hi":"हमारे परिवार की जाँच-सूची दिखाएँ"},"chooseFirst":{"en":"Choose at least one option in question 1.","hi":"प्रश्न 1 में कम से कम एक विकल्प चुनें।"},"listTitle":{"en":"Our family checklist","hi":"हमारे परिवार की जाँच-सूची"},"firstTag":{"en":"Do this first","hi":"पहले यह करें"},"doneLabel":{"en":"Done","hi":"हो गया"},"generalLabel":{"en":"General safety step (not from a single official page).","hi":"सामान्य सुरक्षा कदम (किसी एक आधिकारिक पेज से नहीं)।"},"cardTitle":{"en":"OUR FAMILY ACTION CARD","hi":"हमारे परिवार के अगले कदम"},"cardWarning":{"en":"Do not write passwords, PINs, OTPs, account numbers or document numbers on this card.","hi":"इस कार्ड पर पासवर्ड, PIN, OTP, खाता नंबर या दस्तावेज़ नंबर न लिखें।"},"cardBlank":{"en":"Where our statements and certificates are kept: ______________________","hi":"हमारे स्टेटमेंट और प्रमाणपत्र कहाँ रखे हैं: ______________________"},"download":{"en":"Download our family card","hi":"परिवार के अगले कदमों का कार्ड डाउनलोड करें"},"print":{"en":"Print our family card","hi":"परिवार के अगले कदमों का कार्ड प्रिंट करें"},"items":[{"id":"nominee","when":["demat","mf"],"text":{"en":"Check that each demat account and mutual fund folio has a nominee, or that your decision not to add one (opt-out) is recorded. You can add or change a nominee with your depository participant (DP), the fund or its registrar, online or on paper.","hi":"जाँचें कि हर डीमैट खाते और म्यूचुअल फ़ंड फ़ोलियो में नॉमिनी है, या नॉमिनी न रखने (ऑप्ट-आउट) का फ़ैसला दर्ज है। नॉमिनी आप अपने DP (डिपॉज़िटरी पार्टिसिपेंट, जहाँ डीमैट खाता है), फ़ंड या उसके रजिस्ट्रार के पास, ऑनलाइन या फ़ॉर्म भरकर, जोड़ या बदल सकते हैं।"},"sourceId":"sebi-nomination-2026"},{"id":"no-freeze","when":["demat","mf"],"text":{"en":"SEBI's 2026 nomination rules ask DPs and fund registrars to send reminders twice a year to accounts and folios without a nominee. The rules do not provide for freezing them. A message that threatens freezing and asks for payment is a warning sign.","hi":"SEBI के 2026 के नॉमिनी नियमों के अनुसार, जिन डीमैट खातों और फ़ोलियो में नॉमिनी नहीं है, उनके धारकों को DP और फ़ंड के रजिस्ट्रार साल में दो बार याद दिलाने वाले संदेश भेजते हैं। इन नियमों में ऐसे खातों को फ़्रीज़ (बंद) करने की कोई बात नहीं है। फ़्रीज़ करने की धमकी देकर भुगतान माँगने वाला संदेश खतरे का संकेत है।"},"sourceId":"sebi-nomination-2026"},{"id":"contact-kyc","when":["demat"],"text":{"en":"Keep your mobile number, email and address up to date with your broker or depository participant (DP), and tell them whenever these change.","hi":"अपने ब्रोकर या DP (डिपॉज़िटरी पार्टिसिपेंट) के पास अपना मोबाइल नंबर, ईमेल और पता सही (अपडेट) रखें, और इनमें बदलाव होने पर उन्हें बताएँ।"},"sourceId":"sebi-dos-donts"},{"id":"records","when":["any"],"text":{"en":"Make sure a trusted family member knows where statements, certificates and policy papers are kept. Never share or write down passwords, PINs or OTPs.","hi":"पक्का करें कि परिवार का कोई भरोसेमंद सदस्य जानता हो कि स्टेटमेंट, प्रमाणपत्र और पॉलिसी के कागज़ कहाँ रखे हैं। पासवर्ड, PIN या OTP कभी किसी को न बताएँ, न कहीं लिखें।"},"general":true},{"id":"physical-demat","when":["physical"],"text":{"en":"Paper share certificates must be converted to demat form before they can be sold or transferred. You need a demat account for this.","hi":"कागज़ी शेयर प्रमाणपत्रों को बेचने या ट्रांसफ़र करने से पहले डीमैट रूप में बदलवाना होता है। इसके लिए डीमैट खाता चाहिए।"},"sourceId":"sebi-physical-faq"},{"id":"physical-drf","when":["physical"],"text":{"en":"To convert them, submit the certificates with a Demat Request Form (DRF) to your depository participant (DP), where your demat account is.","hi":"बदलवाने के लिए प्रमाणपत्र, डीमैट अनुरोध फ़ॉर्म (DRF) के साथ, अपने DP (डिपॉज़िटरी पार्टिसिपेंट, जहाँ डीमैट खाता है) को जमा करें।"},"sourceId":"sebi-depository-faq"},{"id":"contact-kyc-physical","when":["physical"],"text":{"en":"For paper share certificates, ask the company or its registrar (RTA) to update your address and contact details.","hi":"कागज़ी शेयर प्रमाणपत्रों के लिए, अपना पता और संपर्क विवरण अपडेट करने को कंपनी या उसके रजिस्ट्रार (RTA) से कहें।"},"sourceId":"sebi-rta-faq"},{"id":"physical-window","when":["physical"],"text":{"en":"SEBI opened a special window from 5 February 2026 to 4 February 2027 for some old physical transfer requests. Ask the registrar whether it applies to you.","hi":"SEBI ने कुछ पुराने कागज़ी शेयर ट्रांसफ़र अनुरोधों के लिए 5 फ़रवरी 2026 से 4 फ़रवरी 2027 तक विशेष अवधि खोली है। रजिस्ट्रार से पूछें कि क्या यह आप पर लागू है।"},"sourceId":"sebi-relodgement-2026"},{"id":"old-holdings","when":["physical","demat","unknown"],"text":{"en":"Unclaimed dividends move to the IEPF after seven years, and the shares follow if dividends stay unclaimed for seven years in a row. Check old holdings with the company or its registrar, or choose \"Old shares or unclaimed dividends\" in ‘Where to complain’.","hi":"बिना दावे वाला लाभांश (डिविडेंड) सात साल बाद IEPF में चला जाता है, और लगातार सात साल लाभांश न लेने पर शेयर भी चले जाते हैं। अपनी पुरानी होल्डिंग के बारे में कंपनी या उसके रजिस्ट्रार से पूछें, या ‘कहाँ शिकायत करें’ में \"पुराने शेयर या बिना दावे वाला लाभांश\" चुनें।"},"sourceId":"sebi-rta-faq"},{"id":"trace-unclaimed","when":["any"],"text":{"en":"Old money the family may have forgotten can be traced: RBI's UDGAM portal for bank deposits, SEBI's MITRA platform for mutual funds and IRDAI's Bima Bharosa for insurance.","hi":"परिवार का भूला हुआ पुराना पैसा खोजा जा सकता है: बैंक जमा के लिए RBI का उद्गम (UDGAM) पोर्टल, म्यूचुअल फ़ंड के लिए SEBI का मित्र (MITRA) प्लेटफ़ॉर्म और बीमा के लिए IRDAI का बीमा भरोसा।"},"sourceId":"pib-unclaimed-2026"},{"id":"cas-statement","when":["demat","mf","unknown"],"text":{"en":"A Consolidated Account Statement (CAS) shows mutual fund and demat transactions in one statement, matched by PAN, which helps the family know what is held. Keep the PAN updated with your DP or broker to receive it.","hi":"समेकित खाता विवरण (CAS) एक ही स्टेटमेंट है, जिसमें PAN के आधार पर म्यूचुअल फ़ंड और डीमैट के सारे लेन-देन दिखते हैं। इससे परिवार को पता चलता है कि कौन-कौन से निवेश हैं। इसे पाने के लिए अपने DP या ब्रोकर के पास PAN अपडेट रखें।"},"sourceId":"sebi-cas"},{"id":"entity-contact","when":["any"],"text":{"en":"Note the official contact of each depository participant, fund house and company registrar, taken from their official websites, not from messages.","hi":"हर DP, फ़ंड हाउस और कंपनी रजिस्ट्रार का आधिकारिक संपर्क उनकी आधिकारिक वेबसाइट से लिखकर रखें, संदेशों से नहीं।"},"general":true},{"id":"no-paid-agents","when":["any"],"text":{"en":"Be careful with unsolicited offers to recover old shares or unclaimed money for a fee. You can claim yourself through the company, its registrar and the official IEPF process.","hi":"पुराने शेयर या बिना दावे वाला पैसा फ़ीस लेकर वापस दिलाने वाले, बिना माँगे आए प्रस्तावों से सावधान रहें। आप खुद कंपनी, उसके रजिस्ट्रार और IEPF की आधिकारिक प्रक्रिया से दावा कर सकते हैं।"},"general":true},{"id":"start-unknown","when":["unknown"],"text":{"en":"Not sure what the family holds? Start with recent statements, dividend letters and emails from companies or funds, then ask each institution in writing.","hi":"पक्का नहीं पता कि परिवार के पास क्या है? हाल के स्टेटमेंट, लाभांश पत्र और कंपनियों या फ़ंड के ईमेल से शुरू करें, फिर हर संस्था से लिखित में पूछें।"},"general":true}]},"profiles":{"schemaVersion":1,"texts":{"eyebrow":{"en":"A plan that starts with your situation","hi":"आपकी स्थिति से शुरू होने वाला प्लान"},"title":{"en":"Choose a safety plan","hi":"अपना सुरक्षा प्लान चुनें"},"intro":{"en":"Choose the example closest to you. We do not ask for your name, account number, holdings or income.","hi":"जो उदाहरण आपसे सबसे ज़्यादा मिलता है उसे चुनें। हम आपका नाम, खाता नंबर, निवेश या आय नहीं पूछते।"},"homeTitle":{"en":"Which situation feels closest to yours?","hi":"कौन-सी स्थिति आपसे सबसे ज़्यादा मिलती है?"},"homeHint":{"en":"Get a short plan without entering personal financial details.","hi":"निजी वित्तीय जानकारी डाले बिना छोटा प्लान पाएँ।"},"planTitle":{"en":"Your first safety plan","hi":"आपका पहला सुरक्षा प्लान"},"watchTitle":{"en":"Watch for these warning signs","hi":"खतरे के इन संकेतों पर ध्यान दें"},"stepsTitle":{"en":"Do these in order","hi":"ये काम इसी क्रम में करें"},"whyTitle":{"en":"Why this plan","hi":"यह प्लान क्यों"},"privacy":{"en":"This choice stays only on this page. It is not an account profile and is not uploaded or saved.","hi":"आपकी यह पसंद केवल इसी पेज पर रहती है। यह कोई खाता प्रोफ़ाइल नहीं है, और यह कहीं अपलोड या सेव नहीं होती।"}},"profiles":[{"id":"praveen","name":{"en":"Praveen, 22","hi":"प्रवीण, 22"},"label":{"en":"New trader or gig worker","hi":"नया ट्रेडर या गिग वर्कर (ऐप के ज़रिए काम करने वाला)"},"short":{"en":"F&O tips on Telegram, borrowed money","hi":"टेलीग्राम पर F&O टिप्स, उधार का पैसा"},"situation":{"en":"Telegram or WhatsApp F&O tips feel convincing, and borrowed money may be involved.","hi":"टेलीग्राम या व्हाट्सऐप पर मिलने वाली F&O (फ़्यूचर्स और ऑप्शंस) टिप्स भरोसेमंद लगती हैं, और इनमें उधार का पैसा भी लगा हो सकता है।"},"firstAction":{"en":"Pause the trade. Do not borrow, and do not add more money.","hi":"ट्रेड रोकें। न उधार लें, न और पैसा लगाएँ।"},"why":{"en":"Urgency, sure-shot tips, private groups and pressure to borrow are warning signs. A registered intermediary still cannot guarantee profit.","hi":"जल्दी करने का दबाव, पक्की टिप, निजी ग्रुप और उधार लेने का दबाव खतरे के संकेत हैं। रजिस्टर्ड संस्था भी मुनाफ़े की गारंटी नहीं दे सकती।"},"watchFor":[{"en":"sure-shot calls, operator tips or guaranteed targets","hi":"पक्की ट्रेडिंग कॉल (खरीदने-बेचने की सलाह), ऑपरेटर (भाव चढ़ाने-गिराने वाले) की टिप या गारंटी वाला टारगेट"},{"en":"requests to join a VIP group or install an unknown trading app","hi":"VIP ग्रुप में जुड़ने या अनजान ट्रेडिंग ऐप लगाने की माँग"},{"en":"pressure to use a loan, credit card, margin or borrowed money","hi":"लोन, क्रेडिट कार्ड, मार्जिन या उधार का पैसा लगाने का दबाव"}],"steps":[{"text":{"en":"Check the message before acting and read every reason shown.","hi":"कुछ करने से पहले संदेश जाँचें और दिखाया गया हर कारण पढ़ें।"},"sourceId":"sebi-social-caution"},{"text":{"en":"Verify the person or firm independently on SEBI's official intermediary register.","hi":"व्यक्ति या संस्था को SEBI में रजिस्टर्ड संस्थाओं की आधिकारिक सूची में खुद जाँचें।"},"sourceId":"sebi-intermediaries"},{"text":{"en":"Use only the broker's official app and payment route; never pay a personal UPI ID from a group.","hi":"केवल ब्रोकर का आधिकारिक ऐप और भुगतान तरीका इस्तेमाल करें; ग्रुप से मिली निजी UPI आईडी पर पैसा न भेजें।"},"sourceId":"apps"},{"text":{"en":"Before any F&O trade, know the odds: SEBI found that 93% of individual traders lost money in equity F&O between FY22 and FY24.","hi":"किसी भी F&O सौदे से पहले जोखिम समझें: SEBI के अध्ययन में वित्त वर्ष 2021-22 से 2023-24 के बीच इक्विटी F&O में 93% व्यक्तिगत ट्रेडरों को घाटा हुआ।"},"sourceId":"sebi-fo-study"}],"actions":[{"target":"check","label":{"en":"Check the tip message","hi":"टिप वाला संदेश जाँचें"}},{"target":"paycheck","label":{"en":"Check before paying","hi":"भुगतान से पहले जाँचें"}}]},{"id":"kavita","name":{"en":"Kavita, 39","hi":"कविता, 39"},"label":{"en":"Family-savings decision maker","hi":"परिवार की बचत के फ़ैसले लेने वाली"},"short":{"en":"Fake IPO or \"guaranteed return\" scheme","hi":"नकली IPO या \"पक्का मुनाफ़ा\" वाली योजना"},"situation":{"en":"A fake IPO, guaranteed-return plan or deposit offer arrives in English or through a social message.","hi":"अंग्रेज़ी में या सोशल मीडिया संदेश से नकली IPO, पक्के रिटर्न वाली योजना या जमा का प्रस्ताव आता है।"},"firstAction":{"en":"Do not transfer money from the message. Read the steps slowly, or press Listen, then check for yourself.","hi":"संदेश से पैसा न भेजें। कदम आराम से पढ़ें या “सुनें” दबाएँ, फिर खुद जाँच करें।"},"why":{"en":"Guaranteed allotment, personal payment IDs and unusually high fixed returns are common fraud patterns. Public issues use the official ASBA process.","hi":"गारंटी वाला आवंटन (अलॉटमेंट), निजी भुगतान आईडी और बहुत ऊँचा पक्का रिटर्न आम धोखाधड़ी के तरीके हैं। पब्लिक इश्यू में आवेदन आधिकारिक ASBA प्रक्रिया से होता है, यानी अपने ही बैंक खाते से।"},"watchFor":[{"en":"guaranteed IPO allotment, pre-IPO quota or a limited slot","hi":"गारंटी वाला IPO आवंटन (अलॉटमेंट), प्री-IPO कोटा या 'सीमित स्लॉट'"},{"en":"payment to a personal UPI ID, QR code or unofficial bank account","hi":"निजी UPI आईडी, QR कोड या गैर-आधिकारिक बैंक खाते में भुगतान"},{"en":"fixed daily or monthly returns and pressure to act today","hi":"रोज़ या हर महीने पक्के मुनाफ़े का वादा, और आज ही पैसा लगाने का दबाव"}],"steps":[{"text":{"en":"Use Before you pay to get a STOP or VERIFY answer before any transfer.","hi":"कोई भी पैसा भेजने से पहले ‘भुगतान से पहले’ वाला हिस्सा खोलें; वह बताएगा: ‘रुकें’ या ‘पहले जाँचें’।"},"sourceId":"sebi-check"},{"text":{"en":"For an IPO, apply only through your own bank or broker's official ASBA route.","hi":"IPO के लिए केवल अपने बैंक या ब्रोकर के आधिकारिक ASBA तरीके से आवेदन करें।"},"sourceId":"sebi-icdr-faq"},{"text":{"en":"For a deposit scheme, use RBI Sachet and official records instead of the sender's link.","hi":"जमा योजना के लिए भेजने वाले के लिंक की जगह RBI सचेत (Sachet) और आधिकारिक रिकॉर्ड देखें।"},"sourceId":"rbi-sachet"},{"text":{"en":"If money has already gone into a chit, committee or Ponzi scheme, give the information to the police or the Economic Offences Wing (EOW) of your state.","hi":"अगर पैसा चिट, कमेटी या पोंज़ी योजना में जा चुका है, तो इसकी जानकारी अपने राज्य की पुलिस या आर्थिक अपराध शाखा (EOW) को दें।"},"sourceId":"rbi-nbfc-faq"}],"actions":[{"target":"paycheck","label":{"en":"Check before paying","hi":"भुगतान से पहले जाँचें"}},{"target":"check","label":{"en":"Check the message","hi":"संदेश जाँचें"}}]},{"id":"babulal","name":{"en":"Babulal, 63","hi":"बाबूलाल, 63"},"label":{"en":"Retired investor with older holdings","hi":"पुराने निवेश वाले रिटायर्ड निवेशक"},"short":{"en":"Old shares, nominee, unclaimed dividends","hi":"पुराने शेयर, नॉमिनी, बिना दावे वाला लाभांश"},"situation":{"en":"Old shares, dormant folios, nominees or unclaimed dividends are difficult to trace and official portals feel confusing.","hi":"पुराने शेयर, बंद पड़े (निष्क्रिय) फ़ोलियो, नॉमिनी या बिना दावे वाला लाभांश ढूँढना मुश्किल है, और आधिकारिक पोर्टल उलझे हुए लगते हैं।"},"firstAction":{"en":"Collect only statements and certificate details, then identify the company, registrar, fund or depository participant before starting a claim.","hi":"केवल स्टेटमेंट और प्रमाणपत्र की जानकारी जुटाएँ, फिर दावा शुरू करने से पहले पता करें कि कंपनी, रजिस्ट्रार, फ़ंड या डिपॉज़िटरी पार्टिसिपेंट (DP) कौन है।"},"why":{"en":"Old holdings follow different official paths. Unsolicited recovery agents may charge fees for steps that investors can start themselves.","hi":"पुराने निवेश के लिए अलग-अलग आधिकारिक रास्ते हैं। अचानक संपर्क करने वाले रिकवरी एजेंट ऐसे काम की फ़ीस माँग सकते हैं जिसे निवेशक खुद शुरू कर सकते हैं।"},"watchFor":[{"en":"a fee to recover shares, dividends or an IEPF claim","hi":"शेयर, लाभांश या IEPF दावा वापस दिलाने की फ़ीस"},{"en":"requests for OTPs, passwords or original documents through messages","hi":"संदेश में OTP, पासवर्ड या मूल दस्तावेज़ माँगना"},{"en":"threats that a folio will be frozen unless money is paid","hi":"पैसा न देने पर फ़ोलियो फ़्रीज़ होने की धमकी"}],"steps":[{"text":{"en":"Use ‘Where to complain’ and choose old shares or unclaimed dividends; the app will not guess the authority.","hi":"‘कहाँ शिकायत करें’ में “पुराने शेयर या बिना दावे वाला लाभांश” चुनें; ऐप खुद अंदाज़ा नहीं लगाएगा कि कौन-सी संस्था यह मामला देखती है।"},"sourceId":"sebi-rta-faq"},{"text":{"en":"Use the ‘Family safety’ checklist to check nominees, contact details, paper certificates and official contacts.","hi":"नॉमिनी, संपर्क जानकारी, कागज़ी प्रमाणपत्र और आधिकारिक संपर्क जाँचने के लिए ‘परिवार की सुरक्षा’ वाली सूची इस्तेमाल करें।"},"sourceId":"sebi-nomination-2026"},{"text":{"en":"Contact the company, registrar, fund or DP through an official website; do not pay an unsolicited recovery agent.","hi":"कंपनी, रजिस्ट्रार, फ़ंड या DP से आधिकारिक वेबसाइट के ज़रिए संपर्क करें; अचानक आए रिकवरी एजेंट को पैसे न दें।"},"sourceId":"sebi-rta-faq"},{"text":{"en":"For shares or dividends already with the IEPF, file online form IEPF-5 yourself; no agent is needed and none is appointed.","hi":"IEPF में जा चुके शेयर या लाभांश के लिए ऑनलाइन फ़ॉर्म IEPF-5 खुद भरें। किसी एजेंट की ज़रूरत नहीं है, और कोई एजेंट नियुक्त भी नहीं किया गया है।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"Trace other old money yourself: RBI's UDGAM portal for bank deposits, SEBI's MITRA platform for mutual funds and IRDAI's Bima Bharosa for insurance.","hi":"दूसरा पुराना पैसा खुद खोजें: बैंक जमा के लिए RBI का उद्गम (UDGAM) पोर्टल, म्यूचुअल फ़ंड के लिए SEBI का मित्र (MITRA) प्लेटफ़ॉर्म और बीमा के लिए IRDAI का बीमा भरोसा।"},"sourceId":"pib-unclaimed-2026"}],"actions":[{"target":"route","label":{"en":"Find the official route","hi":"आधिकारिक रास्ता खोजें"}},{"target":"family","label":{"en":"Open family safety","hi":"‘परिवार की सुरक्षा’ खोलें"}},{"target":"rights","label":{"en":"Step-by-step claim guides","hi":"दावे की आसान गाइड"}}]}]},"translations":{"schemaVersion":1,"texts":{"banner.urgent":{"en":"Sent money, shared an OTP or installed an app because of a message? Get urgent help first.","hi":"किसी संदेश के कारण पैसे भेजे, OTP बताया या ऐप इंस्टॉल किया? पहले तुरंत मदद लें।"},"banner.urgentButton":{"en":"Get urgent help","hi":"तुरंत मदद लें"},"route.rightsSummary":{"en":"Your rights and useful reminders","hi":"आपके अधिकार और उपयोगी बातें"},"route.prepareDraft":{"en":"Prepare my draft","hi":"मेरा मसौदा तैयार करें"},"route.saveActionCard":{"en":"Save my action card","hi":"मेरे अगले कदम सहेजें"},"actionCard.header":{"en":"MY NEXT STEPS — not an official complaint","hi":"मेरे अगले कदम — आधिकारिक शिकायत नहीं"},"trust.title":{"en":"Your data. Clear limits.","hi":"आपकी जानकारी। स्पष्ट सीमाएँ।"},"practice.title":{"en":"Try a 3-minute safety exercise","hi":"3 मिनट का सुरक्षा अभ्यास करें"},"practice.lede":{"en":"Fictional situations. No personal details. Learn, then try again.","hi":"काल्पनिक स्थितियाँ। कोई निजी जानकारी नहीं। सीखें, फिर कोशिश करें।"},"practice.lessonTitle":{"en":"Three habits to remember","hi":"याद रखने की तीन आदतें"},"habit.cardTitle":{"en":"Keep a weekly safety habit","hi":"हर हफ़्ते सुरक्षा की आदत रखें"},"habit.cardText":{"en":"Pause before transfers. Verify the source. Keep evidence. Repeat with your family.","hi":"पैसे भेजने से पहले रुकें। स्रोत जाँचें। सबूत रखें। परिवार के साथ दोहराएँ।"},"habit.download":{"en":"Download a 7-day habit card","hi":"7 दिन का आदत कार्ड डाउनलोड करें"}}}};
</script>
<script>
let lang='en',active='check',lastChecked=null;setTimeout(()=>document.documentElement.classList.add('ns-ready'),20000);const $=id=>document.getElementById(id),t=(en,hi)=>lang==='hi'?hi:en;
function assess(text){return []} // replaced in upgrade.js: local engine + content/warnings.json

function translate(){document.documentElement.lang=lang;document.querySelectorAll('[data-en]').forEach(e=>e.textContent=e.dataset[lang]);document.querySelectorAll('[data-en-placeholder]').forEach(e=>e.placeholder=e.dataset[lang+'Placeholder']);renderRoute();progress();if(lastChecked!==null)showResult(lastChecked)}

{const ih=document.querySelector('#check .input-help'),tips=ih?[...ih.querySelectorAll(':scope>p')]:[];if(tips.length&&!ih.querySelector('details.input-tips')){const d=el('details',undefined,'input-tips');d.append(bilingual('summary','Speak it, or copy it from a photo','बोलकर या फ़ोटो से कॉपी करके डालें'),...tips);ih.append(d)}}
// Home's language line becomes one short question; the helplines page it opens lists every language.
{const p=document.querySelector('#otherLanguage p');if(p){p.dataset.en='Speak another language?';p.dataset.hi='कोई और भाषा बोलते हैं?';p.textContent=t(p.dataset.en,p.dataset.hi)}}
// Footer: one quiet line; the full notes (disclaimer, sources checked, privacy) open on request.
const foot=document.querySelector('footer');
if(foot&&!foot.querySelector('details.about-app')){const d=el('details',undefined,'about-app'),inner=el('div');while(foot.firstChild)inner.append(foot.firstChild);d.append(bilingual('summary','About this app, privacy and sources','इस ऐप के बारे में, निजता और स्रोत'),inner);foot.append(bilingual('p','Free · no ads · no tips · nothing you type is sent; the family list is kept only if you ask','मुफ़्त · कोई विज्ञापन नहीं · कोई टिप नहीं · आपका लिखा कहीं भेजा नहीं जाता; परिवार की सूची सिर्फ़ आपके कहने पर रखी जाती है','footer-line'),d)}
}
// Market comparison (3 Oct 2026), idea G10: scams work by rushing people, and some phones now add a short pause during risky
// calls. Where the app says stop (Before you pay: STOP; a High-risk message), it offers "Pause for 30 seconds": a calm screen
// with a ring that empties over 30 seconds. A general safety step, not a rule from any one official page. Nothing is saved.
{
const pd=el('dialog',undefined,'pause-dialog');pd.id='pauseDialog';pd.setAttribute('aria-labelledby','pauseTitle');document.body.append(pd);
let pauseTimer=null;
const pauseRing=()=>{const ns='http://www.w3.org/2000/svg',s=document.createElementNS(ns,'svg');s.setAttribute('viewBox','0 0 120 120');s.setAttribute('class','pause-ring');s.setAttribute('aria-hidden','true');s.setAttribute('focusable','false');
 for(const cls of ['pause-track','pause-progress']){const c=document.createElementNS(ns,'circle');c.setAttribute('cx','60');c.setAttribute('cy','60');c.setAttribute('r','52');c.setAttribute('pathLength','1');c.setAttribute('class',cls);s.append(c)}return s};
function openPause(){
 clearInterval(pauseTimer);pd.replaceChildren();
 const h=el('h2',t('Pause for 30 seconds','30 सेकंड रुकें'));h.id='pauseTitle';
 const wrap=el('div',undefined,'pause-ring-wrap'),num=el('span','30','pause-count');wrap.append(pauseRing(),num);
 const body=el('p',t('Close the chat or hang up, and take a slow breath. Scammers rush you so that you cannot think; a real company or official can wait. Then call someone you trust, or check with the official app or website yourself.','चैट बंद करें या कॉल काट दें, और धीरे से साँस लें। धोखेबाज़ जल्दी इसलिए मचाते हैं ताकि आप सोच न सकें; असली कंपनी या अधिकारी इंतज़ार कर सकते हैं। फिर किसी भरोसेमंद व्यक्ति को फ़ोन करें, या आधिकारिक ऐप या वेबसाइट पर खुद जाँचें।'),'pause-body');
 const tag=el('p',t('General safety step','सामान्य सुरक्षा कदम'),'small pause-tag'),status=el('p','','pause-status');status.setAttribute('role','status');
 const close=el('button',t('Close','बंद करें'),'primary');close.type='button';close.id='pauseClose';close.onclick=()=>pd.close();
 pd.append(h,wrap,body,tag,status,close);
 let left=30;try{pd.showModal()}catch(e){pd.setAttribute('open','')}close.focus();
 pauseTimer=setInterval(()=>{left--;num.textContent=String(Math.max(left,0));if(left<=0){clearInterval(pauseTimer);wrap.classList.add('done');status.textContent=t('Thirty seconds. Now decide calmly.','30 सेकंड हो गए। अब शांति से फ़ैसला करें।')}},1000)}
pd.addEventListener('close',()=>clearInterval(pauseTimer));
const pauseButton=id=>{const b=el('button',t('Pause for 30 seconds','30 सेकंड रुकें'),'pause-button');b.type='button';b.id=id;b.onclick=openPause;return b};
// Offered after STOP in Before you pay (right under the verdict) and in a High-risk result's action buttons.
const offerPause=(boxId,verdictId,want,id,where)=>{const box=$(boxId);if(!box)return;const put=()=>{const v=$(verdictId);if(!v||document.getElementById(id))return;if((v.dataset.verdict||v.dataset.level)!==want)return;const b=pauseButton(id);if(where==='actions'){const a=$('resultActions');if(a)a.append(b)}else v.after(b)};new MutationObserver(put).observe(box,{childList:true});put()};
offerPause('payResult','payVerdict','stop','payPause','after');
offerPause('result','riskVerdict','high','checkPause','actions');
}
// Dark theme (owner, 3 Oct 2026: "make the light theme default ... the dark theme option will be in side bar so i have to select
// the dark theme if i want"). The app always opens in the light theme, whatever the device's own setting; "Dark theme" in the
// menu, beside "Larger text", switches it for this visit. Nothing is saved (the app keeps no storage), so the next visit opens
// in the light theme again. Colours are in theme.css.
{
const root=document.documentElement;
ICON_PATHS.moon='M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z';
const themeBtn=bilingual('button','Dark theme','डार्क थीम');themeBtn.id='themeToggle';themeBtn.type='button';withIcon(themeBtn,'moon');
// The browser's own bar matches the top bar.
const barColor=document.createElement('meta');barColor.name='theme-color';document.head.append(barColor);
// Colours change at once, without the buttons' short fade.
const quiet=()=>{root.classList.add('ns-theme-switch');requestAnimationFrame(()=>requestAnimationFrame(()=>root.classList.remove('ns-theme-switch')))};
const applyTheme=dark=>{quiet();root.dataset.theme=dark?'dark':'light';themeBtn.setAttribute('aria-pressed',String(dark));barColor.content=dark?'#072219':'#ffffff'};
themeBtn.onclick=()=>applyTheme(root.dataset.theme!=='dark');
big.after(themeBtn);applyTheme(false);
}
