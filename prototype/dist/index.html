partment/consumer-affairs","supports":{"en":"IRDAI Grievance Call Centre, toll-free 155255 or 1800 425 4732, 8 am to 8 pm, Monday to Saturday, in Hindi, English and other major Indian languages; it registers complaints, gives their status and escalates them to IRDAI","hi":"IRDAI शिकायत कॉल सेंटर, टोल-फ़्री 155255 या 1800 425 4732, सुबह 8 से रात 8 बजे, सोमवार से शनिवार, हिंदी, अंग्रेज़ी और दूसरी प्रमुख भारतीय भाषाओं में; यह शिकायत दर्ज करता है, उसकी स्थिति बताता है और उसे IRDAI तक बढ़ाता है"},"lastReviewed":"2026-10-02","reviewDue":"2026-11-02","reviewOwner":"Himanshi Rathore","reviewPending":true},{"id":"sebi-trading-freeze-2024","enabled":true,"name":{"en":"SEBI circular: voluntary freezing of trading accounts (12 January 2024)","hi":"SEBI सर्कुलर: ट्रेडिंग खाते को स्वेच्छा से फ़्रीज़ करना (12 जनवरी 2024)"},"authority":"Securities and Exchange Board of India (SEBI)","url":"https://www.sebi.gov.in/legal/circulars/jan-2024/ease-of-doing-investments-by-investors-facility-of-voluntary-freezing-blocking-of-trading-accounts-by-clients_80597.html","supports":{"en":"Stock brokers must let clients voluntarily freeze or block online access to their trading account when they notice suspicious activity, from 1 July 2024; voluntary freezing of demat accounts was already available","hi":"संदिग्ध गतिविधि दिखने पर स्टॉक ब्रोकर को ग्राहकों को अपने ट्रेडिंग खाते का ऑनलाइन एक्सेस स्वेच्छा से फ़्रीज़ या ब्लॉक करने की सुविधा देनी होती है, 1 जुलाई 2024 से; डीमैट खाते को स्वेच्छा से फ़्रीज़ करने की सुविधा पहले से है"},"note":{"en":"Circular SEBI/HO/MIRSD/POD-1/P/CIR/2024/4.","hi":"सर्कुलर SEBI/HO/MIRSD/POD-1/P/CIR/2024/4।"},"lastReviewed":"2026-10-03","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore","reviewPending":true},{"id":"i4c-suspect-search","enabled":true,"name":{"en":"Cybercrime portal: Suspect Search","hi":"साइबर अपराध पोर्टल: सस्पेक्ट सर्च"},"authority":"Indian Cyber Crime Coordination Centre (I4C), Ministry of Home Affairs","url":"https://cybercrime.gov.in/Webform/suspect_search_repository.aspx","supports":{"en":"Search a mobile number, e-mail, bank account number, social media ID or UPI ID against identifiers reported in cybercrime complaints; I4C says the database is not complete and may contain errors","hi":"मोबाइल नंबर, ईमेल, बैंक खाता नंबर, सोशल मीडिया आईडी या UPI आईडी को साइबर अपराध की शिकायतों में दर्ज पहचानों में खोजें; I4C के अनुसार यह सूची पूरी नहीं है और इसमें गलती हो सकती है"},"lastReviewed":"2026-10-03","reviewDue":"2026-11-01","reviewOwner":"Himanshi Rathore","reviewPending":true}],"helplines":[{"id":"cyber-1930","number":"1930","label":{"en":"Call 1930","hi":"1930 पर कॉल करें"},"note":{"en":"National cybercrime helpline for money lost to online fraud. Call at once; you can also report at cybercrime.gov.in.","hi":"ऑनलाइन धोखाधड़ी में पैसा जाने पर राष्ट्रीय साइबर अपराध हेल्पलाइन। तुरंत कॉल करें; cybercrime.gov.in पर भी रिपोर्ट कर सकते हैं।"},"sourceId":"cyber"},{"id":"sebi-helpline","number":"1800 266 7575","altNumber":"1800 22 7575","label":{"en":"SEBI investor helpline","hi":"SEBI निवेशक हेल्पलाइन"},"note":{"en":"Toll-free, 9 am to 6 pm, except Sundays and Maharashtra public holidays. In English, Hindi, Marathi, Gujarati, Tamil, Bengali and Telugu. For shares, brokers, mutual funds and SCORES complaints.","hi":"टोल-फ़्री, सुबह 9 से शाम 6 बजे, रविवार और महाराष्ट्र की सार्वजनिक छुट्टियों को छोड़कर। अंग्रेज़ी, हिंदी, मराठी, गुजराती, तमिल, बंगाली और तेलुगु में। शेयर, ब्रोकर, म्यूचुअल फ़ंड और SCORES की शिकायत के लिए।"},"sourceId":"sebi-helpline"},{"id":"rbi-14448","number":"14448","label":{"en":"RBI Contact Centre","hi":"RBI संपर्क केंद्र"},"note":{"en":"Toll-free. Explains how to complain about a bank, card or wallet to the RBI Ombudsman, in English, Hindi and ten regional languages. It cannot take your complaint.","hi":"टोल-फ़्री। बैंक, कार्ड या वॉलेट की शिकायत RBI लोकपाल तक कैसे पहुँचाएँ, यह अंग्रेज़ी, हिंदी और दस भारतीय भाषाओं में बताता है। यह आपकी शिकायत दर्ज नहीं करता।"},"sourceId":"rbi-ios-filing"},{"id":"irdai-igcc","number":"155255","altNumber":"1800 425 4732","label":{"en":"IRDAI insurance complaints","hi":"IRDAI बीमा शिकायत"},"note":{"en":"Toll-free, 8 am to 8 pm, Monday to Saturday, in Hindi, English and other major Indian languages. It can register an insurance complaint and escalate it to IRDAI.","hi":"टोल-फ़्री, सुबह 8 से रात 8 बजे, सोमवार से शनिवार, हिंदी, अंग्रेज़ी और दूसरी प्रमुख भारतीय भाषाओं में। यह बीमा की शिकायत दर्ज करके IRDAI तक बढ़ा सकता है।"},"sourceId":"irdai-igcc"},{"id":"iepf-14453","number":"14453","label":{"en":"IEPF helpdesk","hi":"IEPF हेल्पडेस्क"},"note":{"en":"For help with an IEPF-5 claim for shares or dividends moved to the IEPF.","hi":"IEPF में गए शेयर या लाभांश के IEPF-5 दावे में मदद के लिए।"},"sourceId":"iepf-helpdesk"}]},"warnings":{"schemaVersion":1,"channelQuestion":{"en":"Where did this message come from? (optional)","hi":"यह संदेश कहाँ से आया? (ज़रूरी नहीं)"},"channelWhy":{"en":"This changes only the advice under the result, not the warning check.","hi":"इससे केवल परिणाम के नीचे की सलाह बदलती है, खतरे की जाँच नहीं।"},"channels":[{"id":"sms","label":{"en":"SMS","hi":"SMS (एसएमएस)"},"advice":"link"},{"id":"whatsapp","label":{"en":"WhatsApp","hi":"व्हाट्सऐप"},"advice":"group"},{"id":"telegram","label":{"en":"Telegram","hi":"टेलीग्राम"},"advice":"group"},{"id":"social","label":{"en":"Social media or a video app","hi":"सोशल मीडिया या वीडियो ऐप"},"advice":"group"},{"id":"email","label":{"en":"Email","hi":"ईमेल"},"advice":"link"},{"id":"call","label":{"en":"Phone call","hi":"फ़ोन कॉल"},"advice":"link"}],"channelAdvice":{"group":{"text":{"en":"Investment tips and trading groups on chat apps and social media are a common route for fake trading-app scams. Do not install apps or pay through links shared there.","hi":"चैट ऐप और सोशल मीडिया पर निवेश टिप्स और ट्रेडिंग ग्रुप नकली ट्रेडिंग ऐप धोखाधड़ी का आम रास्ता हैं। वहाँ साझा किए गए लिंक से ऐप इंस्टॉल न करें और भुगतान न करें।"},"sourceId":"apps"},"link":{"text":{"en":"Do not use links, numbers or apps from the message. Contact the institution through its official website or app.","hi":"संदेश में दिए लिंक, नंबर या ऐप का उपयोग न करें। संस्था से उसकी आधिकारिक वेबसाइट या ऐप के माध्यम से संपर्क करें।"},"sourceId":"i4c-digital-arrest"}},"warnings":{"certainty":{"title":{"en":"Promises of certain returns","hi":"पक्के मुनाफ़े का वादा"},"why":{"en":"Verify independently. A promise of certain securities-market returns is a serious warning sign.","hi":"खुद जाँच करें। शेयर बाज़ार में पक्के मुनाफ़े का वादा खतरे का बड़ा संकेत है।"},"sourceId":"scam"},"urgency":{"title":{"en":"Pressure to pay quickly","hi":"जल्दी भुगतान का दबाव"},"why":{"en":"Pause. Pressure to hurry can prevent independent checks.","hi":"रुकें। जल्दबाज़ी के दबाव में आप खुद जाँच करने से चूक सकते हैं।"},"sourceId":"scam"},"personal":{"title":{"en":"Payment to a personal account","hi":"निजी खाते में भुगतान"},"why":{"en":"Confirm the payment destination using the institution’s official contact details.","hi":"पैसा किसके खाते में जा रहा है, यह संस्था के आधिकारिक संपर्क से पक्का करें।"},"sourceId":"apps"},"secrets":{"title":{"en":"Credentials or remote access requested","hi":"OTP, PIN, पासवर्ड या रिमोट एक्सेस की माँग"},"why":{"en":"Never share OTP, PIN, password or remote access with someone offering investment help.","hi":"निवेश में मदद का दावा करने वाले को कभी OTP, PIN या पासवर्ड न बताएँ, और न ही अपना फ़ोन दूर से चलाने दें (रिमोट एक्सेस)।"},"sourceId":"rbi-never-ask"},"social":{"title":{"en":"Investment offer through a chat group","hi":"चैट ग्रुप से निवेश का प्रस्ताव"},"why":{"en":"A group, testimonial or logo is not proof that the offer is legitimate.","hi":"ग्रुप, दूसरों की तारीफ़ (टेस्टिमोनियल) या किसी संस्था के लोगो से यह साबित नहीं होता कि प्रस्ताव असली है।"},"sourceId":"apps"},"borrowing":{"title":{"en":"Borrowing to invest or trade","hi":"निवेश या ट्रेडिंग के लिए उधार"},"why":{"en":"Losses can leave the loan unpaid. Pause and consider the effect on essential household money.","hi":"नुकसान होने पर भी कर्ज़ चुकाना बाकी रह सकता है। रुकें, और सोचें कि इसका घर के ज़रूरी खर्च के पैसे पर क्या असर होगा।"},"sourceId":"apps"},"withdrawal":{"title":{"en":"A fee to release your money","hi":"अपना पैसा निकालने के लिए फ़ीस"},"why":{"en":"Do not send another payment just to release alleged profits. Verify and consider reporting suspected fraud.","hi":"जो मुनाफ़ा दिखाया जा रहा है, उसे निकालने के लिए और पैसा न भेजें। खुद जाँच करें, और धोखाधड़ी का शक हो तो रिपोर्ट करें।"},"sourceId":"apps"},"app":{"title":{"en":"Unverified app installation","hi":"बिना जाँचे ऐप को इंस्टॉल करने की माँग"},"why":{"en":"Verify trading apps through official exchange or SEBI investor resources. Do not install an app from an unsolicited message.","hi":"ट्रेडिंग ऐप को स्टॉक एक्सचेंज या SEBI की आधिकारिक वेबसाइट पर जाँचें। बिना माँगे आए संदेश के कहने पर कोई ऐप इंस्टॉल न करें।"},"sourceId":"apps"},"doubling":{"title":{"en":"Money-multiplication promise","hi":"पैसे कई गुना करने का वादा"},"why":{"en":"Very rapid or daily returns need scepticism and independent checks.","hi":"बहुत तेज़ या रोज़ के मुनाफ़े के दावे पर शक करें और खुद जाँच करें।"},"sourceId":"scam"},"impersonation":{"title":{"en":"Claims to be, or to be approved by, an official body","hi":"SEBI, RBI जैसी सरकारी संस्था होने या उसकी मंज़ूरी का दावा"},"why":{"en":"SEBI warns that fraudsters pose as its officials, use its letterhead, logo and seal, and ask for payments. SEBI's emails come only from addresses ending in @sebi.gov.in. Check any such claim on the official website, not through the message.","hi":"SEBI चेतावनी देता है कि धोखेबाज़ उसके अधिकारी बनकर, उसका लेटरहेड, लोगो और मुहर इस्तेमाल करके भुगतान माँगते हैं। SEBI के ईमेल केवल @sebi.gov.in पर खत्म होने वाले पतों से आते हैं। ऐसे दावे को संदेश से नहीं, आधिकारिक वेबसाइट पर जाँचें।"},"sourceId":"sebi-impersonation"},"threat":{"title":{"en":"Threat of arrest, legal action or a blocked account","hi":"गिरफ़्तारी, कानूनी कार्रवाई या खाता बंद करने की धमकी"},"why":{"en":"Scammers posing as police or other agencies threaten \"digital arrest\" to frighten people into paying. Real law enforcement does not arrest anyone digitally. Do not pay; report at cybercrime.gov.in or call 1930.","hi":"पुलिस या दूसरी एजेंसी के अधिकारी बनकर धोखेबाज़ \"डिजिटल अरेस्ट\" की धमकी देकर डराते और पैसे माँगते हैं। असली पुलिस किसी को डिजिटल रूप से गिरफ़्तार नहीं करती। भुगतान न करें; cybercrime.gov.in पर रिपोर्ट करें या 1930 पर कॉल करें।"},"sourceId":"i4c-digital-arrest"},"tips":{"title":{"en":"Unsolicited stock tips or trading calls","hi":"बिना माँगे शेयर टिप्स या ट्रेडिंग कॉल"},"why":{"en":"SEBI warns that scamsters pull investors into WhatsApp or Telegram \"VIP\" or \"institutional trading\" groups, and that some falsely claim SEBI registration or show fake SEBI certificates. Check the registration on SEBI's website before acting on any tip.","hi":"SEBI चेतावनी देता है कि धोखेबाज़ निवेशकों को व्हाट्सऐप या टेलीग्राम के \"VIP\" या \"संस्थागत ट्रेडिंग\" ग्रुप में खींचते हैं। कुछ धोखेबाज़ झूठा दावा करते हैं कि वे SEBI में रजिस्टर्ड हैं, या नकली SEBI प्रमाणपत्र दिखाते हैं। किसी भी टिप पर कुछ करने से पहले SEBI की वेबसाइट पर रजिस्ट्रेशन जाँचें।"},"sourceId":"sebi-social-caution"},"link":{"title":{"en":"Suspicious link","hi":"संदिग्ध लिंक"},"why":{"en":"SEBI lists unverified app links and APK files as a red flag. A shortened or look-alike link can hide where it goes. Do not open it: type the official address yourself or use the official app store.","hi":"SEBI बिना जाँचे ऐप लिंक और APK फ़ाइलों (प्ले स्टोर के बाहर से ऐप डालने वाली फ़ाइलें) को खतरे का संकेत बताता है। छोटा किया गया लिंक, या असली से मिलता-जुलता नकली लिंक, असली पता छिपा सकता है। इसे न खोलें: आधिकारिक पता खुद टाइप करें या आधिकारिक ऐप स्टोर इस्तेमाल करें।"},"sourceId":"apps"},"ipo":{"title":{"en":"Fake IPO allotment or special-access offer","hi":"पक्के IPO आवंटन या खास पहुँच का झूठा प्रस्ताव"},"why":{"en":"In a public issue everyone applies through ASBA from their own bank account, and there is no discretion in allotment, so nobody can sell or guarantee you an allotment. Apply only yourself, through your own bank or broker.","hi":"पब्लिक इश्यू में हर कोई अपने बैंक खाते से ASBA के ज़रिए आवेदन करता है। आवंटन किसे मिले, यह कोई अपनी मर्ज़ी से तय नहीं कर सकता, इसलिए कोई आपको आवंटन बेच या पक्का नहीं कर सकता। आवेदन केवल खुद, अपने बैंक या ब्रोकर के माध्यम से करें।"},"sourceId":"sebi-icdr-faq"},"recovery":{"title":{"en":"Offer to recover lost money","hi":"डूबे पैसे वापस दिलाने का प्रस्ताव"},"why":{"en":"Do not pay anyone a fee to get back money lost to fraud. Report the loss yourself to the cyber crime helpline 1930 or on the National Cyber Crime Reporting Portal.","hi":"धोखाधड़ी में गए पैसे वापस दिलाने के लिए किसी को फ़ीस न दें। नुकसान की रिपोर्ट खुद साइबर अपराध हेल्पलाइन 1930 या राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल पर करें।"},"sourceId":"cyber"}}},"routes":{"schemaVersion":2,"texts":{"chooseIssue":{"en":"What is your problem about?","hi":"आपकी समस्या किस बारे में है?"},"scopeLabel":{"en":"Who handles this:","hi":"इसे कौन देखता है:"},"stageQuestion":{"en":"Where have you complained so far? Choose the last one.","hi":"अब तक आपने कहाँ शिकायत की है? आखिरी वाला चुनें।"},"stageNone":{"en":"Not yet","hi":"अभी तक नहीं"},"replyQuestion":{"en":"What happened after that complaint?","hi":"उस शिकायत के बाद क्या हुआ?"},"replyWaiting":{"en":"Waiting for a reply","hi":"जवाब का इंतज़ार है"},"replyUnresolved":{"en":"Replied, but not resolved","hi":"जवाब आया, पर समाधान नहीं हुआ"},"replyResolved":{"en":"Resolved","hi":"समाधान हो गया"},"numberQuestion":{"en":"Do you have a complaint or acknowledgement number?","hi":"क्या आपके पास शिकायत नंबर या पावती (रसीद) नंबर है?"},"numberYes":{"en":"Yes","hi":"हाँ"},"numberNo":{"en":"No","hi":"नहीं"},"nextTitle":{"en":"Your next step","hi":"आपका अगला कदम"},"nextLabel":{"en":"Go to:","hi":"यहाँ जाएँ:"},"ifNoReplyLabel":{"en":"If there is no reply in time, go to:","hi":"समय पर जवाब न मिले तो यहाँ जाएँ:"},"answerReply":{"en":"Tell us what happened after your complaint to see your next step.","hi":"अगला कदम देखने के लिए बताएँ कि शिकायत के बाद क्या हुआ।"},"firstAdvice":{"en":"Start with the institution itself. Use only contact details from its official website or app, never from a message.","hi":"शुरुआत संस्था से ही करें। केवल उसकी आधिकारिक वेबसाइट या ऐप के संपर्क विवरण का उपयोग करें, संदेश में दिए विवरण का कभी नहीं।"},"waitAdvice":{"en":"Give them the time the official rules allow to reply; the official page below explains it.","hi":"जवाब के लिए उन्हें आधिकारिक नियमों में दिया गया समय दें; नीचे का आधिकारिक पेज इसे समझाता है।"},"resolvedAdvice":{"en":"Good. Keep the reply and your complaint number safely; you may need them if the problem comes back.","hi":"अच्छा। जवाब और शिकायत नंबर सुरक्षित रखें; समस्या दोबारा हो तो इनकी ज़रूरत पड़ सकती है।"},"noNumberAdvice":{"en":"Ask for a complaint or acknowledgement number, or write down the date and how you complained. Escalating is easier with it.","hi":"शिकायत या पावती नंबर माँगें, या तारीख और शिकायत का तरीका लिख लें। इससे शिकायत आगे बढ़ाना आसान होता है।"},"lastAdvice":{"en":"You have reached the last official step listed here. Read that official page for any further options.","hi":"आप यहाँ दिए आखिरी आधिकारिक कदम तक पहुँच गए हैं। आगे के विकल्पों के लिए वही आधिकारिक पेज पढ़ें।"},"pathTitle":{"en":"Your complaint path","hi":"आपकी शिकायत का रास्ता"},"evidenceTitle":{"en":"Keep this evidence","hi":"ये सबूत रखें"},"abstainTitle":{"en":"We can't tell yet which official route applies","hi":"अभी हम नहीं बता सकते कि कौन-सा आधिकारिक रास्ता लागू है"}},"scopes":[{"id":"securities","label":{"en":"Securities market","hi":"शेयर बाज़ार (प्रतिभूति बाज़ार)"},"authority":{"en":"SEBI (Securities and Exchange Board of India)","hi":"SEBI (भारतीय प्रतिभूति और विनिमय बोर्ड)"}},{"id":"banking","label":{"en":"Banks, NBFCs, cards and wallets","hi":"बैंक, NBFC (गैर-बैंक वित्तीय कंपनियाँ), कार्ड और वॉलेट"},"authority":{"en":"RBI (Reserve Bank of India)","hi":"RBI (भारतीय रिज़र्व बैंक)"}},{"id":"insurance","label":{"en":"Insurance","hi":"बीमा"},"authority":{"en":"IRDAI (Insurance Regulatory and Development Authority of India)","hi":"IRDAI (भारतीय बीमा विनियामक और विकास प्राधिकरण)"}},{"id":"pension","label":{"en":"Pension: NPS and Atal Pension Yojana","hi":"पेंशन: NPS (राष्ट्रीय पेंशन प्रणाली) और अटल पेंशन योजना"},"authority":{"en":"PFRDA (Pension Fund Regulatory and Development Authority)","hi":"PFRDA (पेंशन निधि विनियामक और विकास प्राधिकरण)"}},{"id":"cybercrime","label":{"en":"Cybercrime and online fraud","hi":"साइबर अपराध और ऑनलाइन धोखाधड़ी"},"authority":{"en":"Police, through helpline 1930 and the National Cyber Crime Reporting Portal (Ministry of Home Affairs)","hi":"पुलिस, हेल्पलाइन 1930 और राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल के माध्यम से (गृह मंत्रालय)"}},{"id":"unclaimed","label":{"en":"Unclaimed shares and dividends","hi":"बिना दावे वाले शेयर और लाभांश"},"authority":{"en":"IEPF Authority (Ministry of Corporate Affairs)","hi":"IEPF प्राधिकरण (निवेशक शिक्षा और संरक्षण कोष; कॉर्पोरेट कार्य मंत्रालय)"}}],"levels":[{"id":"scores","scope":"securities","name":{"en":"SEBI SCORES","hi":"SEBI SCORES (स्कोर्स)"},"explain":{"en":"SCORES is SEBI's official online complaint system for listed companies and SEBI-registered intermediaries such as brokers, depository participants, registrars and mutual funds. Use it after complaining to the entity, within one year of the problem. Not satisfied? Ask for a review within 15 days of the reply: first by a designated body such as a stock exchange, a depository or AMFI, then by SEBI. You can also go to SMART ODR at any point, but that closes your SCORES complaint.","hi":"SCORES, SEBI का आधिकारिक ऑनलाइन शिकायत सिस्टम है। इस पर लिस्टेड कंपनियों और SEBI में रजिस्टर्ड संस्थाओं, जैसे ब्रोकर, डिपॉज़िटरी पार्टिसिपेंट (DP), रजिस्ट्रार और म्यूचुअल फ़ंड, की शिकायत होती है। पहले संस्था से शिकायत करें, फिर समस्या होने के एक साल के अंदर SCORES पर। जवाब से संतुष्ट न हों, तो 15 दिन के अंदर दोबारा जाँच माँगें: पहले स्टॉक एक्सचेंज, डिपॉज़िटरी या AMFI जैसी तय संस्था, फिर SEBI। आप कभी भी SMART ODR (ऑनलाइन विवाद समाधान) पर जा सकते हैं, पर तब SCORES वाली शिकायत बंद हो जाती है।"},"sourceId":"scores","linkLabel":{"en":"Open official SCORES","hi":"आधिकारिक SCORES खोलें"},"portalSourceId":"scores-home"},{"id":"smart-odr","scope":"securities","name":{"en":"SMART ODR: online conciliation and arbitration","hi":"SMART ODR: ऑनलाइन सुलह और पंच-फ़ैसला (आर्बिट्रेशन)"},"explain":{"en":"If the dispute is still not resolved, you can register it on SMART ODR, the online dispute resolution portal run by the stock exchanges and depositories. You must first have complained to the entity. Pre-conciliation is free for both sides and conciliation fees are paid by the market participant, but if the dispute goes to arbitration, both sides pay fees that depend on the claim amount.","hi":"विवाद अब भी न सुलझे, तो आप उसे SMART ODR पर दर्ज कर सकते हैं। यह स्टॉक एक्सचेंजों और डिपॉज़िटरी द्वारा चलाया जाने वाला ऑनलाइन विवाद समाधान पोर्टल है। इसके लिए पहले संस्था से शिकायत करना ज़रूरी है। शुरुआती सुलह (प्री-कंसिलिएशन) दोनों पक्षों के लिए मुफ़्त है, और सुलह की फ़ीस बाज़ार की संस्था या कंपनी देती है। लेकिन मामला पंच-फ़ैसले (आर्बिट्रेशन) में जाए, तो दोनों पक्ष फ़ीस देते हैं; यह फ़ीस दावे की रकम पर निर्भर करती है।"},"sourceId":"sebi-odr","linkLabel":{"en":"Read SEBI's SMART ODR page","hi":"SEBI का SMART ODR पेज पढ़ें"}},{"id":"iepf-claim","scope":"unclaimed","name":{"en":"Claim from the IEPF Authority","hi":"IEPF प्राधिकरण से दावा"},"explain":{"en":"If the transfer is confirmed, claim the shares or dividends back from the IEPF Authority with Form IEPF-5. It is filed online on the MCA portal (mca.gov.in), which iepf.gov.in links to. The company verifies the claim before the Authority refunds the money or credits the shares.","hi":"अगर पुष्टि हो जाए कि शेयर या लाभांश IEPF में चले गए हैं, तो उन्हें फ़ॉर्म IEPF-5 से IEPF प्राधिकरण से वापस माँगें। यह फ़ॉर्म MCA पोर्टल (mca.gov.in) पर ऑनलाइन भरा जाता है; iepf.gov.in पर इसका लिंक है। प्राधिकरण पैसा लौटाए या शेयर खाते में डाले, उससे पहले कंपनी दावे की जाँच करती है।"},"sourceId":"iepf-claim-kit","linkLabel":{"en":"Read the official IEPF-5 claim steps","hi":"IEPF-5 दावे के आधिकारिक कदम पढ़ें"}},{"id":"rbi-ombudsman","scope":"banking","name":{"en":"RBI Ombudsman (Integrated Ombudsman Scheme, 2026)","hi":"RBI लोकपाल (एकीकृत लोकपाल योजना, 2026)"},"explain":{"en":"If the bank or other covered entity does not reply within 30 days (or a longer period set by RBI, NPCI or card-network rules), or you are not satisfied with its reply, complain to the RBI Ombudsman at cms.rbi.org.in within 90 days after that period or the last reply, whichever is later. It covers banks, many NBFCs, wallets, card issuers and credit bureaus. A matter pending before, or decided by, a court, tribunal or arbitrator cannot be taken; a police case does not stop you.","hi":"बैंक या इस योजना में शामिल कोई दूसरी संस्था 30 दिन में (या RBI, NPCI या कार्ड नेटवर्क के नियमों में दिए ज़्यादा समय में) जवाब न दे, या आप उसके जवाब से संतुष्ट न हों, तो cms.rbi.org.in पर RBI लोकपाल से शिकायत करें: वह समय पूरा होने या आखिरी जवाब के 90 दिन के अंदर, जो भी बाद में हो। इसमें बैंक, कई NBFC, वॉलेट, कार्ड कंपनियाँ और क्रेडिट ब्यूरो शामिल हैं। जो मामला किसी अदालत, ट्रिब्यूनल या पंच के पास है या उनसे तय हो चुका है, वह नहीं लिया जाता; पुलिस केस होने से आपकी शिकायत नहीं रुकती।"},"sourceId":"rbi-ios-faq","linkLabel":{"en":"Open the RBI complaint portal (cms.rbi.org.in)","hi":"RBI शिकायत पोर्टल (cms.rbi.org.in) खोलें"},"portalSourceId":"rbi-cms"},{"id":"bima-bharosa","scope":"insurance","name":{"en":"IRDAI Bima Bharosa","hi":"IRDAI बीमा भरोसा"},"explain":{"en":"If the insurer does not resolve your complaint, or you are not satisfied with its reply, you can take it to IRDAI through the Bima Bharosa portal. Bima Bharosa does not ask for any payment.","hi":"यदि बीमा कंपनी आपकी शिकायत का समाधान न करे, या आप उसके जवाब से संतुष्ट न हों, तो आप बीमा भरोसा पोर्टल के माध्यम से IRDAI के पास शिकायत ले जा सकते हैं। बीमा भरोसा कोई भुगतान नहीं माँगता।"},"sourceId":"bima-bharosa","linkLabel":{"en":"Open IRDAI Bima Bharosa","hi":"IRDAI बीमा भरोसा खोलें"}},{"id":"insurance-ombudsman","scope":"insurance","name":{"en":"Insurance Ombudsman","hi":"बीमा लोकपाल"},"explain":{"en":"You can approach the Insurance Ombudsman if the insurer rejected your written complaint, did not reply within one month, or you are not satisfied with its reply. The rules require a written complaint to the insurer first; they do not require going to Bima Bharosa. Complain within one year of the insurer's reply, or of the end of that month if it did not reply. A matter that is, or was, before a court, consumer forum or arbitrator cannot be taken.","hi":"यदि बीमा कंपनी ने आपकी लिखित शिकायत अस्वीकार की, एक महीने में जवाब नहीं दिया, या आप उसके जवाब से संतुष्ट नहीं हैं, तो आप बीमा लोकपाल के पास जा सकते हैं। नियमों में पहले बीमा कंपनी को लिखित शिकायत ज़रूरी है; बीमा भरोसा पर जाना ज़रूरी नहीं है। बीमा कंपनी का जवाब आने के एक साल के अंदर शिकायत करें; जवाब न आए तो वह एक महीना पूरा होने के एक साल के अंदर। जो मामला अदालत, उपभोक्ता अदालत (फ़ोरम) या पंच (आर्बिट्रेटर) के पास है या रह चुका है, वह नहीं लिया जाता।"},"sourceId":"insurance-ombudsman","linkLabel":{"en":"Read the official Insurance Ombudsman FAQ","hi":"बीमा लोकपाल के आधिकारिक सवाल-जवाब (FAQ) पढ़ें"}},{"id":"nps-trust","scope":"pension","name":{"en":"NPS Trust (second level)","hi":"NPS ट्रस्ट (दूसरा स्तर)"},"explain":{"en":"If your intermediary or nodal office does not resolve your NPS or APY grievance within 30 days, or you are not satisfied with the resolution, you can escalate it to the NPS Trust.","hi":"यदि आपकी रजिस्टर्ड संस्था या नोडल कार्यालय 30 दिन में आपकी NPS या APY (अटल पेंशन योजना) शिकायत का समाधान न करे, या आप समाधान से संतुष्ट न हों, तो आप शिकायत NPS ट्रस्ट के पास ले जा सकते हैं।"},"sourceId":"pfrda-grievance","linkLabel":{"en":"Read PFRDA's grievance levels","hi":"PFRDA के शिकायत स्तर पढ़ें"}},{"id":"pfrda-ombudsman","scope":"pension","name":{"en":"Ombudsman appointed by PFRDA","hi":"PFRDA द्वारा नियुक्त लोकपाल"},"explain":{"en":"If the NPS Trust does not reply within 21 days, or you are not satisfied with its reply, you can appeal to the Ombudsman appointed by PFRDA. Appeal within 45 days of the Trust's reply, or within 45 days after those 21 days end if it does not reply.","hi":"यदि NPS ट्रस्ट 21 दिन में जवाब न दे, या आप उसके जवाब से संतुष्ट न हों, तो आप PFRDA द्वारा नियुक्त लोकपाल के पास अपील कर सकते हैं। ट्रस्ट का जवाब मिलने के 45 दिन के अंदर अपील करें; जवाब न आए तो उन 21 दिनों के बाद के 45 दिन के अंदर।"},"sourceId":"pfrda-grievance-faq","linkLabel":{"en":"Read PFRDA's grievance FAQs","hi":"PFRDA के शिकायत वाले सवाल-जवाब (FAQ) पढ़ें"}}],"issues":[{"id":"fraud","enabled":true,"kind":"outcomes","scope":"cybercrime","label":{"en":"Suspicious offer or possible fraud","hi":"संदिग्ध प्रस्ताव या धोखाधड़ी का शक"},"shortLabel":{"en":"Possible fraud","hi":"संभावित धोखाधड़ी"},"question":{"en":"Have you already sent money?","hi":"क्या आपने पैसे भेज दिए हैं?"},"answers":[{"id":"no","label":{"en":"No / not sure","hi":"नहीं / पक्का नहीं पता"},"outcome":"fraud-pause"},{"id":"yes","label":{"en":"Yes","hi":"हाँ"},"outcome":"fraud-urgent"}]},{"id":"broker","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"Stock broker or demat account (depository participant)","hi":"स्टॉक ब्रोकर या डीमैट खाता (डिपॉज़िटरी पार्टिसिपेंट, DP)"},"shortLabel":{"en":"Broker or demat account","hi":"ब्रोकर या डीमैट खाता"},"firstContact":{"name":{"en":"Your stock broker or depository participant (DP)","hi":"आपका स्टॉक ब्रोकर या डिपॉज़िटरी पार्टिसिपेंट (DP)"},"how":{"en":"Complain in writing to its grievance desk, using the email or complaint option on its official website or app, and keep the complaint number. SEBI asks investors to go to the entity first.","hi":"उसकी आधिकारिक वेबसाइट या ऐप पर दिए ईमेल या शिकायत विकल्प से, उसके शिकायत विभाग को लिखकर शिकायत भेजें। शिकायत नंबर सँभालकर रखें। SEBI निवेशकों से कहता है कि पहले उसी संस्था के पास जाएँ।"},"sourceId":"scores-home"},"ladder":["scores","smart-odr"],"evidence":[{"en":"Contract notes and statements for the trades or entries involved","hi":"जिन सौदों या एंट्री में समस्या है, उनके कॉन्ट्रैक्ट नोट और स्टेटमेंट"},{"en":"Your complaint to the broker or DP and its reply, with dates","hi":"ब्रोकर या DP को की गई शिकायत और उसका जवाब, तारीखों सहित"},{"en":"Emails, messages or screenshots about the problem, with account numbers covered except the last four digits","hi":"समस्या से जुड़े ईमेल, संदेश या स्क्रीनशॉट, खाता नंबर के अंतिम चार अंक छोड़कर बाकी छिपाकर"}],"tips":[{"text":{"en":"Not this door: SCORES does not take complaints about unregistered or unregulated activity (such as a tip group or app not registered with SEBI), fake or forged documents, or other regulators' matters. If such a group or app took your money, choose \"Possible fraud\" instead.","hi":"यह रास्ता नहीं: SCORES बिना पंजीकरण या बिना नियमन वाली गतिविधि (जैसे SEBI में पंजीकृत न होने वाला टिप ग्रुप या ऐप), जाली दस्तावेज़ या दूसरे नियामकों के मामलों की शिकायत नहीं लेता। ऐसे ग्रुप या ऐप ने पैसा लिया है, तो \"संभावित धोखाधड़ी\" चुनें।"},"sourceId":"scores"},{"text":{"en":"Shares moved out of your demat without your consent? Complain to your DP in writing at once. If forgery or hacking is involved, also report it to the police through cybercrime.gov.in or 1930.","hi":"आपकी मंज़ूरी के बिना डीमैट से शेयर निकल गए? तुरंत अपने DP को लिखित शिकायत करें। जालसाज़ी या हैकिंग हो तो cybercrime.gov.in या 1930 के ज़रिए पुलिस को भी रिपोर्ट करें।"},"sourceId":"cyber"}]},{"id":"company","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"Listed company or its registrar (RTA): dividend, share certificate or other shareholder service","hi":"शेयर बाज़ार में लिस्टेड कंपनी या उसका रजिस्ट्रार (RTA): लाभांश, शेयर प्रमाणपत्र या अन्य शेयरधारक सेवा"},"shortLabel":{"en":"Company or registrar (RTA)","hi":"कंपनी या रजिस्ट्रार (RTA)"},"firstContact":{"name":{"en":"The company's investor grievance contact or its registrar and transfer agent (RTA)","hi":"कंपनी का निवेशक शिकायत संपर्क या उसका रजिस्ट्रार और ट्रांसफ़र एजेंट (RTA)"},"how":{"en":"Complain in writing using the contact details on the company's or RTA's official website, and keep the complaint number. For paper (physical) holdings, the company or RTA takes complaints only if your folio's KYC is complete. If your shares or dividends were moved to IEPF, choose \"Old shares or unclaimed dividends\" instead.","hi":"कंपनी या RTA की आधिकारिक वेबसाइट पर दिए संपर्क से लिखित शिकायत करें, और शिकायत नंबर रखें। कागज़ी (भौतिक) होल्डिंग में कंपनी या RTA शिकायत तभी लेते हैं जब आपके फ़ोलियो (शेयर खाते का नंबर) का KYC पूरा हो। यदि आपके शेयर या लाभांश IEPF में भेजे गए हैं, तो इसके बजाय \"पुराने शेयर या बिना दावे वाला लाभांश\" चुनें।"},"sourceId":"sebi-rta-faq"},"ladder":["scores","smart-odr"],"evidence":[{"en":"Share certificates, demat statements or dividend letters, showing only the last four characters of folio or account numbers","hi":"शेयर प्रमाणपत्र, डीमैट स्टेटमेंट या लाभांश पत्र, फ़ोलियो या खाता नंबर के केवल अंतिम चार अक्षर दिखाते हुए"},{"en":"Your complaint to the company or RTA and its reply, with dates","hi":"कंपनी या RTA को की गई शिकायत और उसका जवाब, तारीखों सहित"}],"tips":[{"text":{"en":"Not this door: SCORES does not take complaints about unregistered or unregulated activity (such as a tip group or app not registered with SEBI), fake or forged documents, or other regulators' matters. If such a group or app took your money, choose \"Possible fraud\" instead.","hi":"यह रास्ता नहीं: SCORES बिना पंजीकरण या बिना नियमन वाली गतिविधि (जैसे SEBI में पंजीकृत न होने वाला टिप ग्रुप या ऐप), जाली दस्तावेज़ या दूसरे नियामकों के मामलों की शिकायत नहीं लेता। ऐसे ग्रुप या ऐप ने पैसा लिया है, तो \"संभावित धोखाधड़ी\" चुनें।"},"sourceId":"scores"},{"text":{"en":"Lost paper share certificates? Ask the company or its RTA for the duplicate process: an affidavit and an indemnity bond, plus a police report (FIR) and a newspaper advert only if the shares are worth over ₹5 lakh. Duplicates now come only in demat form.","hi":"कागज़ी शेयर प्रमाणपत्र खो गए? कंपनी या उसके RTA से डुप्लिकेट की प्रक्रिया पूछें: हलफ़नामा और क्षतिपूर्ति बॉन्ड लगते हैं; पुलिस रिपोर्ट (FIR) और अख़बार में विज्ञापन तभी, जब शेयरों की कीमत ₹5 लाख से ज़्यादा हो। डुप्लिकेट अब केवल डीमैट रूप में मिलते हैं।"},"sourceId":"sebi-duplicate-2022"}]},{"id":"mutual-fund","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"Mutual fund: units, redemption, statement or other service problem","hi":"म्यूचुअल फ़ंड: यूनिट, रिडेम्पशन (पैसे निकालना), स्टेटमेंट या दूसरी सेवा की समस्या"},"shortLabel":{"en":"Mutual fund","hi":"म्यूचुअल फ़ंड"},"firstContact":{"name":{"en":"The mutual fund (AMC) or its registrar's investor service centre","hi":"म्यूचुअल फ़ंड कंपनी (AMC) या उसके रजिस्ट्रार का निवेशक सेवा केंद्र"},"how":{"en":"Complain in writing through the fund's official website, app or investor service centre, and keep the complaint number.","hi":"फ़ंड की आधिकारिक वेबसाइट, ऐप या निवेशक सेवा केंद्र के माध्यम से लिखित शिकायत करें, और शिकायत नंबर रखें।"},"sourceId":"sebi-mf-faq"},"ladder":["scores","smart-odr"],"evidence":[{"en":"Account statements for the folio, showing only the last four characters of the folio number","hi":"फ़ोलियो के स्टेटमेंट, जिनमें फ़ोलियो नंबर के केवल अंतिम चार अक्षर दिखें"},{"en":"Transaction or redemption confirmations","hi":"लेन-देन या रिडेम्पशन (पैसे निकालने) की पुष्टि वाले संदेश या पत्र"},{"en":"Your complaint to the fund and its reply, with dates","hi":"फ़ंड को की गई शिकायत और उसका जवाब, तारीखों सहित"}],"tips":[{"text":{"en":"Not this door: SCORES does not take complaints about unregistered or unregulated activity (such as a tip group or app not registered with SEBI), fake or forged documents, or other regulators' matters. If such a group or app took your money, choose \"Possible fraud\" instead.","hi":"यह रास्ता नहीं: SCORES बिना पंजीकरण या बिना नियमन वाली गतिविधि (जैसे SEBI में पंजीकृत न होने वाला टिप ग्रुप या ऐप), जाली दस्तावेज़ या दूसरे नियामकों के मामलों की शिकायत नहीं लेता। ऐसे ग्रुप या ऐप ने पैसा लिया है, तो \"संभावित धोखाधड़ी\" चुनें।"},"sourceId":"scores"},{"text":{"en":"Can't find an old mutual fund investment? SEBI's MITRA platform helps trace unclaimed mutual fund money.","hi":"पुराना म्यूचुअल फ़ंड निवेश नहीं मिल रहा? SEBI का मित्र (MITRA) प्लेटफ़ॉर्म बिना दावे वाला म्यूचुअल फ़ंड पैसा खोजने में मदद करता है।"},"sourceId":"pib-unclaimed-2026"},{"text":{"en":"A Consolidated Account Statement (CAS) lists your transactions across all mutual funds and your demat accounts in one statement. Update your PAN with your DP or broker to receive it.","hi":"समेकित खाता विवरण (CAS) एक ही स्टेटमेंट है, जिसमें आपके सभी म्यूचुअल फ़ंड और डीमैट खातों के लेन-देन होते हैं। इसे पाने के लिए अपने DP या ब्रोकर के पास अपना PAN अपडेट कराएँ।"},"sourceId":"sebi-cas"}]},{"id":"transmission","enabled":true,"kind":"ladder","scope":"securities","label":{"en":"After a holder's death: moving shares or fund units to the nominee or legal heir","hi":"खाताधारक की मृत्यु के बाद: शेयर या फ़ंड यूनिट नॉमिनी या कानूनी वारिस के नाम करना"},"shortLabel":{"en":"After a death (transmission)","hi":"मृत्यु के बाद (ट्रांसमिशन)"},"firstContact":{"name":{"en":"The DP for demat holdings, the company or RTA for physical shares, and the fund (AMC or RTA) for mutual fund units","hi":"डीमैट होल्डिंग के लिए DP, कागज़ी (भौतिक) शेयरों के लिए कंपनी या RTA, और म्यूचुअल फ़ंड यूनिट के लिए फ़ंड (AMC या RTA)"},"how":{"en":"Ask each of them in writing what documents they need for transmission, and keep every acknowledgement. Requirements depend on the holding and the circumstances. Paper shares are transmitted only in demat form, so the nominee or heir needs a demat account.","hi":"हर एक से लिखित में पूछें कि होल्डिंग अपने नाम करवाने (ट्रांसमिशन) के लिए कौन-से कागज़ चाहिए, और हर पावती रखें। ज़रूरतें होल्डिंग और परिस्थिति पर निर्भर करती हैं। कागज़ी शेयर ट्रांसमिशन के बाद केवल डीमैट रूप में मिलते हैं, इसलिए नॉमिनी या वारिस के पास डीमैट खाता होना चाहिए।"},"sourceId":"sebi-rta-faq"},"ladder":["scores","smart-odr"],"evidence":[{"en":"The death certificate and the documents each institution asks for, shared only through its official process","hi":"मृत्यु प्रमाणपत्र और हर संस्था द्वारा माँगे गए दस्तावेज़ — ये केवल उसी संस्था की आधिकारिक प्रक्रिया से दें"},{"en":"Statements or certificates showing the holdings","hi":"होल्डिंग दिखाने वाले स्टेटमेंट या प्रमाणपत्र"},{"en":"Every request and acknowledgement, with dates","hi":"हर अनुरोध और पावती, तारीखों सहित"}],"tips":[{"text":{"en":"Company says the shares went to the IEPF? The legal heir first registers the transmission with the company, then claims from the IEPF with online form IEPF-5.","hi":"कंपनी कहती है कि शेयर IEPF में चले गए? कानूनी वारिस पहले कंपनी में ट्रांसमिशन दर्ज कराए, फिर ऑनलाइन फ़ॉर्म IEPF-5 भरकर IEPF से दावा करे।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"Not sure which mutual funds the person held? SEBI's MITRA platform helps trace unclaimed mutual fund money.","hi":"पता नहीं कि उनके कौन-से म्यूचुअल फ़ंड थे? SEBI का मित्र (MITRA) प्लेटफ़ॉर्म बिना दावे वाला म्यूचुअल फ़ंड पैसा खोजने में मदद करता है।"},"sourceId":"pib-unclaimed-2026"}]},{"id":"unclaimed","enabled":true,"kind":"ladder","scope":"unclaimed","label":{"en":"Shares or dividends that may have moved to the IEPF after seven unclaimed years","hi":"शेयर या लाभांश, जो सात साल तक बिना दावे के रहने पर शायद IEPF (सरकार का निवेशक शिक्षा और संरक्षण कोष) में चले गए हों"},"shortLabel":{"en":"Old shares or unclaimed dividends","hi":"पुराने शेयर या बिना दावे वाला लाभांश"},"firstContact":{"name":{"en":"The company or its registrar (RTA)","hi":"कंपनी या उसका रजिस्ट्रार (RTA)"},"how":{"en":"Ask them in writing whether your shares or dividends were transferred to the IEPF. Old does not automatically mean transferred: dividends move after seven unclaimed years, and the shares follow after seven unclaimed years in a row.","hi":"उनसे लिखित में पूछें कि क्या आपके शेयर या लाभांश IEPF में भेजे गए हैं। पुराना होने का मतलब यह नहीं कि वे भेजे ही गए हैं: लाभांश सात साल तक बिना दावे के रहे तो IEPF में जाता है, और लगातार सात साल लाभांश न लेने पर शेयर भी चले जाते हैं।"},"sourceId":"sebi-rta-faq"},"ladder":["iepf-claim"],"evidence":[{"en":"Share certificates, demat statements or old dividend letters","hi":"शेयर प्रमाणपत्र, डीमैट स्टेटमेंट या पुराने लाभांश पत्र"},{"en":"The company's or RTA's written reply about the transfer","hi":"IEPF में ट्रांसफ़र के बारे में कंपनी या RTA का लिखित जवाब"},{"en":"Every claim reference and acknowledgement, with dates","hi":"दावे का हर रेफ़रेंस नंबर और पावती, तारीखों सहित"}],"tips":[{"text":{"en":"File online form IEPF-5 yourself: no agent is needed, and none is appointed. Shares return to your demat account, so keep one ready with its client master list from your DP.","hi":"ऑनलाइन फ़ॉर्म IEPF-5 खुद भरें। किसी एजेंट की ज़रूरत नहीं है, और कोई एजेंट नियुक्त भी नहीं किया गया है। शेयर आपके डीमैट खाते में लौटते हैं, इसलिए एक डीमैट खाता तैयार रखें और अपने DP से उसकी क्लाइंट मास्टर लिस्ट (खाते की जानकारी वाला पत्र) ले लें।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"After filing, post the signed form and papers to the company's Nodal Officer and upload the postal receipt. The company then has 30 days to send its verification report to the IEPF.","hi":"फ़ॉर्म भरने के बाद हस्ताक्षर किया हुआ फ़ॉर्म और कागज़ कंपनी के नोडल अधिकारी को डाक से भेजें और डाक की रसीद अपलोड करें। इसके बाद कंपनी के पास IEPF को अपनी जाँच रिपोर्ट भेजने के लिए 30 दिन होते हैं।"},"sourceId":"iepf-verification-kit"},{"text":{"en":"Dividends stopped or a certificate was lost, but nothing has gone to the IEPF? Choose \"Company or registrar (RTA)\" instead.","hi":"लाभांश आना बंद हुआ या प्रमाणपत्र खो गया, पर कुछ IEPF में नहीं गया? इसके बजाय \"कंपनी या रजिस्ट्रार (RTA)\" चुनें।"},"sourceId":"sebi-rta-faq"},{"text":{"en":"Looking for other old money? RBI's UDGAM portal searches unclaimed bank deposits, SEBI's MITRA platform traces unclaimed mutual fund money and IRDAI's Bima Bharosa traces unclaimed insurance money.","hi":"दूसरा पुराना पैसा खोज रहे हैं? बिना दावे वाली बैंक जमा RBI के उद्गम (UDGAM) पोर्टल पर खोजी जा सकती है। बिना दावे वाला म्यूचुअल फ़ंड पैसा SEBI के मित्र (MITRA) प्लेटफ़ॉर्म पर, और बिना दावे वाला बीमा पैसा IRDAI के बीमा भरोसा पर खोजा जा सकता है।"},"sourceId":"pib-unclaimed-2026"}]},{"id":"bank","enabled":true,"kind":"ladder","scope":"banking","label":{"en":"Bank, NBFC, card or wallet service problem (not fraud)","hi":"बैंक, NBFC, कार्ड या वॉलेट सेवा की समस्या (धोखाधड़ी नहीं)"},"shortLabel":{"en":"Bank, card or wallet","hi":"बैंक, कार्ड या वॉलेट"},"firstContact":{"name":{"en":"Your bank, NBFC, or card or wallet provider","hi":"आपका बैंक, NBFC, या कार्ड या वॉलेट सेवा"},"how":{"en":"Complain to them first, in writing, through the grievance option on their official website, app or branch, and keep the complaint number. The RBI Ombudsman requires this first step.","hi":"पहले उन्हीं से लिखित शिकायत करें, उनकी आधिकारिक वेबसाइट, ऐप या शाखा के शिकायत विकल्प से, और शिकायत नंबर रखें। RBI लोकपाल के पास जाने से पहले यह कदम ज़रूरी है।"},"sourceId":"rbi-ios-faq"},"ladder":["rbi-ombudsman"],"evidence":[{"en":"Statement entries for the problem, with all but the last four digits of account and card numbers covered","hi":"समस्या से जुड़ी स्टेटमेंट एंट्री, खाता और कार्ड नंबर के अंतिम चार अंक छोड़कर बाकी छिपाकर"},{"en":"Your complaint to the bank or provider and its reply, with dates","hi":"बैंक या सेवा को की गई शिकायत और उसका जवाब, तारीखों सहित"},{"en":"Receipts, transaction references and screenshots","hi":"रसीदें, लेन-देन के रेफ़रेंस नंबर और स्क्रीनशॉट"}],"tips":[{"text":{"en":"An old deposit you never claimed? RBI's UDGAM portal (udgam.rbi.org.in) searches deposits that banks have already moved to RBI's DEA Fund; for a recent one, ask the bank. The money is claimed only from the bank itself.","hi":"कोई पुरानी जमा जिसका दावा नहीं किया? RBI का उद्गम (UDGAM) पोर्टल (udgam.rbi.org.in) उन जमाओं को खोजता है जो बैंक RBI के DEA फ़ंड में भेज चुके हैं; हाल की जमा के बारे में बैंक से पूछें। पैसे का दावा सिर्फ़ उसी बैंक से होता है।"},"sourceId":"rbi-udgam"},{"text":{"en":"Account frozen or money on hold after a cyber complaint? Ask the bank in writing which complaint and which police station or cyber cell asked for it, and contact that police station with your documents. The RBI Ombudsman does not take up action a bank took on police orders.","hi":"साइबर शिकायत के बाद खाता फ़्रीज़ हुआ या पैसा रोका गया? बैंक से लिखित में पूछें कि किस शिकायत पर और किस थाने या साइबर सेल के कहने पर ऐसा हुआ, और अपने दस्तावेज़ लेकर उसी थाने से संपर्क करें। पुलिस के आदेश पर बैंक की कार्रवाई की शिकायत RBI लोकपाल नहीं लेता।"},"sourceId":"rbi-ios-faq"},{"text":{"en":"A loan app or its agents harassing you? Report the app, and any bank account linked to it, to the police or on RBI Sachet.","hi":"लोन ऐप या उसके एजेंट परेशान कर रहे हैं? ऐप और उससे जुड़े बैंक खाते की शिकायत पुलिस में या RBI सचेत पर करें।"},"sourceId":"rbi-dla-caution-2020"},{"text":{"en":"Before borrowing through an app, check RBI's \"Digital Lending Apps\" directory to see whether it is linked to an RBI-regulated lender. Fake loan apps can be reported on cybercrime.gov.in or 1930.","hi":"किसी ऐप से उधार लेने से पहले RBI की \"डिजिटल लेंडिंग ऐप्स\" सूची में देखें कि वह ऐप RBI की निगरानी वाली किसी कर्ज़ देने वाली संस्था से जुड़ा है या नहीं। नकली लोन ऐप की शिकायत cybercrime.gov.in या 1930 पर करें।"},"sourceId":"pib-dla-2026"}]},{"id":"insurance","enabled":true,"kind":"ladder","scope":"insurance","label":{"en":"Insurance policy or claim problem","hi":"बीमा पॉलिसी या दावे की समस्या"},"shortLabel":{"en":"Insurance","hi":"बीमा"},"firstContact":{"name":{"en":"Your insurance company's grievance officer","hi":"आपकी बीमा कंपनी का शिकायत अधिकारी"},"how":{"en":"Complain to the insurer first, in writing, through its official website, app or branch. Keep the complaint number and its reply.","hi":"पहले बीमा कंपनी से लिखित शिकायत करें, उसकी आधिकारिक वेबसाइट, ऐप या शाखा के माध्यम से। शिकायत नंबर और उसका जवाब रखें।"},"sourceId":"bima-bharosa-faq"},"ladder":["bima-bharosa","insurance-ombudsman"],"evidence":[{"en":"The policy document and premium receipts","hi":"पॉलिसी दस्तावेज़ और प्रीमियम रसीदें"},{"en":"Claim forms, any rejection letter and other letters from the insurer","hi":"दावा फ़ॉर्म, दावा नामंज़ूर होने का पत्र (अगर मिला हो) और बीमा कंपनी के दूसरे पत्र"},{"en":"Your complaint to the insurer and its reply, with dates","hi":"बीमा कंपनी को की गई शिकायत और उसका जवाब, तारीखों सहित"}]},{"id":"pension","enabled":true,"kind":"ladder","scope":"pension","label":{"en":"Pension problem: NPS or Atal Pension Yojana","hi":"पेंशन की समस्या: NPS या अटल पेंशन योजना"},"shortLabel":{"en":"Pension (NPS, APY)","hi":"पेंशन (NPS, APY)"},"firstContact":{"name":{"en":"Your NPS intermediary or nodal office, such as the Point of Presence where you joined","hi":"आपकी NPS रजिस्टर्ड संस्था या नोडल कार्यालय, जैसे वह पॉइंट ऑफ़ प्रेज़ेंस (POP) जहाँ आप जुड़े थे"},"how":{"en":"Lodge the grievance on PFRDA's Pension Sahayak portal (pensionsahayak.pfrda.org.in). At the first level it is assigned to your intermediary or nodal office to resolve.","hi":"शिकायत PFRDA के पेंशन सहायक पोर्टल (pensionsahayak.pfrda.org.in) पर दर्ज करें। पहले स्तर पर इसे समाधान के लिए आपकी रजिस्टर्ड संस्था या नोडल कार्यालय को सौंपा जाता है।"},"sourceId":"pfrda-grievance"},"ladder":["nps-trust","pfrda-ombudsman"],"evidence":[{"en":"Statement entries for the problem, with all but the last four digits of your PRAN covered","hi":"समस्या से जुड़ी स्टेटमेंट एंट्री, PRAN (पेंशन खाता नंबर) के अंतिम चार अंक छोड़कर बाकी छिपाकर"},{"en":"Your grievance number and the replies you received, with dates","hi":"आपका शिकायत नंबर और मिले जवाब, तारीखों सहित"},{"en":"Letters or emails from your employer or intermediary","hi":"आपके नियोक्ता (जहाँ आप नौकरी करते हैं या करते थे) या रजिस्टर्ड संस्था के पत्र या ईमेल"}]},{"id":"unknown","enabled":true,"kind":"abstain","label":{"en":"Not sure, or something else","hi":"पक्का नहीं पता, या कुछ और"},"shortLabel":{"en":"Not sure / something else","hi":"पक्का नहीं पता / कुछ और"},"steps":[{"en":"Quick guide: money taken or a scam → Possible fraud; a broker or demat app → Broker; dividends or paper shares → Company or registrar; a holder has died → After a death; a bank, card or loan app → Bank; a policy → Insurance; NPS or APY → Pension.","hi":"आसान पहचान: पैसा गया या धोखा → संभावित धोखाधड़ी; ब्रोकर या डीमैट ऐप → ब्रोकर; लाभांश या कागज़ी शेयर → कंपनी या रजिस्ट्रार; खाताधारक की मृत्यु → मृत्यु के बाद; बैंक, कार्ड या लोन ऐप → बैंक; पॉलिसी → बीमा; NPS या APY → पेंशन।"},{"en":"Find the institution's own complaint option on its official website or app. Do not use numbers or links from a message.","hi":"संस्था की आधिकारिक वेबसाइट या ऐप पर उसका अपना शिकायत विकल्प खोजें। संदेश में दिए नंबर या लिंक का उपयोग न करें।"},{"en":"If you think it is a fraud, or you have lost money, choose \"Possible fraud\" or use Get urgent help (1930).","hi":"यदि आपको धोखाधड़ी लगती है, या पैसे गए हैं, तो \"संभावित धोखाधड़ी\" चुनें या \"तुरंत मदद लें\" (1930) बटन दबाएँ।"},{"en":"Each regulator handles its own area: SEBI the securities market, RBI banks and payments, IRDAI insurance, and PFRDA pensions. The official pages below explain each.","hi":"हर नियामक (निगरानी करने वाली सरकारी संस्था) अपना क्षेत्र देखता है: SEBI शेयर बाज़ार और म्यूचुअल फ़ंड, RBI बैंक और भुगतान, IRDAI बीमा, और PFRDA पेंशन। नीचे दिए आधिकारिक पेज हर एक के बारे में बताते हैं।"},{"en":"Keep your evidence and note the dates while you find the right route.","hi":"सही रास्ता खोजते समय सबूत रखें और तारीखें लिख लें।"}],"sourceIds":["scores","rbi-ios-faq","bima-bharosa-faq","pfrda-grievance","cyber"],"tips":[{"text":{"en":"Account frozen or money on hold after a cyber complaint? Ask the bank in writing which complaint and which police station or cyber cell asked for it, and contact that police station with your documents. The RBI Ombudsman does not take up action a bank took on police orders.","hi":"साइबर शिकायत के बाद खाता फ़्रीज़ हुआ या पैसा रोका गया? बैंक से लिखित में पूछें कि किस शिकायत पर और किस थाने या साइबर सेल के कहने पर ऐसा हुआ, और अपने दस्तावेज़ लेकर उसी थाने से संपर्क करें। पुलिस के आदेश पर बैंक की कार्रवाई की शिकायत RBI लोकपाल नहीं लेता।"},"sourceId":"rbi-ios-faq"},{"text":{"en":"Old shares or dividends moved to the IEPF? File form IEPF-5 online, post the papers to the company and upload the postal receipt; the company then has 30 days to send its verification report. Choose \"Old shares or unclaimed dividends\" for the full steps.","hi":"पुराने शेयर या लाभांश IEPF में चले गए? फ़ॉर्म IEPF-5 ऑनलाइन भरें, कागज़ कंपनी को डाक से भेजें और डाक की रसीद अपलोड करें; इसके बाद कंपनी के पास अपनी जाँच रिपोर्ट भेजने के लिए 30 दिन होते हैं। पूरे कदमों के लिए \"पुराने शेयर या बिना दावे वाला लाभांश\" चुनें।"},"sourceId":"iepf-verification-kit"},{"text":{"en":"Looking for other old money? RBI's UDGAM portal searches unclaimed bank deposits, SEBI's MITRA platform traces unclaimed mutual fund money and IRDAI's Bima Bharosa traces unclaimed insurance money.","hi":"दूसरा पुराना पैसा खोज रहे हैं? बिना दावे वाली बैंक जमा RBI के उद्गम (UDGAM) पोर्टल पर खोजी जा सकती है। बिना दावे वाला म्यूचुअल फ़ंड पैसा SEBI के मित्र (MITRA) प्लेटफ़ॉर्म पर, और बिना दावे वाला बीमा पैसा IRDAI के बीमा भरोसा पर खोजा जा सकता है।"},"sourceId":"pib-unclaimed-2026"},{"text":{"en":"Money deducted every month for something you don't recognise? Ask your bank in writing which mandate or policy it is for and who set it up, then choose the matching route here, such as Insurance. Card and UPI auto-pay mandates can be withdrawn at any time.","hi":"किसी अनजान चीज़ के लिए हर महीने पैसा कट रहा है? बैंक से लिखित में पूछें कि यह किस मैंडेट (अपने-आप पैसा काटने की मंज़ूरी) या पॉलिसी के लिए है, और इसे किसने शुरू किया। फिर यहाँ उससे मिलता रास्ता चुनें, जैसे बीमा। कार्ड और UPI के ऑटो-पे मैंडेट कभी भी वापस लिए जा सकते हैं।"},"sourceId":"rbi-emandate"}]}],"outcomes":[{"id":"fraud-urgent","title":{"en":"Act promptly: report suspected financial fraud","hi":"तुरंत कदम उठाएँ: पैसों की धोखाधड़ी का शक हो तो रिपोर्ट करें"},"steps":[{"en":"Contact your bank or payment provider immediately using its official number. Under RBI rules, how much of the loss you may have to bear depends on how quickly you report it.","hi":"अपने बैंक या भुगतान सेवा से तुरंत उसके आधिकारिक नंबर पर संपर्क करें। RBI के नियमों के अनुसार, नुकसान का कितना हिस्सा आपको उठाना पड़ सकता है, यह इस पर निर्भर करता है कि आपने कितनी जल्दी सूचना दी।"},{"en":"Call 1930 and report at the National Cyber Crime Reporting Portal. Follow their instructions.","hi":"1930 पर कॉल करें और राष्ट्रीय साइबर अपराध रिपोर्टिंग पोर्टल पर रिपोर्ट करें। उनके निर्देश मानें।"},{"en":"If the bank rejects your complaint about money taken without your consent, you are not satisfied with its reply, or it does not reply within 30 days (or a longer period set by RBI, NPCI or card-network rules), complain to the RBI Ombudsman at cms.rbi.org.in within 90 days after that.","hi":"आपकी मंज़ूरी के बिना कटे पैसे की शिकायत बैंक ठुकरा दे, आप उसके जवाब से संतुष्ट न हों, या वह 30 दिन में (या RBI, NPCI या कार्ड नेटवर्क के नियमों में दिए ज़्यादा समय में) जवाब न दे, तो उसके बाद 90 दिन के अंदर cms.rbi.org.in पर RBI लोकपाल से शिकायत करें।"},{"en":"Money collected for a chit, committee, deposit or Ponzi scheme: give the information to the police or the Economic Offences Wing (EOW) of your state, and report the scheme on RBI Sachet.","hi":"चिट, कमेटी, जमा या पोंज़ी योजना के नाम पर पैसा लिया गया? इसकी जानकारी अपने राज्य की पुलिस या आर्थिक अपराध शाखा (EOW) को दें। साथ ही RBI सचेत (Sachet) पोर्टल पर योजना की शिकायत करें।"},{"en":"A loan app threatening you or your contacts: report it on cybercrime.gov.in or 1930. Before borrowing again, check RBI's \"Digital Lending Apps\" directory to see whether an app is linked to an RBI-regulated lender.","hi":"लोन ऐप आपको या आपके संपर्कों को धमका रहा है: cybercrime.gov.in या 1930 पर शिकायत करें। दोबारा उधार लेने से पहले RBI की \"डिजिटल लेंडिंग ऐप्स\" सूची में देखें कि ऐप किसी RBI-नियंत्रित संस्था से जुड़ा है या नहीं।"},{"en":"Shares moved out of your demat without your consent? Complain to your DP or broker in writing at once. If forgery or hacking is involved, also report it on cybercrime.gov.in or 1930: SCORES does not take matters involving forged documents. Otherwise the next steps are SEBI SCORES, then SMART ODR (see ‘Where to complain’: \"Broker or demat account\").","hi":"आपकी मंज़ूरी के बिना डीमैट से शेयर निकल गए? तुरंत अपने DP या ब्रोकर को लिखित शिकायत करें। जाली दस्तख़त या हैकिंग हुई हो, तो cybercrime.gov.in या 1930 पर भी रिपोर्ट करें, क्योंकि जाली दस्तावेज़ वाले मामले SCORES नहीं लेता। नहीं तो अगला कदम SEBI SCORES और फिर SMART ODR है (‘कहाँ शिकायत करें’ में \"ब्रोकर या डीमैट खाता\" देखें)।"},{"en":"Keep transaction references and messages. Do not pay a “recovery fee”. Recovery is not guaranteed.","hi":"लेन-देन के रेफ़रेंस नंबर और संदेश सँभालकर रखें। कोई “रिकवरी फ़ीस” न दें। पैसा वापस मिलने की गारंटी नहीं है।"}],"helplineId":"cyber-1930","link":{"sourceId":"cyber","label":{"en":"Open official cybercrime portal","hi":"आधिकारिक साइबर अपराध पोर्टल खोलें"}},"sourceIds":["rbi-liability","rbi-ios-faq","rbi-nbfc-faq","pib-dla-2026","scores","sebi-odr","cyber"]},{"id":"fraud-pause","title":{"en":"Pause before sending anything","hi":"कुछ भी भेजने से पहले रुकें"},"steps":[{"en":"Do not send money until you have checked the offer yourself. Never share an OTP, PIN or password.","hi":"जब तक आप खुद प्रस्ताव की जाँच न कर लें, तब तक पैसे न भेजें। OTP, PIN या पासवर्ड कभी किसी को न बताएँ।"},{"en":"Use official institution contact details, not links or numbers supplied in the message.","hi":"संस्था के आधिकारिक संपर्क का ही इस्तेमाल करें, संदेश में दिए लिंक या नंबर का नहीं।"},{"en":"If you suspect a cybercrime, use the official portal for reporting guidance.","hi":"साइबर अपराध का संदेह हो तो रिपोर्टिंग के लिए आधिकारिक पोर्टल देखें।"},{"en":"Asked to put money into a chit, committee, deposit or Ponzi scheme? Check on RBI Sachet whether the entity may take deposits (registered chit funds are regulated by the State Government), and report suspicious schemes there; the police or your state's Economic Offences Wing also take such complaints.","hi":"चिट, कमेटी, जमा या पोंज़ी योजना में पैसा लगाने को कहा जा रहा है? RBI सचेत पर जाँचें कि वह संस्था जमा ले सकती है या नहीं (रजिस्टर्ड चिट फ़ंड राज्य सरकार की निगरानी में होते हैं), और संदिग्ध योजना की शिकायत वहीं करें; अपने राज्य की पुलिस या आर्थिक अपराध शाखा भी ऐसी शिकायतें लेती है।"},{"en":"Offered a loan through an app? Check RBI's \"Digital Lending Apps\" directory to see whether the app is linked to an RBI-regulated lender.","hi":"किसी ऐप से लोन की पेशकश? RBI की \"डिजिटल लेंडिंग ऐप्स\" सूची में देखें कि ऐप RBI की निगरानी वाली किसी कर्ज़ देने वाली संस्था से जुड़ा है या नहीं।"},{"en":"Someone offering to recover old shares, deposits, mutual fund or insurance money for a fee? You can trace them yourself: the IEPF for old shares and dividends (form IEPF-5, no agent needed), RBI's UDGAM portal for deposits, SEBI's MITRA for mutual funds and IRDAI's Bima Bharosa for insurance.","hi":"कोई फ़ीस लेकर पुराने शेयर, जमा, म्यूचुअल फ़ंड या बीमा का पैसा दिलाने की बात कर रहा है? यह पैसा आप खुद खोज सकते हैं। पुराने शेयर और लाभांश के लिए IEPF (फ़ॉर्म IEPF-5; किसी एजेंट की ज़रूरत नहीं)। जमा के लिए RBI का उद्गम (UDGAM) पोर्टल। म्यूचुअल फ़ंड के लिए SEBI का मित्र (MITRA)। बीमा के लिए IRDAI का बीमा भरोसा।"}],"link":{"sourceId":"cyber","label":{"en":"Open official cybercrime portal","hi":"आधिकारिक साइबर अपराध पोर्टल खोलें"}},"sourceIds":["rbi-nbfc-faq","pib-dla-2026","pib-unclaimed-2026","iepf-claimant-faq","rbi-never-ask"]}]},"rights":{"schemaVersion":1,"cards":[{"id":"fraud-evidence","enabled":true,"issueIds":["fraud"],"text":{"en":"Save evidence before blocking a suspicious contact. Report promptly after financial loss. A recovery promise is not a guarantee.","hi":"संदिग्ध संपर्क ब्लॉक करने से पहले सबूत रखें। पैसों का नुकसान हो तो जल्दी रिपोर्ट करें। पैसा वापस दिलाने का वादा, गारंटी नहीं है।"},"sourceId":"cyber"},{"id":"broker-review","enabled":true,"issueIds":["broker","company","mutual-fund","transmission"],"text":{"en":"You can raise an eligible grievance and seek a review through the applicable official process. Keep acknowledgements. Check current SCORES instructions for eligibility and review time limits; do not wait for this prototype to remind you.","hi":"जो शिकायत नियमों के दायरे में आती है, उसे आप दर्ज कर सकते हैं, और तय आधिकारिक प्रक्रिया से उस पर दोबारा जाँच (समीक्षा) माँग सकते हैं। पावती सँभालकर रखें। कौन-सी शिकायत ली जाती है, और दोबारा जाँच माँगने की समय-सीमा क्या है, यह SCORES के ताज़ा निर्देशों में देखें; इस ऐप के याद दिलाने का इंतज़ार न करें।"},"sourceId":"scores"},{"id":"family-entitlement","enabled":true,"issueIds":["unclaimed","transmission"],"text":{"en":"Nomination, ownership and inheritance are different questions. Ask the institution for the applicable requirements in writing; this app does not decide entitlement.","hi":"नॉमिनी होना, मालिकाना हक और विरासत अलग-अलग बातें हैं। संस्था से लिखित में पूछें कि आपके मामले में कौन-से नियम और कागज़ लागू हैं; यह ऐप तय नहीं करता कि किसका हक बनता है।"},"sourceId":"sebi-rta-faq"},{"id":"nominee-trustee","enabled":true,"issueIds":["transmission"],"text":{"en":"A nominee receives the holdings as a trustee for the legal heirs. Nomination alone does not decide who finally owns them.","hi":"नॉमिनी को होल्डिंग कानूनी वारिसों की ओर से, ट्रस्टी (देखरेख करने वाले) के रूप में मिलती है। सिर्फ़ नॉमिनी बना देने से यह तय नहीं होता कि आखिर में मालिक कौन होगा।"},"sourceId":"sebi-rta-faq"},{"id":"investor-charter","enabled":true,"issueIds":["broker","company","mutual-fund","transmission"],"text":{"en":"SEBI's Investor Charter gives you the right to fair and equitable treatment, to time-bound redressal of grievances filed on SCORES, and to quality services from SEBI-registered intermediaries, including online dispute resolution (SMART ODR).","hi":"SEBI का निवेशक चार्टर आपको ये अधिकार देता है: निष्पक्ष और समान व्यवहार; SCORES पर दर्ज शिकायतों का तय समय में समाधान; और SEBI में रजिस्टर्ड संस्थाओं से अच्छी सेवा, जिसमें ऑनलाइन विवाद समाधान (SMART ODR) भी शामिल है।"},"sourceId":"sebi-investor-charter"},{"id":"bank-customer-rights","enabled":true,"issueIds":["bank"],"text":{"en":"RBI's Charter of Customer Rights names five basic rights of bank customers: fair treatment; transparency, fair and honest dealing; products suited to your needs; privacy; and grievance redress and compensation.","hi":"RBI के ग्राहक अधिकार चार्टर में बैंक ग्राहकों के पाँच बुनियादी अधिकार हैं: उचित व्यवहार; पारदर्शिता (हर बात साफ़-साफ़ बताना), निष्पक्ष और ईमानदार लेन-देन; आपकी ज़रूरत के हिसाब से उपयुक्त उत्पाद; निजता; और शिकायत का निवारण व मुआवज़ा।"},"sourceId":"rbi-customer-charter"},{"id":"insurance-free-look","enabled":true,"issueIds":["insurance"],"text":{"en":"For a life or health policy of one year or more, IRDAI gives you 30 days from receiving the policy to review it. You can cancel in that time for any reason; only the risk premium for the days covered, medical-test costs and stamp duty may be deducted. For unit-linked (ULIP) policies the units are bought back at that day's value, so the refund can be lower. Life refunds are due within 7 days.","hi":"एक साल या उससे ज़्यादा अवधि की जीवन या स्वास्थ्य बीमा पॉलिसी मिलने के बाद IRDAI आपको उसे जाँचने के लिए 30 दिन देता है। इस दौरान आप किसी भी कारण से पॉलिसी रद्द कर सकते हैं; रिफ़ंड में से सिर्फ़ कवर वाले दिनों का जोखिम प्रीमियम, मेडिकल जाँच का खर्च और स्टांप शुल्क काटे जा सकते हैं। यूलिप (ULIP) पॉलिसी में यूनिट उस दिन की कीमत पर वापस खरीदी जाती हैं, इसलिए रिफ़ंड कम हो सकता है। जीवन बीमा में रिफ़ंड 7 दिन में देना होता है।"},"sourceId":"irdai-policyholder-mc"},{"id":"insurance-grievance-time","enabled":true,"issueIds":["insurance"],"text":{"en":"Complain to the insurer first, in writing, to its Grievance Redressal Officer, with your documents. IRDAI requires an insurance company to resolve a grievance within two weeks of receiving it.","hi":"पहले बीमा कंपनी के शिकायत निवारण अधिकारी को लिखित शिकायत दें, साथ में ज़रूरी कागज़ लगाएँ। IRDAI के अनुसार बीमा कंपनी को शिकायत मिलने के दो हफ़्ते के अंदर उसका समाधान करना होता है।"},"sourceId":"irdai-consumer-affairs"}],"guides":[{"id":"scores","enabled":true,"issueIds":["broker","company","mutual-fund","transmission"],"helplineId":"sebi-helpline","title":{"en":"Complain on SEBI SCORES (shares, brokers, mutual funds)","hi":"SEBI SCORES पर शिकायत (शेयर, ब्रोकर, म्यूचुअल फ़ंड)"},"when":{"en":"Use this when a broker, DP, listed company, registrar (RTA) or mutual fund has not solved your written complaint.","hi":"जब ब्रोकर, DP, लिस्टेड कंपनी, रजिस्ट्रार (RTA) या म्यूचुअल फ़ंड ने आपकी लिखित शिकायत हल न की हो।"},"steps":[{"text":{"en":"First complain in writing to the company, broker, DP, registrar or fund, and keep the complaint number. Use SCORES after that.","hi":"पहले कंपनी, ब्रोकर, DP, रजिस्ट्रार या फ़ंड को लिखित शिकायत करें और शिकायत नंबर सँभालकर रखें। उसके बाद SCORES का इस्तेमाल करें।"},"sourceId":"scores"},{"text":{"en":"On scores.sebi.gov.in or the SCORES app, choose Sign in/Sign up, then Register. Keep ready your name, address, e-mail, PAN, mobile number and date of birth: all are required.","hi":"scores.sebi.gov.in या SCORES ऐप पर Sign in/Sign up चुनें, फिर Register। अपना नाम, पता, ई-मेल, PAN, मोबाइल नंबर और जन्मतिथि तैयार रखें: ये सब ज़रूरी हैं।"},"sourceId":"scores-howto"},{"text":{"en":"You can fill the form, or fetch your details with your PAN and date of birth. An OTP comes to your own mobile: type it only on the SCORES site or app, and never tell it to anyone.","hi":"आप फ़ॉर्म भर सकते हैं, या PAN और जन्मतिथि से अपनी जानकारी अपने-आप भरवा सकते हैं। OTP आपके अपने मोबाइल पर आएगा: उसे सिर्फ़ SCORES की साइट या ऐप पर खुद भरें, किसी को न बताएँ।"},"sourceId":"scores-howto"},{"text":{"en":"File within one year of the problem, and attach your supporting documents.","hi":"समस्या होने के एक साल के अंदर शिकायत करें, और साथ में अपने सबूत वाले दस्तावेज़ लगाएँ।"},"sourceId":"scores"},{"text":{"en":"The company, broker or fund must reply on SCORES within 21 days.","hi":"कंपनी, ब्रोकर या फ़ंड को 21 दिनों के अंदर SCORES पर जवाब देना होता है।"},"sourceId":"scores-howto"},{"text":{"en":"Not happy with the reply? Ask for a review within 15 days: first by a body such as a stock exchange or depository, then by SEBI.","hi":"जवाब से संतुष्ट नहीं? 15 दिनों के अंदर दोबारा जाँच (रिव्यू) माँगें: पहले स्टॉक एक्सचेंज या डिपॉज़िटरी जैसी संस्था, फिर SEBI।"},"sourceId":"scores"},{"text":{"en":"You can move to SMART ODR (online conciliation and arbitration) at any time, but that closes your SCORES complaint.","hi":"आप कभी भी SMART ODR (ऑनलाइन सुलह और मध्यस्थता) पर जा सकते हैं, पर तब आपकी SCORES वाली शिकायत बंद हो जाती है।"},"sourceId":"scores"},{"text":{"en":"Shares or dividends already moved to the IEPF are not handled on SCORES: use the IEPF guide instead.","hi":"जो शेयर या लाभांश IEPF में जा चुके हैं, उनकी शिकायत SCORES पर नहीं होती: इसके बजाय IEPF वाली गाइड देखें।"},"sourceId":"scores"}],"documents":{"items":[{"en":"Your complaint to the company, broker or fund, and its reply","hi":"कंपनी, ब्रोकर या फ़ंड को की गई शिकायत और उसका जवाब"},{"en":"Account statement, contract note or share certificate copy","hi":"खाते का स्टेटमेंट, कॉन्ट्रैक्ट नोट या शेयर सर्टिफ़िकेट की कॉपी"},{"en":"PAN and your contact details","hi":"PAN और आपका संपर्क विवरण"}]}},{"id":"iepf","enabled":true,"issueIds":["unclaimed","transmission"],"helplineId":"iepf-14453","title":{"en":"Claim shares or dividends from the IEPF (form IEPF-5)","hi":"IEPF से शेयर या लाभांश वापस पाएँ (फ़ॉर्म IEPF-5)"},"when":{"en":"Use this when the company confirms that your shares or dividends were moved to the IEPF.","hi":"जब कंपनी पक्का बता दे कि आपके शेयर या लाभांश IEPF में भेजे जा चुके हैं।"},"steps":[{"text":{"en":"Fill form IEPF-5 online yourself. Forms on paper are rejected.","hi":"फ़ॉर्म IEPF-5 खुद ऑनलाइन भरें। कागज़ पर भरे फ़ॉर्म अस्वीकार हो जाते हैं।"},"sourceId":"iepf-documents"},{"text":{"en":"The form is on the MCA portal (mca.gov.in): log in, open MCA services, then IEPF related services.","hi":"फ़ॉर्म MCA पोर्टल (mca.gov.in) पर है: लॉग-इन करें, MCA services खोलें, फिर IEPF related services।"},"sourceId":"iepf-claim-kit"},{"text":{"en":"No agent or professional is needed, and the government has appointed none. Do not pay anyone to \"recover\" your shares.","hi":"किसी एजेंट या पेशेवर की ज़रूरत नहीं है, और सरकार ने किसी को नियुक्त नहीं किया है। शेयर \"वापस दिलाने\" के लिए किसी को पैसे न दें।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"A legal heir first registers the transmission with the company, then files the claim.","hi":"कानूनी वारिस पहले कंपनी के पास ट्रांसमिशन (शेयर अपने नाम कराना) दर्ज कराएँ, फिर दावा करें।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"Print the filed form and post it, with the documents below, to the company's Nodal Officer at its registered office. Then upload the postal receipt on the MCA portal.","hi":"भरे हुए फ़ॉर्म का प्रिंट, नीचे दिए दस्तावेज़ों के साथ, कंपनी के रजिस्टर्ड ऑफ़िस में नोडल अधिकारी को डाक से भेजें। फिर डाक की रसीद MCA पोर्टल पर अपलोड करें।"},"sourceId":"iepf-claim-kit"},{"text":{"en":"The company then has 30 days to send its verification report to the IEPF.","hi":"इसके बाद कंपनी के पास IEPF को अपनी जाँच रिपोर्ट भेजने के लिए 30 दिन होते हैं।"},"sourceId":"iepf-verification-kit"},{"text":{"en":"The IEPF credits the shares to your demat account and pays the money to your bank account.","hi":"IEPF शेयर आपके डीमैट खाते में और पैसा आपके बैंक खाते में भेजता है।"},"sourceId":"iepf-claimant-faq"},{"text":{"en":"If the IEPF asks for a correction, you get one chance to resubmit, within 15 days.","hi":"अगर IEPF सुधार माँगे, तो दोबारा भेजने का एक ही मौका मिलता है, 15 दिनों के अंदर।"},"sourceId":"iepf-documents"}],"documents":{"sourceId":"iepf-documents","items":[{"en":"Acknowledgement of the online form, with its SRN number","hi":"ऑनलाइन फ़ॉर्म की पावती, SRN नंबर के साथ"},{"en":"Indemnity bond, original and signed: on stamp paper, unless you claim only money of ₹10,000 or less","hi":"क्षतिपूर्ति बॉन्ड (इंडेम्निटी बॉन्ड), मूल और हस्ताक्षर किया हुआ: स्टांप पेपर पर, जब तक दावा सिर्फ़ ₹10,000 या उससे कम पैसे का न हो"},{"en":"Advance receipt, original, with a revenue stamp, signed by you and witnesses","hi":"अग्रिम रसीद (एडवांस रसीद), मूल, रेवेन्यू स्टांप के साथ, आपके और गवाहों के हस्ताक्षर सहित"},{"en":"Original share certificates, or the demat statement for shares held in demat","hi":"मूल शेयर सर्टिफ़िकेट, या डीमैट में रखे शेयरों के लिए डीमैट स्टेटमेंट"},{"en":"Self-attested copies of PAN and Aadhaar","hi":"PAN और आधार की स्व-सत्यापित (सेल्फ़-अटेस्टेड) कॉपी"},{"en":"Client master list (CML) from your DP, and a cancelled cheque","hi":"आपके DP से क्लाइंट मास्टर लिस्ट (CML), और एक रद्द (कैंसल) किया हुआ चेक"}]}},{"id":"rbi-ombudsman","enabled":true,"issueIds":["bank"],"helplineId":"rbi-14448","title":{"en":"Complain to the RBI Ombudsman (bank, card, wallet)","hi":"RBI लोकपाल से शिकायत (बैंक, कार्ड, वॉलेट)"},"when":{"en":"Use this when your bank, card or wallet company has not replied in 30 days, or you are not satisfied with its reply.","hi":"जब आपके बैंक, कार्ड या वॉलेट कंपनी ने 30 दिनों में जवाब न दिया हो, या आप उसके जवाब से संतुष्ट न हों।"},"steps":[{"text":{"en":"First complain in writing to the bank or company, and keep the complaint number.","hi":"पहले बैंक या कंपनी को लिखित शिकायत करें और शिकायत नंबर सँभालकर रखें।"},"sourceId":"rbi-ios-faq"},{"text":{"en":"If it does not reply in 30 days (longer for some card and UPI disputes under RBI, NPCI or card-network rules), or you are not satisfied with its reply, you can go to the RBI Ombudsman.","hi":"अगर 30 दिनों में जवाब न आए (कुछ कार्ड और UPI विवादों में RBI, NPCI या कार्ड नेटवर्क के नियमों से ज़्यादा समय), या आप जवाब से संतुष्ट न हों, तो आप RBI लोकपाल के पास जा सकते हैं।"},"sourceId":"rbi-ios-faq"},{"text":{"en":"File within 90 days after that waiting period ends, or after the bank's last reply, whichever is later.","hi":"इंतज़ार का वह समय पूरा होने के बाद, या बैंक के आखिरी जवाब के बाद, जो भी बाद में हो, उसके 90 दिनों के अंदर शिकायत करें।"},"sourceId":"rbi-ios-faq"},{"text":{"en":"File online at cms.rbi.org.in, by e-mail to crpc@rbi.org.in, or by post: send the signed complaint form to the Centralised Receipt and Processing Centre, Reserve Bank of India, Central Vista, Sector 17, Chandigarh 160017.","hi":"cms.rbi.org.in पर ऑनलाइन, crpc@rbi.org.in पर ई-मेल से, या डाक से शिकायत करें: हस्ताक्षर किया हुआ शिकायत फ़ॉर्म इस पते पर भेजें — Centralised Receipt and Processing Centre, Reserve Bank of India, Central Vista, Sector 17, Chandigarh 160017।"},"sourceId":"rbi-ios-filing"},{"text":{"en":"Filing is free; you never need an agent. Someone you authorise in writing can file for you, but not a lawyer, unless the lawyer is the person affected.","hi":"शिकायत करना मुफ़्त है; किसी एजेंट की ज़रूरत नहीं। आप जिसे लिखित में अधिकार दें, वह आपकी ओर से शिकायत कर सकता है, पर वकील नहीं, जब तक वकील खुद प्रभावित व्यक्ति न हो।"},"sourceId":"rbi-ios-filing"},{"text":{"en":"A matter pending before, or decided by, a court, tribunal or arbitrator cannot be taken. A police complaint or criminal case does not stop you from complaining.","hi":"जो मामला किसी अदालत, ट्रिब्यूनल या पंच के पास है या उनसे तय हो चुका है, वह नहीं लिया जाता। पुलिस शिकायत या आपराधिक केस होने से आपकी शिकायत नहीं रुकती।"},"sourceId":"rbi-ios-faq"}],"documents":{"sourceId":"rbi-ios-faq","items":[{"en":"Your complaint to the bank and its reply, or proof that it did not reply","hi":"बैंक को की गई शिकायत और उसका जवाब, या जवाब न आने का सबूत"},{"en":"Account, card or transaction details, such as a statement showing the transaction","hi":"खाते, कार्ड या लेन-देन का विवरण, जैसे लेन-देन दिखाने वाला स्टेटमेंट"},{"en":"The complaint number","hi":"शिकायत नंबर"}]}},{"id":"insurance","enabled":true,"issueIds":["insurance"],"helplineId":"irdai-igcc","title":{"en":"Complain about insurance (insurer, IRDAI, Ombudsman)","hi":"बीमा की शिकायत (बीमा कंपनी, IRDAI, लोकपाल)"},"when":{"en":"Use this for a claim, policy or service problem with an insurance company.","hi":"बीमा कंपनी से क्लेम, पॉलिसी या सेवा की समस्या होने पर।"},"steps":[{"text":{"en":"Complain in writing to the insurer's Grievance Redressal Officer, with your documents.","hi":"बीमा कंपनी के शिकायत निवारण अधिकारी को अपने कागज़ों के साथ लिखित शिकायत करें।"},"sourceId":"irdai-consumer-affairs"},{"text":{"en":"The insurer must resolve it within two weeks.","hi":"बीमा कंपनी को दो हफ़्ते के अंदर इसका समाधान करना होता है।"},"sourceId":"irdai-consumer-affairs"},{"text":{"en":"Not resolved in two weeks, or unhappy with the reply? Go to IRDAI: call 155255, e-mail complaints@irdai.gov.in, or use the Bima Bharosa portal.","hi":"दो हफ़्ते में हल न हो, या जवाब से संतुष्ट न हों? IRDAI के पास जाएँ: 155255 पर कॉल करें, complaints@irdai.gov.in पर ई-मेल करें, या बीमा भरोसा पोर्टल का इस्तेमाल करें।"},"sourceId":"bima-bharosa-faq"},{"text":{"en":"You can also go to the Insurance Ombudsman if the insurer rejected your complaint, did not reply in one month, or replied unsatisfactorily. Complain within one year. A matter that is, or was, before a court, consumer forum or arbitrator is not taken.","hi":"अगर बीमा कंपनी ने शिकायत अस्वीकार कर दी, एक महीने में जवाब नहीं दिया, या जवाब संतोषजनक नहीं था, तो आप बीमा लोकपाल के पास भी जा सकते हैं। एक साल के अंदर शिकायत करें। जो मामला अदालत, उपभोक्ता अदालत या पंच के पास है या रह चुका है, वह नहीं लिया जाता।"},"sourceId":"insurance-ombudsman"}],"documents":{"items":[{"en":"Policy document and premium receipts","hi":"पॉलिसी के कागज़ और प्रीमियम की रसीदें"},{"en":"Claim papers and the insurer's letters","hi":"क्लेम के कागज़ और बीमा कंपनी के पत्र"},{"en":"Your complaint and its number","hi":"आपकी शिकायत और उसका नंबर"}]}},{"id":"nominee","enabled":true,"issueIds":[],"helplineId":"sebi-helpline","title":{"en":"Add or check a nominee (demat and mutual funds)","hi":"नॉमिनी जोड़ें या जाँचें (डीमैट और म्यूचुअल फ़ंड)"},"when":{"en":"Do this now, before anything happens, so that your family is not stuck later.","hi":"इसे अभी कर लें, किसी मुश्किल से पहले, ताकि बाद में परिवार परेशान न हो।"},"steps":[{"text":{"en":"Ask your DP (where your demat account is), or the mutual fund or its registrar, to add or change a nominee. You can do it online or on a paper form.","hi":"अपने DP (जहाँ डीमैट खाता है), या म्यूचुअल फ़ंड या उसके रजिस्ट्रार से नॉमिनी जोड़ने या बदलने को कहें। यह ऑनलाइन या कागज़ी फ़ॉर्म से हो सकता है।"},"sourceId":"sebi-nomination-2026"},{"text":{"en":"If you choose not to add a nominee, make sure that decision (opt-out) is recorded.","hi":"अगर आप नॉमिनी नहीं रखना चाहते, तो पक्का करें कि यह फ़ैसला (ऑप्ट-आउट) दर्ज हो।"},"sourceId":"sebi-nomination-2026"},{"text":{"en":"Accounts and folios without a nominee get reminders twice a year. They are not frozen: a message that threatens a freeze and asks for money is a warning sign.","hi":"बिना नॉमिनी वाले खातों और फ़ोलियो को साल में दो बार याद दिलाया जाता है। उन्हें फ़्रीज़ नहीं किया जाता: फ़्रीज़ की धमकी देकर पैसे माँगने वाला संदेश धोखाधड़ी का संकेत है।"},"sourceId":"sebi-nomination-2026"},{"text":{"en":"A nominee receives the holdings as a trustee for the legal heirs. Nomination alone does not decide who finally owns them.","hi":"नॉमिनी को होल्डिंग कानूनी वारिसों की ओर से, ट्रस्टी (देखरेख करने वाले) के रूप में मिलती है। सिर्फ़ नॉमिनी बना देने से यह तय नहीं होता कि आखिर में मालिक कौन होगा।"},"sourceId":"sebi-rta-faq"}]}]},"practice":{"schemaVersion":1,"before":[{"id":"before-ipo-quota","enabled":true,"question":{"en":"A WhatsApp group admin writes: \"Pay ₹2,000 to kavita.ipo.demo@ybl for an IPO allotment quota. Allotment is 100% sure for members.\" What is true?","hi":"व्हाट्सऐप ग्रुप का एडमिन लिखता है: \"IPO आवंटन कोटा के लिए kavita.ipo.demo@ybl पर ₹2,000 भेजें। सदस्यों को आवंटन 100% पक्का है।\" कौन-सी बात सही है?"},"options":[{"en":"Allotment can be sure if the group has a tie-up with a broker","hi":"ग्रुप का किसी ब्रोकर से जुड़ाव हो तो आवंटन पक्का हो सकता है"},{"en":"Nobody can promise an IPO allotment; you apply yourself through ASBA from your own bank account","hi":"IPO आवंटन का वादा कोई नहीं कर सकता; आवेदन आप खुद अपने बैंक खाते से ASBA के ज़रिए करते हैं"},{"en":"It is safe if the UPI ID belongs to someone you know","hi":"UPI आईडी किसी जान-पहचान वाले की हो, तो भुगतान सुरक्षित है"}],"correct":1},{"id":"before-recovery-agent","enabled":true,"question":{"en":"A caller says your father's old shares are with the IEPF, and his agent can get them back for a 10% fee paid today. What do you do?","hi":"एक कॉलर कहता है कि आपके पिता के पुराने शेयर IEPF में हैं, और उसका एजेंट आज 10% फ़ीस लेकर उन्हें वापस दिला देगा। आप क्या करेंगे?"},"options":[{"en":"Say no. Claim them yourself with form IEPF-5; no agent is needed","hi":"मना करें। फ़ॉर्म IEPF-5 से दावा खुद करें; किसी एजेंट की ज़रूरत नहीं"},{"en":"Pay, if the caller knows the folio number","hi":"कॉलर को फ़ोलियो नंबर पता हो, तो भुगतान कर दें"},{"en":"Pay half now and half after the shares arrive","hi":"आधी फ़ीस अभी और आधी शेयर मिलने के बाद दें"}],"correct":0},{"id":"before-fno-screenshots","enabled":true,"question":{"en":"A Telegram channel posts screenshots of 300% profit from its \"SEBI registered\" F&O calls. What does this tell you?","hi":"एक टेलीग्राम चैनल अपनी \"SEBI रजिस्टर्ड\" F&O कॉल से 300% मुनाफ़े के स्क्रीनशॉट डालता है। इससे क्या पता चलता है?"},"options":[{"en":"The screenshots prove that the calls work","hi":"स्क्रीनशॉट साबित करते हैं कि कॉल सही होती हैं"},{"en":"\"SEBI registered\" in the message means it is safe","hi":"संदेश में \"SEBI रजिस्टर्ड\" लिखा है, तो यह सुरक्षित है"},{"en":"Nothing yet: check the registration on SEBI's own website. SEBI found that 93% of individual F&O traders lost money","hi":"अभी कुछ नहीं: रजिस्ट्रेशन SEBI की अपनी वेबसाइट पर जाँचें। SEBI के अध्ययन में 93% व्यक्तिगत F&O ट्रेडरों को घाटा हुआ"}],"correct":2}],"after":[{"id":"after-borrow-jackpot","enabled":true,"question":{"en":"A \"mentor\" tells you to borrow from a loan app today and buy a \"jackpot\" option. What is the safest answer?","hi":"एक \"मेंटर\" कहता है कि आज ही लोन ऐप से उधार लेकर \"जैकपॉट\" ऑप्शन खरीदें। सबसे सुरक्षित जवाब क्या है?"},"options":[{"en":"Borrow only a small amount","hi":"थोड़ा-सा ही उधार लें"},{"en":"Ask the mentor for a written profit guarantee","hi":"मेंटर से मुनाफ़े की लिखित गारंटी माँगें"},{"en":"Do not borrow and do not pay: a sure or \"jackpot\" profit is a warning sign","hi":"न उधार लें, न भुगतान करें: पक्का या \"जैकपॉट\" मुनाफ़ा खतरे का संकेत है"}],"correct":2},{"id":"after-paid-fake-ipo","enabled":true,"question":{"en":"An hour ago you sent ₹5,000 by UPI to a fake IPO group. What do you do first?","hi":"आपने एक घंटा पहले UPI से एक नकली IPO ग्रुप को ₹5,000 भेज दिए। सबसे पहले क्या करें?"},"options":[{"en":"Wait for the group to reply","hi":"ग्रुप के जवाब का इंतज़ार करें"},{"en":"Call your bank and the cyber crime helpline 1930 now, and keep the screenshots","hi":"अभी अपने बैंक और साइबर अपराध हेल्पलाइन 1930 पर कॉल करें, और स्क्रीनशॉट सँभालकर रखें"},{"en":"Pay the \"refund processing\" fee they now ask for","hi":"वे अब जो \"रिफ़ंड प्रोसेसिंग\" फ़ीस माँग रहे हैं, वह भेज दें"}],"correct":1},{"id":"after-kyc-freeze","enabled":true,"question":{"en":"An SMS says your demat account will be frozen today unless you update KYC through a link and share the OTP. What do you do?","hi":"SMS आता है कि लिंक से KYC अपडेट करके OTP न बताया, तो आज आपका डीमैट खाता फ़्रीज़ हो जाएगा। आप क्या करेंगे?"},"options":[{"en":"Do not open the link or share the OTP; ask your DP or broker through their official app or number","hi":"लिंक न खोलें, OTP न बताएँ; अपने DP या ब्रोकर से उनके आधिकारिक ऐप या नंबर पर पूछें"},{"en":"Open the link, but do not type the OTP","hi":"लिंक खोल लें, पर OTP न डालें"},{"en":"Share the OTP, because KYC is a SEBI rule","hi":"OTP बता दें, क्योंकि KYC SEBI का नियम है"}],"correct":0}],"lesson":[{"title":{"en":"Nobody can promise profit or allotment","hi":"मुनाफ़े या आवंटन का वादा कोई नहीं कर सकता"},"text":{"en":"Sure returns, \"jackpot\" calls and sure IPO allotment are warning signs. Apply for an IPO yourself through ASBA, and check any adviser on SEBI's own website.","hi":"पक्का मुनाफ़ा, \"जैकपॉट\" कॉल और पक्का IPO आवंटन खतरे के संकेत हैं। IPO के लिए खुद ASBA से आवेदन करें, और किसी भी सलाहकार को SEBI की अपनी वेबसाइट पर जाँचें।"}},{"title":{"en":"Never pay to get money back","hi":"पैसा वापस पाने के लिए कभी फ़ीस न दें"},"text":{"en":"No agent is needed to claim from the IEPF or to complain to the RBI Ombudsman. A \"recovery\" or \"processing\" fee is a scam.","hi":"IEPF से दावा करने या RBI लोकपाल से शिकायत करने के लिए किसी एजेंट की ज़रूरत नहीं। \"रिकवरी\" या \"प्रोसेसिंग\" फ़ीस धोखाधड़ी है।"}},{"title":{"en":"Codes stay with you; report fast","hi":"कोड अपने पास रखें; जल्दी रिपोर्ट करें"},"text":{"en":"Never share an OTP or open a link from a message. If money went, call your bank and 1930 at once. No warning sign does not mean safe.","hi":"OTP कभी न बताएँ और संदेश का लिंक न खोलें। पैसा चला गया हो तो तुरंत बैंक और 1930 पर कॉल करें। संकेत न मिलने का मतलब सुरक्षित होना नहीं है।"}}],"habit":{"title":{"en":"SEVEN-DAY SAFETY PRACTICE","hi":"सात दिन का सुरक्षा अभ्यास"},"intro":{"en":"Use with fictional examples; never enter financial credentials.","hi":"काल्पनिक उदाहरणों से अभ्यास करें; अपना पासवर्ड, PIN या OTP जैसी बैंकिंग जानकारी कभी न डालें।"},"days":[{"en":"Practise pausing before a payment.","hi":"भुगतान से पहले रुकने का अभ्यास।"},{"en":"Find an institution’s official contact independently.","hi":"संस्था का आधिकारिक संपर्क खुद खोजें।"},{"en":"Explain why guaranteed returns are a warning.","hi":"समझाएँ कि पक्के मुनाफ़े का वादा खतरे का संकेत क्यों है।"},{"en":"Save the official cybercrime portal and remember 1930.","hi":"आधिकारिक साइबर अपराध पोर्टल का पता फ़ोन में सहेजें और 1930 याद रखें।"},{"en":"Practise writing a factual complaint.","hi":"तथ्यों पर आधारित शिकायत लिखने का अभ्यास।"},{"en":"Explain to a family member why no checker can certify safety.","hi":"परिवार के किसी सदस्य को समझाएँ कि कोई भी जाँच सुरक्षा का सबूत क्यों नहीं दे सकती।"},{"en":"Repeat the practice exercise and note what you still find confusing.","hi":"अभ्यास दोहराएँ, और जो बात अब भी समझ न आए, उसे लिख लें।"}],"footer":{"en":"This card makes no claim about actual behaviour change.","hi":"यह कार्ड यह दावा नहीं करता कि इससे आपकी आदतें सच में बदल जाएँगी।"}}},"emergency":{"schemaVersion":1,"eyebrow":{"en":"Act first. Learn later.","hi":"पहले बचाव, फिर जानकारी।"},"title":{"en":"What happened? Get your safety steps","hi":"क्या हुआ? अपने सुरक्षा कदम जानें"},"intro":{"en":"Answer a few quick questions and follow the steps in order. This app never asks for your OTP, PIN, password or card number.","hi":"कुछ छोटे सवालों के जवाब दें और कदम क्रम से उठाएँ। यह ऐप कभी आपका OTP, PIN, पासवर्ड या कार्ड नंबर नहीं माँगता।"},"callNow":{"helplineId":"cyber-1930","label":{"en":"Call 1930 now","hi":"अभी 1930 पर कॉल करें"},"note":{"en":"Sent money because of a suspicious message or call? Call the cyber crime helpline 1930 and your bank straight away, then come back to these steps.","hi":"संदिग्ध संदेश या कॉल के कारण पैसे भेजे? तुरंत साइबर अपराध हेल्पलाइन 1930 और अपने बैंक को कॉल करें, फिर इन कदमों पर लौटें।"}},"situationsQuestion":{"en":"1. What happened? Choose all that apply.","hi":"1. क्या हुआ? जो भी लागू हो, सब चुनें।"},"situations":[{"id":"received","label":{"en":"I only received a message or call","hi":"मुझे केवल संदेश या कॉल आया"}},{"id":"clicked","label":{"en":"I clicked a link or installed an app","hi":"मैंने लिंक खोला या ऐप इंस्टॉल किया"}},{"id":"shared","label":{"en":"I shared an OTP, PIN, password or screen access","hi":"मैंने OTP, PIN या पासवर्ड बताया, या किसी को अपनी स्क्रीन दिखाई या फ़ोन चलाने दिया"}},{"id":"paid","label":{"en":"I sent money or made a payment","hi":"मैंने पैसे भेजे या भुगतान किया"}}],"ongoingQuestion":{"en":"2. Is it still happening?","hi":"2. क्या यह अभी भी चल रहा है?"},"ongoingOptions":[{"id":"yes","label":{"en":"Yes, someone still has access or keeps asking","hi":"हाँ, किसी के पास अब भी मेरे फ़ोन/खाते तक पहुँच है, या कोई बार-बार पैसे या जानकारी माँग रहा है"}}
